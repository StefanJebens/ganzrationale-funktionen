            function (st) { return A.points(st, 'nx', g7.nx, g7.nxModel, { text: 'b) Gib die Schnittpunkte des Graphen von $f$ mit der $x$-Achse an. Verschiedene Punkte bekommen verschiedene Namen, z. B. $N_1$ und $N_2$.', name: 'b)', idBase: 'schnitt-nx' }); },
            function (st) { return A.points(st, 'sy', g7.sy, g7.syModel, { text: 'c) Gib den Schnittpunkt des Graphen mit der $y$-Achse an. Nenne ihn $S_y$.', name: 'c)', ph: 'z. B. S_y(0|1)', idBase: 'schnitt-sy' }); }
          ]
        }).el
      ]);

      // ---------- 8 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach);
      var s8 = E.section('Anwendung: ein Wurf', [
        A.wayStep(E, 'sach', 'Wann landet der Ball?', {
          task: ['Ein Ball wird von einer ' + g8.h0 + ' m hohen Aussichtsplattform schräg nach oben geworfen. Die Funktion $h$ mit $h(t)=' + g8.h + '$ und $t≥0$ beschreibt seine Höhe über dem Boden (in m) $t$ Sekunden nach dem Abwurf – bis er auf dem Boden aufkommt.',
            'Berechne, wie viele Sekunden nach dem Abwurf der Ball auf dem Boden aufkommt.'],
          T: g8.T, model: g8.model,
          parts: [function (st) {
            return A.sentence(['Antwortsatz: Der Ball kommt ', A.blank(st, 'antw', g8.r[1], { model: String(g8.r[1]), label: 'Zeit in Sekunden' }), ' Sekunden nach dem Abwurf auf dem Boden auf.']);
          }],
          tip: KP.tip('Die Gleichung hat zwei Lösungen. Schreibe beide auf. Prüfe dann, welche Lösung zur Bedingung $t≥0$ passt – nur sie gehört in den Antwortsatz.')
        }).el
      ]);

      // ---------- 9 Papier ----------
      var s9 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R);
          return {
            title: 'Nullstellen und Schnittpunkte',
            intro: 'Gegeben sind die Funktionen $f$, $g$ und $h$ mit $D_f=D_g=D_h=\\R$ und $f(x)=' + g.f + '$, $g(x)=' + g.g + '$ sowie $h(x)=' + g.hh + '$.',
            parts: [
              { t: 'Berechne die Nullstellen von $f$.', s: [ED.show(g.fWay), 'Die Nullstellen von $f$ sind ' + KP.A.zahl(g.r[0]) + ' und ' + g.r[1] + '.'] },
              { t: 'Berechne die Nullstellen von $g$.', s: [ED.show(g.gWay), 'Die Nullstellen von $g$ sind $−\\sqrt{' + g.m + '}$ und $\\sqrt{' + g.m + '}$.'] },
              { t: 'Gib die Schnittpunkte des Graphen von $f$ mit den Koordinatenachsen an.', s: ['$N_1(' + KP.A.zahl(g.r[0]) + '|0)$, $N_2(' + g.r[1] + '|0)$ und $S_y(0|' + KP.A.zahl(g.q) + ')$'] },
              { t: 'Begründe ohne Rechnung, warum $h$ keine Nullstelle hat.', s: ['Für alle $x∈\\R$ gilt $x^2≥0$, also $h(x)=x^2+' + g.e + '≥' + g.e + '>0$. Der Funktionswert ist nie 0, also hat $h$ keine Nullstelle.'] }
            ]
          };
        }).el
      ]);
      // ---------- 10 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var s10 = E.section('Zusatzaufgabe', [
        A.partsStep(E, 'zusatz', 'Genau eine Nullstelle', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          task: 'Gegeben ist $f$ mit $f(x)=' + g9.f + '$, $D_f=\\R$ und einer Zahl $c$. Für welchen Wert von $c$ hat $f$ genau eine Nullstelle? Wie lautet diese Nullstelle dann?',
          parts: [function (st) {
            return A.sentence(['$f$ hat genau eine Nullstelle, wenn $c=$ ', A.blank(st, 'c', g9.c, { model: String(g9.c), label: 'Wert von c' }), ' ist. Diese Nullstelle ist $x=$ ', A.blank(st, 'x', g9.x0, { model: KP.A.zahl(g9.x0), label: 'Nullstelle' }), '.']);
          }],
          tip: KP.tip('Denke an die pq-Formel. Was muss für den Term unter der Wurzel gelten, damit es nur eine Lösung gibt?')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche wiederholst du die Verfahren aus der Mittelstufe, mit denen du Nullstellen berechnest – und du übst, die Rechnung in der Oberstufe sauber aufzuschreiben.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]);
    }
  });
})();

</script>
<script>
// Woche 5: Nullstellen II – Ausklammern, Satz vom Nullprodukt, Linearfaktoren, Vielfachheit
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, M = KP.M, V = KP.V.w5, P = KP.P;

  KP.defineWeek({
    n: 5,
    order: ['einstieg', 'aus1', 'aus2', 'aus3', 'fehler', 'lf1', 'vielfach', 'lf2', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Ausklammern und Satz vom Nullprodukt ----------
      var s1 = E.section('Ausklammern und Satz vom Nullprodukt', [
        A.box('Satz vom Nullprodukt', [
          P('Ein Produkt ist genau dann 0, wenn mindestens einer seiner Faktoren 0 ist. Beispiel: $x·(x−5)=0⇔x=0∨x−5=0$.'),
          P('Kommt in jedem Summanden $x$ vor, kannst du $x$ (oder eine Potenz von $x$) **ausklammern**. Dann steht ein Produkt da, und du wendest den Satz vom Nullprodukt an.')
        ]),
        A.box('So schreibst du es auf', [
          P('**Beispiel:** Nullstellen von $f$ mit $f(x)=x^3−4x$ und $D_f=\\R$:'),
          ED.show(['f(x)=0', '<=>x^{3}−4x=0', '<=>x(x^{2}−4)=0', '<=>x=0∨x^{2}−4=0', '<=>x=0∨x=−2∨x=2']),
          A.list([
            'In Zeile 4 steht der Satz vom Nullprodukt: Jeder Faktor wird gleich 0 gesetzt, verbunden mit ∨.',
            'Die Lösung $x=0$ schreibst du in **jeder** weiteren Zeile wieder mit. Sonst wären die Zeilen nicht mehr äquivalent.',
            'Teile nie durch $x$. Denn $x$ kann 0 sein – dann geht die Lösung $x=0$ verloren.'
          ])
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 Ausklammern üben ----------
      var g1 = E.gen('aus1', V.aus1), g2 = E.gen('aus2', V.aus2);
      var s2 = E.section('Ausklammern üben', [
        A.wayStep(E, 'aus1', 'x ausklammern', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g1.f + '$ und $D_f=\\R$.',
          T: g1.T, model: g1.model,
          tip: KP.tip('Klammere so viel aus wie möglich, auch die Zahl. Beispiel: $5x^3−20x=5x(x^2−4)$.')
        }).el,
        A.wayStep(E, 'aus2', 'x² ausklammern', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g2.f + '$ und $D_f=\\R$.',
          T: g2.T, model: g2.model,
          tip: KP.tip('Klammere die kleinste vorkommende Potenz von $x$ aus. Beispiel: $x^4+2x^3=x^3(x+2)$. Aus $x^3=0$ folgt $x=0$.')
        }).el
      ]);

      // ---------- 3 Ausklammern und pq-Formel ----------
      var g3 = E.gen('aus3', V.aus3);
      var s3 = E.section('Ausklammern und pq-Formel', [
        A.wayStep(E, 'aus3', 'Erst ausklammern, dann pq-Formel', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g3.f + '$ und $D_f=\\R$.',
          T: g3.T, model: g3.model,
          tip: KP.tip('Nach dem Ausklammern steht in der Klammer eine quadratische Gleichung. Löse sie mit der pq-Formel und schreibe $x=0∨$ in jeder Zeile mit. Beispiel: $x=0∨x=3±\\sqrt{4}$ wird in der nächsten Zeile zu $x=0∨x=3±2$.')
        }).el
      ]);

      // ---------- 4 Fehlersuche ----------
      var g4 = E.gen('fehler', V.fehler);
      var s4 = E.section('Fehlersuche', [
        E.tasks('fehler', 'Wo steckt der Fehler?', [
          { q: 'In welcher Zeile steckt der Fehler?', o: ['Zeile 2', 'Zeile 3', 'Zeile 4'], a: 1, fix: 1 },
          { q: 'Welche Lösung geht dabei verloren?', pre: '$x=$', v: 0 },
          { q: 'Wie hätte Lisa richtig rechnen müssen?', o: ['$x$ ausklammern und den Satz vom Nullprodukt anwenden', 'zusätzlich durch $x^2$ teilen', 'die pq-Formel auf $x^3−' + g4.s * g4.s + 'x=0$ anwenden'], a: 0 }
        ], {
          before: [P('Lisa berechnet die Nullstellen von $f$ mit $f(x)=' + g4.f + '$ und $D_f=\\R$ so:'), ED.show(g4.lines, { cls: 'faulty' }),
            P('In ihrer Rechnung steckt ein Fehler: Eine Zeile ist nicht äquivalent zur Zeile davor.')]
        }).el
      ]);

      // ---------- 5 Linearfaktordarstellung ----------
      var g5 = E.gen('lf1', V.lf1);
      var s5 = E.section('Linearfaktordarstellung', [
        A.box('Linearfaktoren', [
          P('Kennst du alle Nullstellen $x_1$, $x_2$, $x_3$ einer ganzrationalen Funktion $f$ vom Grad 3, kannst du $f$ als Produkt schreiben:'),
          h('p', { class: 'formula' }, M.view('f(x)=a·(x−x_{1})·(x−x_{2})·(x−x_{3})')),
          P('Die Faktoren $(x−x_1)$ usw. heißen **Linearfaktoren**, $a$ ist der Leitkoeffizient. Umgekehrt liest du an dieser Darstellung die Nullstellen direkt ab – mit dem Satz vom Nullprodukt.'),
          P('Kommt ein Linearfaktor mehrfach vor, z. B. $(x−2)^2$, ist 2 eine **doppelte** Nullstelle (Vielfachheit 2). Eine ganzrationale Funktion vom Grad $n$ hat höchstens $n$ Nullstellen.')
        ]),
        A.partsStep(E, 'lf1', 'Nullstellen ablesen', {
          parts: [
            function (st) { st.mc = st.mc || []; return A.mc(E, 'lf1mc', T.lf, st.mc); },
            function (st) {
              return A.sentence(['Gegeben ist $f$ mit $f(x)=' + g5.f + '$ und $D_f=\\R$. Die einfache Nullstelle von $f$ ist ',
                A.blank(st, 'e', g5.r1, { model: KP.A.zahl(g5.r1), label: 'einfache Nullstelle' }), ', die doppelte Nullstelle ist ',
                A.blank(st, 'd', g5.r2, { model: KP.A.zahl(g5.r2), label: 'doppelte Nullstelle' }), '.']);
            }
          ]
        }).el
      ]);

      // ---------- 6 Vielfachheit am Graphen ----------
      var g6 = E.gen('vielfach', V.vielfach);
      var bsp = KP.graph({
        x: [-3, 3], y: [-3, 4], w: 300, step: [1, 1],
        curves: [{ f: KP.polyFn(KP.A.fromRoots(0.5, [-1, 2, 2])), label: 'f', at: 2.75 }],
        points: [{ x: -1, y: 0, label: 'N_1', dx: -26, dy: -10 }, { x: 2, y: 0, label: 'N_2', dx: -4, dy: 18 }],
        aria: 'Graph mit einer einfachen und einer doppelten Nullstelle'
      });
      var letters = ['A', 'B', 'C'];
      var s6 = E.section('Vielfachheit am Graphen', [
        A.box('Schneiden oder berühren?', [
          P('An einer Nullstelle mit **ungerader** Vielfachheit (einfach, dreifach …) schneidet der Graph die $x$-Achse: Die Funktionswerte wechseln dort das Vorzeichen.'),
          P('An einer Nullstelle mit **gerader** Vielfachheit (doppelt, vierfach …) berührt der Graph die $x$-Achse nur: Die Funktionswerte behalten ihr Vorzeichen.'),
          h('figure', { class: 'fig' }, bsp, h('figcaption', null, KP.rich('$f(x)=\\frac{1}{2}(x+1)(x−2)^2$: einfache Nullstelle −1 (der Graph schneidet die $x$-Achse), doppelte Nullstelle 2 (der Graph berührt sie).')))
        ]),
        E.tasks('vielfach', 'Welcher Graph passt?', [
          { q: 'Welcher Graph gehört zu $f$ mit $f(x)=' + g6.f + '$?', o: ['Graph A', 'Graph B', 'Graph C'], a: g6.correct, fix: 1 }
        ], {
          before: [h('div', { class: 'graph-row' }, g6.graphs.map(function (c, i) {
            return h('figure', { class: 'fig small' }, KP.graph({ x: [-4, 4], y: [-6, 6], w: 220, step: [1, 2], curves: [{ f: KP.polyFn(c) }], aria: 'Graph ' + letters[i] }),
              h('figcaption', null, 'Graph ' + letters[i]));
          }))]
        }).el
      ]);

      // ---------- 7 Linearfaktorzerlegung ----------
      var g7 = E.gen('lf2', V.lf2);
      var s7 = E.section('Linearfaktorzerlegung', [
        A.wayStep(E, 'lf2', 'Als Produkt schreiben', {
          before: [P('Jetzt gehst du den umgekehrten Weg: Du formst den Funktionsterm in ein Produkt aus Linearfaktoren um. Das ist eine Termumformung – die Zeilen beginnen deshalb mit =.')],
          task: 'Schreibe $f(x)=' + g7.f + '$ als Produkt von Linearfaktoren. Beginne mit $f(x)=' + g7.f + '$.',
          T: g7.T, model: g7.model,
          parts: [function (st) {
            return A.sentence(['Die Nullstelle 0 ist einfach, die Nullstelle ', A.blank(st, 'd', g7.r, { model: KP.A.zahl(g7.r), label: 'doppelte Nullstelle' }), ' ist doppelt.']);
          }],
          tip: KP.tip('Nach dem Ausklammern hilft eine binomische Formel. Beispiel: $x^2−10x+25=(x−5)^2$.')
        }).el
      ]);

      // ---------- 8 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach);
      var s8 = E.section('Anwendung: Flug einer Drohne', [
        A.wayStep(E, 'sach', 'Wann landet die Drohne?', {
          task: ['Eine Drohne startet zum Zeitpunkt $t=0$ vom Boden. Bis zur Landung beschreibt die Funktion $h$ mit $h(t)=' + g8.h + '$ und $t≥0$ ihre Flughöhe (in m) $t$ Minuten nach dem Start.',
            'Berechne, wann die Drohne wieder landet.'],
          T: g8.T, model: g8.model,
          parts: [function (st) {
            return A.sentence(['Antwortsatz: Die Drohne landet ', A.blank(st, 'antw', g8.b, { model: String(g8.b), label: 'Zeit in Minuten' }), ' Minuten nach dem Start.']);
          }],
          tip: KP.tip('Klammere $−t$ aus. Von den Lösungen gehört eine zum Start, eine liegt nicht in $t≥0$.')
        }).el
      ]);

      // ---------- 9 Papier ----------
      var s9 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R);
          return {
            title: 'Nullstellen, Linearfaktoren und Vielfachheit',
            intro: 'Gegeben sind die Funktionen $f$ und $g$ mit $D_f=D_g=\\R$ und $f(x)=' + g.f + '$ sowie $g(x)=' + g.g + '$.',
            parts: [
              { t: 'Berechne die Nullstellen von $f$.', s: [ED.show(g.fWay)] },
              { t: 'Gib die Linearfaktordarstellung von $f$ an.', s: ['$' + g.fLin + '$'] },
              { t: 'Berechne die Nullstellen von $g$ und gib ihre Vielfachheit an.', s: [ED.show(g.gWay), 'Die Nullstellen 0 und ' + KP.A.zahl(g.s) + ' sind beide doppelt, denn $g(x)=x^2·' + KP.A.lin(g.s) + '^2$.'] },
              { t: 'Beschreibe, wie der Graph von $g$ an seinen Nullstellen verläuft.', s: ['An beiden Nullstellen hat $g$ eine gerade Vielfachheit. Der Graph berührt die $x$-Achse dort nur und schneidet sie nicht.'] }
            ]
          };
        }).el
      ]);

      // ---------- 10 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var zst = E.obj('zusatz', {});
      var zf = ED.field(zst, 'term', { mode: 'term', v: 'x', label: 'Funktionsterm von f' });
      var s10 = E.section('Zusatzaufgabe', [
        E.step('zusatz', 'Eine Funktion bauen', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          body: [
            h('div', { class: 'task-text' }, P('Gib eine ganzrationale Funktion $f$ vom Grad 3 an, die bei $x=' + KP.A.zahl(g9.r) + '$ eine doppelte und bei $x=' + KP.A.zahl(g9.s) + '$ eine einfache Nullstelle hat und deren Graph die $y$-Achse im Punkt $S_y(0|' + KP.A.zahl(g9.y0) + ')$ schneidet.')),
            h('p', { class: 'ans-line' }, h('span', { class: 'pre' }, KP.M.view('f(x)=')), zf.el),
            KP.tip('Beginne mit der Linearfaktordarstellung $f(x)=a·(x−…)^2·(x−…)$. Setze dann $x=0$ ein, um $a$ zu bestimmen.')
          ],
          check: function () {
            var p;
            try { p = M.readPoly(zst.term, 'x'); } catch (e) { return { ok: false, msg: e.kind ? (e.kind === 'schreib' ? 'Schreibweise: ' : 'Rechnung: ') + e.msg : 'Diesen Term kann ich nicht lesen.' }; }
            var c = M.pf(p);
            if (c.length !== 4) return { ok: false, msg: 'Rechnung: Der Grad stimmt nicht. Gesucht ist eine Funktion 3. Grades.' };
            var f = KP.polyFn(c), d = KP.polyFn(c.slice(1).map(function (x, i) { return x * (i + 1); }));
            if (!M.near(f(g9.r), 0) || !M.near(d(g9.r), 0) || !M.near(f(g9.s), 0)) return { ok: false, msg: 'Rechnung: Die Nullstellen stimmen noch nicht.' };
            if (!M.near(f(0), g9.y0)) return { ok: false, msg: 'Rechnung: Der Graph schneidet die y-Achse noch nicht im richtigen Punkt.' };
            return { ok: true };
          },
          mark: function (m) { zf.el.classList.toggle('bad', !!m); },
          lock: function (ro, done) { zf.setReadOnly(ro); zf.el.classList.toggle('ok', !!done); },
          solution: function () { var k = g9.a === 1 ? '' : g9.a === -1 ? '−' : KP.A.zahl(g9.a) + '·'; return h('div', null, h('p', { class: 'sol-h' }, 'Musterlösung:'), P('$f(x)=' + k + KP.A.lin(g9.r) + '^2·' + KP.A.lin(g9.s) + '$, ausmultipliziert $f(x)=' + KP.A.term(g9.c) + '$')); },
          fill: function () { zf.set(M.ms(KP.A.term(g9.c))); }
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche lernst du neue Verfahren: Du klammerst aus, nutzt den Satz vom Nullprodukt, schreibst Funktionen als Produkt von Linearfaktoren und erkennst die Vielfachheit einer Nullstelle am Graphen.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]);
    }
  });
})();

</script>
<script>
// Woche 6: Grenzverhalten – lim-Schreibweise, Potenzfunktionen, Summand mit der höchsten Potenz; Ergänzung x⁻² und x⁻³ (nur x → ±∞)
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, M = KP.M, P = KP.P, S = KP.M.set, INF = Infinity;

  function infTxt(s) { return s > 0 ? '+∞' : '−∞'; }
  function limModel(name, p, v) {
    v = v || 'x';
    var mi = M.limitOf({ p: A.poly(p) }, -1), pl = M.limitOf({ p: A.poly(p) }, 1);
    return ['\\lim{' + v + '→−∞}' + name + '(' + v + ')=' + infTxt(mi.inf), '\\lim{' + v + '→+∞}' + name + '(' + v + ')=' + infTxt(pl.inf)];
  }
  // Summanden in gemischter Reihenfolge (höchste Potenz nicht vorn)
  function mixed(c, R) {
    var t = [];
    for (var i = c.length - 1; i >= 0; i--) if (c[i]) t.push([c[i], i]);
    t = R.shuffle(t);
    if (t[0][1] === c.length - 1 && t.length > 1) t.push(t.shift());
    var out = '';
    t.forEach(function (x) {
      var a = x[0], k = x[1], sign = a < 0 ? '−' : (out ? '+' : ''), abs = Math.abs(a);
      out += sign + (k > 0 && abs === 1 ? '' : String(abs)) + (k === 0 ? '' : k === 1 ? 'x' : 'x^{' + k + '}');
    });
    return out;
  }
  function poly(n, lead, R) { // Grad n, Leitkoeffizient lead, zwei weitere Summanden
    var c = new Array(n + 1).fill(0);
    c[n] = lead;
    c[n - 1 - R.int(0, 1)] = R.pick([-12, -8, 6, 10]);
    c[0] = R.pick([-5, -2, 3, 7]);
    return c;
  }
  function fmtA(a) { return (a < 0 ? '−' : '') + String(Math.abs(a)).replace('.', ','); }

  var V = KP.V.w6 = {
    leitterm: function (R) {
      return [0, 1].map(function () {
        var n = R.pick([3, 4, 5]), lead = R.pick([-3, -2, 2, 4]), other = R.pick([10, -12, 20]);
        var lower = n - 1, c0 = R.pick([3, -6, 5]);
        var terms = R.shuffle([[lead, n], [other, lower], [c0, 0]]);
        if (terms[0][1] === n) terms.push(terms.shift());
        var txt = function (x) { return (x[0] < 0 ? '−' : '') + Math.abs(x[0]) + (x[1] === 0 ? '' : x[1] === 1 ? 'x' : 'x^{' + x[1] + '}'); };
        var f = '';
        terms.forEach(function (x, i) { var s = txt(x); f += (i && x[0] > 0 ? '+' : '') + s; });
        return { q: 'Welcher Summand bestimmt das Grenzverhalten von $f$ mit $f(x)=' + f + '$?', o: ['$' + txt([lead, n]) + '$', '$' + txt([other, lower]) + '$', '$' + txt([c0, 0]) + '$'], a: 0 };
      });
    },
    angeben: function (R) {
      var nf = R.pick([3, 5]), ng = R.pick([4, 6]);
      var cf = poly(nf, R.pick([-3, -2, 2, 3]), R), cg = poly(ng, R.pick([-2, -1, 2, 4]), R);
      return { cf: cf, cg: cg, f: mixed(cf, R), g: mixed(cg, R), mf: limModel('f', cf), mg: limModel('g', cg) };
    },
    zuordnen: function (R) {
      var pool = [
        { c: [1, 0, -2, 0, 0.5], t: '\\frac{1}{2}x^{4}−2x^{2}+1' },
        { c: [2, 2, -1], t: '−x^{2}+2x+2' },
        { c: [0, -2, 0, 0.5], t: '\\frac{1}{2}x^{3}−2x' },
        { c: [1, 1, 0, -0.25], t: '−\\frac{1}{4}x^{3}+x+1' }
      ];
      var order = R.perm(4);
      return order.map(function (i) { return pool[i]; });
    },
    ergaenzung: function (R) { var c = R.pick([1, 2, 3]); return { c: c }; },
    sach: function (R) {
      var abc = R.pick([[20, 300, 200], [10, 180, 150], [20, 360, 100]]), a = abc[0], b = abc[1], c = abc[2], t = 25;
      // einzige Nullstelle von N (für t > 0), mit dem Newton-Verfahren
      for (var i = 0; i < 80; i++) t -= (-a * t * t * t + b * t * t + c) / (-3 * a * t * t + 2 * b * t);
      return { a: a, b: b, c: c, p: [c, 0, b, -a], t0: t };
    },
    papier: function (R) { return { r: R.pick([1, 2, 3]), s: R.pick([-1, 1]) }; },
    zusatz: function (R) { var k = R.pick([2, 3, 5]); return { k: k, set: S.iv(-INF, k, false, false) }; }
  };

  KP.defineWeek({
    n: 6,
    order: ['einstieg', 'potenz', 'leitterm', 'angeben', 'zuordnen', 'ergaenzung', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Einstieg ----------
      var s1 = E.section('Verhalten im Unendlichen', [
        A.box('Grenzverhalten', [
          P('Wie verhalten sich die Funktionswerte, wenn $x$ immer größer wird ($x→+∞$) oder immer kleiner ($x→−∞$)? Das ist das **Grenzverhalten** einer Funktion, auch Verhalten im Unendlichen genannt.'),
          P('Werden die Funktionswerte für $x→+∞$ beliebig groß, schreibt man:'),
          h('p', { class: 'formula' }, M.view('\\lim{x→+∞}f(x)=+∞')),
          P('Gelesen: „Der Limes von $f(x)$ für $x$ gegen plus unendlich ist plus unendlich.“ Werden die Funktionswerte beliebig klein (negativ mit beliebig großem Betrag), steht rechts $−∞$.'),
          P('**Beispiele:** Für $f(x)=x^2$ gilt $\\lim{x→−∞}f(x)=+∞$ und $\\lim{x→+∞}f(x)=+∞$. Für $g(x)=x^3$ gilt $\\lim{x→−∞}g(x)=−∞$ und $\\lim{x→+∞}g(x)=+∞$.'),
          P('Du schreibst immer $+∞$ oder $−∞$ – nie nur ∞. Jede Aussage über einen Grenzwert steht in einer eigenen Zeile.')
        ]),
        A.box('So tippst du einen Grenzwert', [
          A.list([
            'Die Taste „lim“ schreibt lim mit $x→$ darunter. Tippe dort +∞ oder −∞ und gehe mit ▶ wieder heraus.',
            'Dann folgen $f(x)$ (eigene Taste), das Gleichheitszeichen und das Ergebnis, z. B. +∞.'
          ])
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 Potenzfunktionen (Labor) ----------
      var lab1 = KP.lab({
        title: 'Potenzfunktionen',
        intro: 'Verändere die Hochzahl $n$ und den Faktor $a$ von $f(x)=a·x^n$. Beobachte, wohin der Graph ganz links und ganz rechts verläuft.',
        sliders: [
          { k: 'n', label: 'Hochzahl $n$', min: 1, max: 6, step: 1, v: 2 },
          { k: 'a', label: 'Faktor $a$', min: -3, max: 3, step: 0.5, v: 1, skip0: true }
        ],
        render: function (s) {
          var a = s.a, n = s.n;
          var term = 'f(x)=' + (a === 1 ? '' : a === -1 ? '−' : fmtA(a)) + 'x' + (n === 1 ? '' : '^{' + n + '}');
          return [h('p', { class: 'lab-term' }, M.view(term)),
            KP.graph({ x: [-3, 3], y: [-10, 10], w: 300, h: 300, step: [1, 5], grid: [1, 1], curves: [{ f: function (x) { return a * Math.pow(x, n); }, label: 'f', at: 1.6 }], aria: 'Graph von f' })];
        }
      });
      function row(par, sgn, mi, pl, key) {
        return function (st) {
          return A.sentence([key + ') $n$ ' + par + ', $a' + (sgn > 0 ? '>' : '<') + '0$: $\\lim{x→−∞}f(x)=$ ', A.inf(st, key + 'm', { inf: mi }, { label: key + ') für x gegen minus unendlich' }),
            ' und $\\lim{x→+∞}f(x)=$ ', A.inf(st, key + 'p', { inf: pl }, { label: key + ') für x gegen plus unendlich' }), '.'], { name: key + ')' });
        };
      }
      var s2 = E.section('Entdecken: Potenzfunktionen', [
        lab1,
        A.partsStep(E, 'potenz', 'Die vier Fälle', {
          task: 'Fülle die Lücken für $f(x)=a·x^n$ aus. Probiere im Labor alle vier Fälle aus.',
          parts: [row('gerade', 1, 1, 1, 'a'), row('gerade', -1, -1, -1, 'b'), row('ungerade', 1, -1, 1, 'c'), row('ungerade', -1, 1, -1, 'd')],
          tip: KP.tip('Stelle im Labor z. B. $n=2$ und $a=−1$ ein: Wohin zeigen die Enden des Graphen? Achte für $x→−∞$ auf das linke Ende, für $x→+∞$ auf das rechte.')
        }).el
      ]);

      // ---------- 3 Höchste Potenz (Labor) ----------
      var zooms = [[3, 20], [6, 150], [12, 1200], [25, 10000]];
      var lab2 = KP.lab({
        title: 'Die höchste Potenz setzt sich durch',
        intro: 'Der blaue Graph gehört zu $f(x)=a·x^3+b·x^2+c·x$, der gestrichelte zum Summanden $a·x^3$ allein. Vergrößere den Ausschnitt.',
        sliders: [
          { k: 'a', label: 'Leitkoeffizient $a$', min: -2, max: 2, step: 0.5, v: 0.5, skip0: true },
          { k: 'b', label: '$b$', min: -6, max: 6, step: 1, v: -3 },
          { k: 'c', label: '$c$', min: -10, max: 10, step: 1, v: -4 },
          { k: 'z', label: 'Ausschnitt', min: 0, max: 3, step: 1, v: 0, fmt: function (v) { return '±' + zooms[v][0]; } }
        ],
        render: function (s) {
          var Z = zooms[s.z], f = function (x) { return s.a * x * x * x + s.b * x * x + s.c * x; };
          return [h('p', { class: 'lab-term' }, M.view('f(x)=' + A.term([0, s.c, s.b, s.a].map(function (v) { return v; })))),
            KP.graph({ x: [-Z[0], Z[0]], y: [-Z[1], Z[1]], w: 300, h: 300, step: [Z[0], Z[1]], grid: [Z[0] / 3, Z[1] / 4], noTicks: true,
              curves: [{ f: function (x) { return s.a * x * x * x; }, cls: 'ref' }, { f: f, label: 'f', at: Z[0] * 0.55 }], aria: 'Graph von f und Graph des Summanden mit der höchsten Potenz' }),
            h('p', { class: 'lab-note' }, KP.rich('Ausschnitt: $−' + Z[0] + '≤x≤' + Z[0] + '$'))];
        }
      });
      var s3 = E.section('Der Summand mit der höchsten Potenz', [
        A.box('Warum die höchste Potenz entscheidet', [
          P('Für betragsgroße $x$ ist der Summand mit der höchsten Hochzahl betragsmäßig viel größer als alle anderen. Beispiel $f(x)=x^3−100x^2$ für $x=1000$: Der Summand $x^3$ ist eine Milliarde, der Summand $100x^2$ nur hundert Millionen.'),
          P('Deshalb hat eine ganzrationale Funktion dasselbe Grenzverhalten wie der Summand $a_n·x^n$ mit der höchsten Potenz. Es kommt nur auf den **Grad** $n$ (gerade oder ungerade) und das **Vorzeichen des Leitkoeffizienten** $a_n$ an.')
        ]),
        lab2,
        E.tasks('leitterm', 'Welcher Summand entscheidet?', V.leitterm).el
      ]);

      // ---------- 4 Grenzverhalten angeben ----------
      var g4 = E.gen('angeben', V.angeben);
      var s4 = E.section('Grenzverhalten angeben', [
        A.partsStep(E, 'angeben', 'Mit lim aufschreiben', {
          task: 'Gib das Grenzverhalten für $x→−∞$ und für $x→+∞$ an. Schreibe jede Aussage in eine eigene Zeile.',
          parts: [
            function (st) { return A.limits(st, 'f', { v: 'x', fn: { name: 'f', p: A.poly(g4.cf) } }, g4.mf, { text: 'a) $f(x)=' + g4.f + '$', name: 'a)', idBase: 'angeben-f' }); },
            function (st) { return A.limits(st, 'g', { v: 'x', fn: { name: 'g', p: A.poly(g4.cg) } }, g4.mg, { text: 'b) $g(x)=' + g4.g + '$', name: 'b)', idBase: 'angeben-g' }); }
          ],
          tip: KP.tip('Suche zuerst den Summanden mit der höchsten Potenz. Beispiel: Bei $4x^2−x^7$ entscheidet $−x^7$: ungerader Grad, negativer Leitkoeffizient.')
        }).el
      ]);

      // ---------- 5 Graphen zuordnen ----------
      var g5 = E.gen('zuordnen', V.zuordnen), L = ['A', 'B', 'C', 'D'];
      var terms5 = g5.map(function (x) { return x.t; });
      var s5 = E.section('Graphen zuordnen', [
        E.tasks('zuordnen', 'Welcher Term passt?', g5.map(function (x, i) {
          // feste Reihenfolge der Terme in den Antworten, richtige Antwort ist der Term zum Graphen i
          return { q: 'Welcher Funktionsterm gehört zu Graph ' + L[i] + '?', o: terms5.map(function (t) { return '$f(x)=' + t + '$'; }), a: i };
        }), {
          before: [P('Jeder Graph gehört zu genau einem der Terme. Achte auf die Enden der Graphen.'), A.figRow(g5.map(function (x, i) {
            return { g: { x: [-4, 4], y: [-6, 6], w: 200, step: [1, 2], noTicks: true, curves: [{ f: KP.polyFn(x.c) }], aria: 'Graph ' + L[i] }, cap: 'Graph ' + L[i] };
          }), 'four')]
        }).el
      ]);

      // ---------- 6 Ergänzung: negative Hochzahlen ----------
      var g6 = E.gen('ergaenzung', V.ergaenzung), c6 = g6.c;
      var s6 = E.section('Ergänzung: negative Hochzahlen', [
        A.box('Funktionen wie x⁻² und x⁻³', [
          P('Für $f(x)=x^{−2}=\\frac{1}{x^2}$ gilt: Je größer der Betrag von $x$, desto näher liegt $f(x)$ bei 0. Also $\\lim{x→−∞}f(x)=0$ und $\\lim{x→+∞}f(x)=0$. Der Graph nähert sich für $x→±∞$ immer mehr der $x$-Achse.'),
          P('Bei $g(x)=x^{−3}$ ist es genauso. Für negative $x$ sind die Funktionswerte von $x^{−3}$ aber negativ: Der Graph nähert sich der $x$-Achse dort von unten.'),
          P('Solche Funktionen sind nicht ganzrational. Ihr Verhalten bei $x=0$ untersuchst du hier nicht.')
        ]),
        A.partsStep(E, 'ergaenzung', 'Grenzverhalten von x⁻³', {
          task: ['Gegeben ist $g$ mit $g(x)=' + (c6 === 1 ? '' : c6 + '·') + 'x^{−3}$ und $D_g=\\R\\ohne\\{0\\}$.',
            A.fig({ x: [-4, 4], y: [-4, 4], w: 260, step: [1, 1], curves: [{ f: function (x) { return c6 / (x * x * x); }, label: 'g', at: 1.2 }], aria: 'Graph von g' })],
          parts: [
            function (st) { return A.limits(st, 'l', { v: 'x', fn: { name: 'g', lim: { plus: { num: 0 }, minus: { num: 0 } } } }, ['\\lim{x→−∞}g(x)=0', '\\lim{x→+∞}g(x)=0'], { text: 'a) Gib das Grenzverhalten von $g$ für $x→−∞$ und $x→+∞$ an.', name: 'a)', idBase: 'ergaenzung-l' }); },
            function (st) { return A.sentence(['b) Für $x→−∞$ nähert sich der Graph der $x$-Achse ', A.choice(st, 'seite', ['von unten', 'von oben'], 0, { R: E.rng('ergaenzung:seite') }), ', denn für $x<0$ sind die Funktionswerte ', A.choice(st, 'vz', ['negativ', 'positiv'], 0, { R: E.rng('ergaenzung:vz') }), '.'], { name: 'b)' }); }
          ]
        }).el
      ]);

      // ---------- 7 Sachaufgabe ----------
      var g7 = E.gen('sach', V.sach), p7 = g7.p;
      var s7 = E.section('Anwendung: ein Modell mit Grenzen', [
        A.partsStep(E, 'sach', 'Besucher im Freizeitpark', {
          task: ['Die Anzahl der Besucher in einem Freizeitpark wird $t$ Stunden nach der Öffnung durch $N(t)=' + A.term(p7, 't') + '$ beschrieben. Der Park ist 12 Stunden lang geöffnet.',
            A.fig({ x: [-1, 20], y: [-8000, 20000], w: 330, h: 240, step: [2, 4000], grid: [1, 2000], xName: 't', yName: 'N(t)', curves: [{ f: KP.polyFn(p7), dom: [0, 20] }], aria: 'Graph von N' })],
          parts: [
            function (st) { return A.limits(st, 'l', { v: 't', fn: { name: 'N', p: A.poly(p7) }, need: [1] }, ['\\lim{t→+∞}N(t)=−∞'], { text: 'a) Gib das Verhalten von $N(t)$ für $t→+∞$ an.', name: 'a)', idBase: 'sach-l' }); },
            function (st) { return A.mc(E, 'sach-mc', [{ q: 'b) Was folgt daraus für das Modell?', o: ['Es beschreibt die Besucherzahl nur für einen begrenzten Zeitraum – auf Dauer lieferte es negative Besucherzahlen.', 'Die Besucherzahl wächst auf Dauer über alle Grenzen.', 'Nach langer Zeit sind immer gleich viele Besucher im Park.'], a: 0 }], E.obj('sach-mc', [])); },
            function (st) {
              return A.sentence(['Antwortsatz: Erst etwa ', A.blank(st, 't0', g7.t0, { model: A.dec(Math.round(g7.t0 * 100) / 100, 2), label: 'Zeit in Stunden', round: 2 }),
                ' Stunden nach der Öffnung liefert das Modell negative Besucherzahlen. Während der Öffnungszeit ist es in dieser Hinsicht also ',
                A.choice(st, 'br', ['brauchbar', 'unbrauchbar'], 0, { R: E.rng('sach:br') }), '.'],
                { name: 'c)', text: 'c) Untersuche mit GeoGebra, ob das Modell während der Öffnungszeit negative Besucherzahlen liefert. Bestimme dazu die Nullstelle von $N$, gerundet auf zwei Nachkommastellen, und vervollständige den Antwortsatz.' });
            }
          ],
          tip: KP.tip('Achte auf den Summanden mit der höchsten Potenz von $t$ und auf sein Vorzeichen.')
        }).el
      ]);

      // ---------- 8 Papier ----------
      var s8 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R), r = g.r, s = g.s;
          var f1 = s > 0 ? '−3x^{4}+5x^{3}−x' : '2x^{5}−7x^{2}+1';
          var m1 = s > 0 ? ['\\lim{x→−∞}f(x)=−∞', '\\lim{x→+∞}f(x)=−∞'] : ['\\lim{x→−∞}f(x)=−∞', '\\lim{x→+∞}f(x)=+∞'];
          return {
            title: 'Grenzverhalten untersuchen',
            intro: 'Gegeben sind $f(x)=' + f1 + '$, $g(x)=(2−x)(x+' + r + ')^{2}$ und $k(x)=4x^{−2}$ mit $D_k=\\R\\ohne\\{0\\}$.',
            parts: [
              { t: 'Gib das Grenzverhalten von $f$ an und begründe es mit dem Summanden mit der höchsten Potenz.', s: [ED.show(m1, { nums: false }), 'Der Summand ' + (s > 0 ? '$−3x^4$' : '$2x^5$') + ' bestimmt das Verhalten: ' + (s > 0 ? 'gerader Grad, negativer Leitkoeffizient.' : 'ungerader Grad, positiver Leitkoeffizient.')] },
              { t: 'Untersuche das Grenzverhalten von $g$, ohne vollständig auszumultiplizieren.', s: ['Beim Ausmultiplizieren entsteht als höchste Potenz $(−x)·x^2=−x^3$. Also ' , ED.show(['\\lim{x→−∞}g(x)=+∞', '\\lim{x→+∞}g(x)=−∞'], { nums: false })] },
              { t: 'Gib das Grenzverhalten von $k$ für $x→±∞$ an.', s: [ED.show(['\\lim{x→−∞}k(x)=0', '\\lim{x→+∞}k(x)=0'], { nums: false })] },
              { t: 'Skizziere zu jeder der drei Funktionen, wie der Graph ganz links und ganz rechts verläuft.', s: ['$f$: ' + (s > 0 ? 'links unten, rechts unten' : 'links unten, rechts oben') + '; $g$: links oben, rechts unten; $k$: auf beiden Seiten nahe der $x$-Achse, oberhalb von ihr.'] }
            ]
          };
        }).el
      ]);

      // ---------- 9 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var s9 = E.section('Zusatzaufgabe', [
        A.partsStep(E, 'zusatz', 'Ein Parameter entscheidet', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          task: 'Gegeben ist $f$ mit $f(x)=(a−' + g9.k + ')·x^3+x^2$ und einer Zahl $a$. Für welche Werte von $a$ gilt $\\lim{x→+∞}f(x)=−∞$? Gib alle diese Werte als Menge an.',
          parts: [function (st) { return A.set(st, 'm', g9.set, { pre: 'a∈', name: 'Menge' }); }],
          tip: KP.tip('Für welche $a$ ist der Koeffizient von $x^3$ negativ? Denke auch an den Fall, dass er 0 ist – welcher Summand entscheidet dann?')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche untersuchst du, wie sich ganzrationale Funktionen für sehr große und sehr kleine $x$ verhalten, und schreibst es mit lim auf.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9]);
    }
  });
})();

<script>
// Woche 7: Symmetrie – Achsensymmetrie zur y-Achse, Punktsymmetrie zum Ursprung, Nachweis mit f(−x)
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, M = KP.M, P = KP.P;

  // Term mit (−x) statt x eingesetzt: c aufsteigend
  function subst(c, v) {
    v = v || 'x';
    var out = '';
    for (var k = c.length - 1; k >= 0; k--) {
      var a = c[k];
      if (!a) continue;
      var sign = a < 0 ? '−' : (out ? '+' : ''), abs = Math.abs(a);
      var coef = (k > 0 && abs === 1) ? '' : String(abs).replace('.', ',');
      out += sign + coef + (k === 0 ? '' : '(−' + v + ')' + (k > 1 ? '^{' + k + '}' : ''));
    }
    return out;
  }
  function neg(c) { return c.map(function (a) { return a ? -a : 0; }); }
  function mirrored(c) { return c.map(function (a, k) { return k % 2 ? -a : a; }); }
  var SYM = ['achsensymmetrisch zur $y$-Achse', 'punktsymmetrisch zum Ursprung', 'keine dieser beiden Symmetrien'];

  var V = KP.V.w7 = {
    exponenten: function (R) {
      var even = R.sample(['x^{4}−3x^{2}+1', '−2x^{6}+x^{2}', '5x^{2}−7', '(x+1)(x−1)'], 2);
      var odd = R.sample(['x^{3}−4x', '−2x^{5}+x', '3x', 'x^{7}−x^{3}'], 2);
      var none = R.sample(['x^{3}+2', 'x^{4}+x', '(x−1)^{2}', '2x^{5}−x^{2}'], 1);
      var qs = even.map(function (t) { return [t, 0]; }).concat(odd.map(function (t) { return [t, 1]; })).concat(none.map(function (t) { return [t, 2]; }));
      return R.shuffle(qs).map(function (x) { return { q: 'Welche Symmetrie hat der Graph von $f$ mit $f(x)=' + x[0] + '$?', o: SYM.slice(), a: x[1] }; });
    },
    achse: function (R) {
      var a = R.pick([1, 2, -1, 3]), b = R.pick([-3, -2, 4, 5]), c = R.pick([-5, 1, 3, 6]);
      var p = [c, 0, b, 0, a];
      return {
        p: p, f: A.term(p),
        T: { v: 'x', goal: 'kette', fns: { f: A.poly(p) }, start: { name: 'f', arg: A.poly([0, -1]), text: 'f(−x)' }, end: { name: 'f', arg: A.poly([0, 1]), f: 1, text: 'f(x)' } },
        model: ['f(−x)=' + subst(p) + '=' + A.term(mirrored(p)) + '=f(x)']
      };
    },
    punkt: function (R) {
      var five = R.pick([true, false]), a = R.pick([1, 2, -1]), b = R.pick([-4, -3, 2, 5]);
      var p = five ? [0, b, 0, 0, 0, a] : [0, b, 0, a];
      var m = mirrored(p);
      return {
        p: p, f: A.term(p),
        T: { v: 'x', goal: 'kette', fns: { g: A.poly(p) }, start: { name: 'g', arg: A.poly([0, -1]), text: 'g(−x)' }, end: { name: 'g', arg: A.poly([0, 1]), f: -1, text: '−g(x)' } },
        model: ['g(−x)=' + subst(p) + '=' + A.term(m) + '=−(' + A.term(p) + ')=−g(x)']
      };
    },
    gegen: function (R) {
      var t = R.pick([[0, 0, 1, 1], [0, 0, 2, 1], [0, 1, 0, 0, 1], [0, 2, 0, 0, 1], [0, 0, -1, 1]]);
      var f = KP.polyFn(t);
      return { p: t, f: A.term(t), f1: f(1), fm1: f(-1) };
    },
    punkte: function (R) {
      var a = R.pick([2, 3, -1]), b = R.pick([5, -4, 3]), c = R.pick([1, 4, -2]), d = R.pick([3, -6, 2]), z = R.pick([2, 3, 5]);
      return { a: a, b: b, c: c, d: d, z: z };
    },
    sach: function (R) {
      var v = R.pick([[0.01, 0.1, 6, 1.5, 4.2], [0.005, 0.2, 5, 1.3, 4.6], [0.01, 0.2, 6, 1.5, 5.8], [0.008, 0.15, 5.5, 1.4, 4.9]]);
      var a = v[0], b = v[1], c = v[2], w = v[3], H = v[4];
      var f = function (x) { return -a * Math.pow(x, 4) - b * x * x + c; };
      var p = [c, 0, -b, 0, -a];
      var x0 = Math.sqrt((-b + Math.sqrt(b * b + 4 * a * c)) / (2 * a));
      return { a: a, b: b, c: c, w: w, H: H, fw: f(w), passt: f(w) >= H, p: p, x0: x0,
        fTxt: '−' + A.dec(a) + 'x^{4}−' + A.dec(b) + 'x^{2}+' + A.dec(c),
        T: { v: 'x', goal: 'kette', fns: { f: M.poly([M.Q(Math.round(c * 1000), 1000), M.Q(0), M.Q(-Math.round(b * 1000), 1000), M.Q(0), M.Q(-Math.round(a * 1000), 1000)]) },
          start: { name: 'f', arg: A.poly([0, -1]), text: 'f(−x)' }, end: { name: 'f', arg: A.poly([0, 1]), f: 1, text: 'f(x)' } } };
    },
    papier: function (R) { return { k: R.pick([2, 3]), m: R.pick([1, 4]) }; },
    zusatz: function (R) { return { y0: R.pick([2, 3, 4]) }; }
  };

  KP.defineWeek({
    n: 7,
    order: ['einstieg', 'lab', 'exponenten', 'achse', 'punkt', 'gegen', 'punkte', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Einstieg ----------
      var gEven = { x: [-3, 3], y: [-3, 4], w: 220, step: [1, 1], curves: [{ f: function (x) { return 0.25 * x * x * x * x - 1.5 * x * x + 1; }, label: 'f', at: 2.6 }], aria: 'achsensymmetrischer Graph' };
      var gOdd = { x: [-3, 3], y: [-3.5, 3.5], w: 220, step: [1, 1], curves: [{ f: function (x) { return 0.25 * x * x * x - 1.5 * x; }, label: 'g', at: 2.75 }], points: [{ x: 0, y: 0, cls: 'blue' }], aria: 'punktsymmetrischer Graph' };
      var s1 = E.section('Zwei besondere Symmetrien', [
        A.box('Achsensymmetrie und Punktsymmetrie', [
          A.list([
            'Der Graph von $f$ ist **achsensymmetrisch zur $y$-Achse**, wenn für alle $x∈D_f$ gilt: $f(−x)=f(x)$. Spiegelt man ihn an der $y$-Achse, ändert er sich nicht.',
            'Der Graph von $f$ ist **punktsymmetrisch zum Ursprung**, wenn für alle $x∈D_f$ gilt: $f(−x)=−f(x)$. Dreht man ihn um 180° um den Ursprung, ändert er sich nicht.'
          ]),
          A.figRow([{ g: gEven, cap: 'achsensymmetrisch zur $y$-Achse' }, { g: gOdd, cap: 'punktsymmetrisch zum Ursprung' }], 'two')
        ]),
        A.box('Bei ganzrationalen Funktionen', [
          P('Kommen im Funktionsterm **nur gerade Hochzahlen** vor, ist der Graph achsensymmetrisch zur $y$-Achse. Das absolute Glied zählt dabei mit: Es gehört zu $x^0$, und 0 ist gerade.'),
          P('Kommen **nur ungerade Hochzahlen** vor, ist der Graph punktsymmetrisch zum Ursprung. Kommen gerade und ungerade Hochzahlen vor, hat der Graph keine dieser beiden Symmetrien.')
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 Labor ----------
      var lab = KP.lab({
        title: 'Spiegeln',
        intro: 'Verändere die Koeffizienten von $f(x)=a·x^3+b·x^2+c·x+d$ und schalte die Spiegelbilder ein. Wann fällt ein Spiegelbild mit dem Graphen von $f$ zusammen?',
        sliders: [
          { k: 'a', label: '$a$', min: -2, max: 2, step: 0.5, v: 0.5 },
          { k: 'b', label: '$b$', min: -2, max: 2, step: 0.5, v: 0 },
          { k: 'c', label: '$c$', min: -3, max: 3, step: 0.5, v: -1.5 },
          { k: 'd', label: '$d$', min: -3, max: 3, step: 0.5, v: 0 }
        ],
        toggles: [{ k: 'y', label: 'an der $y$-Achse gespiegelt', v: true }, { k: 'o', label: 'am Ursprung gespiegelt', v: false }],
        render: function (s) {
          var c = [s.d, s.c, s.b, s.a], f = KP.polyFn(c);
          var curves = [{ f: f, label: 'f', at: 2.2 }];
          if (s.y) curves.unshift({ f: function (x) { return f(-x); }, cls: 'c2 dash' });
          if (s.o) curves.unshift({ f: function (x) { return -f(-x); }, cls: 'c3 dash' });
          return [h('p', { class: 'lab-term' }, M.view('f(x)=' + A.term(c))),
            KP.graph({ x: [-3, 3], y: [-5, 5], w: 300, h: 300, step: [1, 1], curves: curves, aria: 'Graph von f und Spiegelbilder' }),
            h('p', { class: 'lab-note' }, 'orange: an der y-Achse gespiegelt, grün: am Ursprung gespiegelt')];
        }
      });
      var s2 = E.section('Entdecken: Spiegeln', [
        lab,
        A.partsStep(E, 'lab', 'Was hast du beobachtet?', {
          parts: [function (st) {
            return A.sentence(['Das orange Spiegelbild fällt mit dem Graphen zusammen, wenn nur Summanden mit ', A.choice(st, 'g', ['geraden', 'ungeraden'], 0, { R: E.rng('lab:g') }),
              ' Hochzahlen vorkommen ($a=0$ und $c=0$). Das grüne fällt mit ihm zusammen, wenn nur Summanden mit ', A.choice(st, 'u', ['ungeraden', 'geraden'], 0, { R: E.rng('lab:u') }),
              ' Hochzahlen vorkommen ($b=0$ und $d=0$).'], { name: '' });
          }],
          tip: KP.tip('Stelle zum Beispiel $a=0$ und $c=0$ ein und verändere $b$ und $d$. Probiere danach $b=0$ und $d=0$.')
        }).el
      ]);

      // ---------- 3 Hochzahlen ----------
      var s3 = E.section('Symmetrie am Term erkennen', [
        E.tasks('exponenten', 'Gerade oder ungerade?', V.exponenten, { before: [P('Steht der Term als Produkt da, multipliziere zuerst aus.')] }).el
      ]);

      // ---------- 4 Nachweis ----------
      var g4 = E.gen('achse', V.achse), g5 = E.gen('punkt', V.punkt);
      var s4 = E.section('Symmetrie nachweisen', [
        A.box('Der rechnerische Nachweis', [
          P('Du setzt $−x$ in den Funktionsterm ein und formst um. Das ist eine Termumformung: Du schreibst eine Kette mit =. Am Ende steht $f(x)$ oder $−f(x)$. Danach formulierst du das Ergebnis in einem Satz.'),
          P('**Beispiel 1:** $h(x)=x^4−2x^2$'),
          ED.show(['h(−x)=(−x)^{4}−2(−x)^{2}=x^{4}−2x^{2}=h(x)'], { nums: false }),
          P('Also ist der Graph von $h$ achsensymmetrisch zur $y$-Achse.'),
          P('**Beispiel 2:** $k(x)=x^3−x$'),
          ED.show(['k(−x)=(−x)^{3}−(−x)=−x^{3}+x=−(x^{3}−x)=−k(x)'], { nums: false }),
          P('Also ist der Graph von $k$ punktsymmetrisch zum Ursprung.')
        ]),
        A.wayStep(E, 'achse', 'Achsensymmetrie zeigen', {
          task: 'Zeige rechnerisch, dass der Graph von $f$ mit $f(x)=' + g4.f + '$ achsensymmetrisch zur $y$-Achse ist. Beginne mit $f(−x)=…$',
          T: g4.T, model: g4.model, keys: ['f(−x)', 'f(x)'], wayLabel: 'Deine Rechnung:',
          parts: [function (st) { return A.sentence(['Also ist der Graph von $f$ ', A.choice(st, 's', ['achsensymmetrisch zur $y$-Achse', 'punktsymmetrisch zum Ursprung'], 0, { R: E.rng('achse:s') }), '.'], { name: 'Ergebnis' }); }],
          tip: KP.tip('Setze $(−x)$ mit Klammern ein. Eine gerade Hochzahl macht das Minus weg: $(−x)^2=x^2$, $(−x)^4=x^4$.')
        }).el,
        A.wayStep(E, 'punkt', 'Punktsymmetrie zeigen', {
          task: 'Zeige rechnerisch, dass der Graph von $g$ mit $g(x)=' + g5.f + '$ punktsymmetrisch zum Ursprung ist. Beginne mit $g(−x)=…$',
          T: g5.T, model: g5.model, keys: ['g(−x)', 'g(x)'], wayLabel: 'Deine Rechnung:',
          parts: [function (st) { return A.sentence(['Also ist der Graph von $g$ ', A.choice(st, 's', ['achsensymmetrisch zur $y$-Achse', 'punktsymmetrisch zum Ursprung'], 1, { R: E.rng('punkt:s') }), '.'], { name: 'Ergebnis' }); }],
          tip: KP.tip('Eine ungerade Hochzahl lässt das Minus stehen: $(−x)^3=−x^3$. Klammere am Ende das Minus aus, damit $−g(x)$ dasteht.')
        }).el
      ]);

      // ---------- 5 Gegenbeispiel ----------
      var g6 = E.gen('gegen', V.gegen);
      var s5 = E.section('Keine Symmetrie', [
        A.box('Ein Gegenbeispiel genügt', [
          P('Die Bedingungen $f(−x)=f(x)$ bzw. $f(−x)=−f(x)$ müssen für **alle** $x$ gelten. Findest du eine einzige Stelle, an der sie nicht erfüllt sind, hat der Graph diese Symmetrie nicht.')
        ]),
        A.partsStep(E, 'gegen', 'Mit Zahlen widerlegen', {
          task: 'Gegeben ist $f$ mit $f(x)=' + g6.f + '$. Zeige mit den Stellen 1 und −1, dass der Graph keine dieser beiden Symmetrien hat.',
          parts: [function (st) {
            return A.sentence(['Es ist $f(1)=$ ', A.blank(st, 'a', g6.f1, { model: A.zahl(g6.f1), label: 'f(1)' }), ' und $f(−1)=$ ', A.blank(st, 'b', g6.fm1, { model: A.zahl(g6.fm1), label: 'f(−1)' }),
              '. Wegen $f(−1)≠f(1)$ ist der Graph nicht achsensymmetrisch zur $y$-Achse, und wegen $f(−1)≠−f(1)$ ist er nicht punktsymmetrisch zum Ursprung.'], { name: '' });
          }]
        }).el
      ]);

      // ---------- 6 Symmetrie nutzen ----------
      var g7 = E.gen('punkte', V.punkte);
      var s6 = E.section('Symmetrie nutzen', [
        A.partsStep(E, 'punkte', 'Punkte und Nullstellen ergänzen', {
          task: 'Nutze die Symmetrie. Du musst nichts rechnen.',
          parts: [
            function (st) { return A.points(st, 'q', [[-g7.a, g7.b]], ['Q(' + A.zahl(-g7.a) + '|' + A.zahl(g7.b) + ')'], { text: 'a) Der Graph von $f$ ist achsensymmetrisch zur $y$-Achse und geht durch $P(' + A.zahl(g7.a) + '|' + A.zahl(g7.b) + ')$. Gib einen weiteren Punkt $Q$ des Graphen an.', name: 'a)', ph: 'z. B. Q(1|2)', idBase: 'punkte-q' }); },
            function (st) { return A.points(st, 's', [[-g7.c, -g7.d]], ['T(' + A.zahl(-g7.c) + '|' + A.zahl(-g7.d) + ')'], { text: 'b) Der Graph von $g$ ist punktsymmetrisch zum Ursprung und geht durch $S(' + A.zahl(g7.c) + '|' + A.zahl(g7.d) + ')$. Gib einen weiteren Punkt $T$ des Graphen an.', name: 'b)', ph: 'z. B. T(1|2)', idBase: 'punkte-s' }); },
            function (st) { return A.sentence(['c) $h$ ist eine ganzrationale Funktion, deren Graph punktsymmetrisch zum Ursprung ist. $h$ hat die Nullstelle ' + g7.z + '. Dann hat $h$ auch die Nullstelle ', A.blank(st, 'n1', -g7.z, { model: A.zahl(-g7.z), label: 'weitere Nullstelle' }), '. Weil der Graph durch den Ursprung geht, ist auch ', A.blank(st, 'n0', 0, { model: '0', label: 'Nullstelle im Ursprung' }), ' eine Nullstelle.'], { name: 'c)' }); }
          ],
          tip: KP.tip('Achsensymmetrie: Das Vorzeichen der $x$-Koordinate ändert sich. Punktsymmetrie: Beide Vorzeichen ändern sich. Ein punktsymmetrischer Graph einer ganzrationalen Funktion geht immer durch den Ursprung.')
        }).el
      ]);

      // ---------- 7 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach), f8 = KP.polyFn(g8.p);
      var s7 = E.section('Anwendung: ein Tunnel', [
        A.wayStep(E, 'sach', 'Passt der Lastwagen durch?', {
          task: ['Der Querschnitt eines Tunnels wird durch $f(x)=' + g8.fTxt + '$ beschrieben ($x$ und $f(x)$ in m). Die $x$-Achse ist die Fahrbahn, die $y$-Achse die Mitte des Tunnels.',
            A.fig({ x: [-5.5, 5.5], y: [-0.5, 7], w: 320, h: 220, step: [1, 1], yName: 'f(x)', curves: [{ f: f8, dom: [-g8.x0, g8.x0] }], lines: [{ x1: -g8.w, y1: 0, x2: -g8.w, y2: g8.H, cls: 'gray' }, { x1: g8.w, y1: 0, x2: g8.w, y2: g8.H, cls: 'gray' }, { x1: -g8.w, y1: g8.H, x2: g8.w, y2: g8.H, cls: 'gray' }], aria: 'Querschnitt des Tunnels mit dem Umriss des Lastwagens' }),
            'a) Zeige, dass der Querschnitt achsensymmetrisch zur $y$-Achse ist.'],
          T: g8.T, model: ['f(−x)=' + subst(g8.p) + '=' + A.term(g8.p) + '=f(x)'], keys: ['f(−x)', 'f(x)'], wayLabel: 'a) Deine Rechnung:',
          parts: [function (st) {
            return A.sentence(['b) Ein Lastwagen ist ' + A.dec(2 * g8.w) + ' m breit und ' + A.dec(g8.H) + ' m hoch und fährt genau in der Mitte. Wegen der Symmetrie genügt es, eine Seite zu prüfen: $f(' + A.dec(g8.w) + ')≈$ ',
              A.blank(st, 'fw', g8.fw, { model: A.dec(Math.round(g8.fw * 100) / 100, 2), label: 'Höhe in m', round: 2 }), ' (bestimmt, gerundet auf zwei Nachkommastellen). Der Lastwagen ',
              A.choice(st, 'passt', ['passt durch', 'passt nicht durch'], g8.passt ? 0 : 1, { R: E.rng('sach:passt') }), '.'], { name: 'b)' });
          }],
          tip: KP.tip('Für b) darfst du den Rechner benutzen. Die Kanten des Lastwagens sind $' + A.dec(g8.w) + '$ m von der Mitte entfernt.')
        }).el
      ]);

      // ---------- 8 Papier ----------
      var s8 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R), k = g.k, m = g.m;
          return {
            title: 'Symmetrie untersuchen',
            intro: 'Gegeben sind $f(x)=x^4−' + (k + 1) + 'x^2$, $g(x)=' + A.term([0, m, 0, -1]) + '$ und $h(x)=x^3−x^2$.',
            parts: [
              { t: 'Untersuche die Graphen von $f$, $g$ und $h$ auf Symmetrie. Weise die Symmetrie rechnerisch nach bzw. widerlege sie mit einem Gegenbeispiel.', s: [
                ED.show(['f(−x)=(−x)^{4}−' + (k + 1) + '(−x)^{2}=x^{4}−' + (k + 1) + 'x^{2}=f(x)'], { nums: false }), 'Der Graph von $f$ ist achsensymmetrisch zur $y$-Achse.',
                ED.show(['g(−x)=' + subst([0, m, 0, -1]) + '=' + A.term([0, -m, 0, 1]) + '=−(' + A.term([0, m, 0, -1]) + ')=−g(x)'], { nums: false }), 'Der Graph von $g$ ist punktsymmetrisch zum Ursprung.',
                '$h(1)=0$ und $h(−1)=−2$. Wegen $h(−1)≠h(1)$ und $h(−1)≠−h(1)$ hat der Graph von $h$ keine dieser beiden Symmetrien.'] },
              { t: 'Berechne die Nullstellen von $f$ und prüfe, ob sie zur Symmetrie passen.', s: [ED.show(['f(x)=0', '<=>x^{4}−' + (k + 1) + 'x^{2}=0', '<=>x^{2}(x^{2}−' + (k + 1) + ')=0', '<=>x^{2}=0∨x^{2}−' + (k + 1) + '=0', '<=>x=0∨x=−\\sqrt{' + (k + 1) + '}∨x=\\sqrt{' + (k + 1) + '}']), 'Die Nullstellen $−\\sqrt{' + (k + 1) + '}$ und $\\sqrt{' + (k + 1) + '}$ liegen symmetrisch zur $y$-Achse – das passt zur Achsensymmetrie.'] },
              { t: 'Skizziere den Graphen von $g$. Nutze dazu $g(1)$, $g(2)$ und die Symmetrie.', s: ['$g(1)=' + (m - 1) + '$ und $g(2)=' + (2 * m - 8) + '$, also wegen der Punktsymmetrie auch $g(−1)=' + (1 - m) + '$ und $g(−2)=' + (8 - 2 * m) + '$.',
                A.fig({ x: [-3, 3], y: [-8, 8], w: 220, h: 260, step: [1, 2], curves: [{ f: function (x) { return -x * x * x + m * x; }, label: 'g', at: 2.3 }], aria: 'Graph von g' })] }
            ]
          };
        }).el
      ]);

      // ---------- 9 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var s9 = E.section('Zusatzaufgabe', [
        A.partsStep(E, 'zusatz', 'Eine symmetrische Funktion bauen', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          task: 'Gib den Term einer ganzrationalen Funktion $f$ vom Grad 4 an, deren Graph achsensymmetrisch zur $y$-Achse ist, die $y$-Achse im Punkt $S_y(0|' + g9.y0 + ')$ schneidet und die Nullstelle 1 hat.',
          parts: [function (st) {
            var model = A.term([g9.y0, 0, -g9.y0 - 1, 0, 1]);
            return A.polyProp(st, 'f', function (c) {
              var n = c.length - 1;
              while (n > 0 && Math.abs(c[n]) < 1e-12) n--;
              if (n !== 4) return 'Der Grad stimmt noch nicht.';
              for (var k = 1; k <= n; k += 2) if (Math.abs(c[k] || 0) > 1e-12) return 'Der Graph ist noch nicht achsensymmetrisch zur $y$-Achse.';
              if (Math.abs(c[0] - g9.y0) > 1e-9) return 'Der Graph schneidet die $y$-Achse noch nicht im richtigen Punkt.';
              if (Math.abs(c.reduce(function (a, b) { return a + b; }, 0)) > 1e-9) return '1 ist noch keine Nullstelle.';
              return true;
            }, model, { pre: 'f(x)=', name: 'Funktionsterm' });
          }],
          tip: KP.tip('Ein Term wie $a·x^4+b·x^2+c$ hat nur gerade Hochzahlen. Bestimme $c$ aus dem Schnittpunkt mit der $y$-Achse, wähle $a$ und bestimme dann $b$ aus $f(1)=0$.')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche untersuchst du die Graphen ganzrationaler Funktionen auf Symmetrie: am Term, im Labor und mit einem rechnerischen Nachweis.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9]);
    }
  });
})();

</script>
<script>
// Woche 8: Transformationen I – Verschieben in x- und y-Richtung, Spiegeln an den Achsen
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, M = KP.M, P = KP.P, S = KP.M.set;

  // Polynom-Hilfen (Koeffizienten aufsteigend, Zahlen)
  function padd(a, b) { var r = []; for (var i = 0; i < Math.max(a.length, b.length); i++) r.push((a[i] || 0) + (b[i] || 0)); return r; }
  function pmul(a, b) { var r = new Array(a.length + b.length - 1).fill(0); a.forEach(function (x, i) { b.forEach(function (y, j) { r[i + j] += x * y; }); }); return r; }
  function compose(f, g) { var r = [0]; for (var i = f.length - 1; i >= 0; i--) r = padd(pmul(r, g), [f[i]]); return r; } // f(g(x))
  function shiftX(f, c) { return compose(f, [-c, 1]); } // f(x − c)
  function scale(f, k) { return f.map(function (x) { return x * k; }); }
  function inner(c) { return c === 0 ? 'x' : 'x' + (c > 0 ? '−' + c : '+' + (-c)); } // x − c
  function sgn(d) { return d < 0 ? '−' + String(-d).replace('.', ',') : '+' + String(d).replace('.', ','); }
  // Term mit eingesetztem Klammerausdruck: f(…) für Koeffizienten c (aufsteigend), Argument als Text (z. B. "(x−2)")
  function substArg(c, arg) {
    var out = '';
    for (var k = c.length - 1; k >= 0; k--) {
      var a = c[k];
      if (!a) continue;
      var sign = a < 0 ? '−' : (out ? '+' : ''), abs = Math.abs(a);
      var coef = (k > 0 && abs === 1) ? '' : String(abs).replace('.', ',');
      out += sign + coef + (k === 0 ? '' : arg + (k > 1 ? '^{' + k + '}' : ''));
    }
    return out;
  }

  var V = KP.V.w8 = {
    verschieben: function (R) {
      var f = R.pick([[0, -2, 0, 1], [0, -3, 0, 1], [1, 0, -2], [0, 0, -3, 1]]), d = R.pick([-4, -2, 3, 5]), c = R.pick([-3, -2, 2, 4]);
      return { f: f, d: d, c: c, g: padd(f, [d]), hh: shiftX(f, c) };
    },
    normal: function (R) {
      var f = R.pick([[0, 2, 1], [0, -4, 1], [3, 0, 1], [0, 2, -1]]), c = R.pick([1, 2, -1, 3]);
      var hp = shiftX(f, c), arg = '(' + inner(c) + ')';
      var expanded = substArg(f, arg);
      return {
        f: f, c: c, hp: hp, fTxt: A.term(f),
        T: { v: 'x', goal: 'kette', fns: { h: A.poly(hp), f: A.poly(f) }, start: { name: 'h', arg: A.poly([0, 1]), text: 'h(x)' }, end: 'normal' },
        model: ['h(x)=f(' + inner(c) + ')=' + expanded, '=' + A.term(hp)]
      };
    },
    spiegeln: function (R) {
      var f = R.pick([[2, 0, -3, 1], [-1, 4, 0, 1], [1, -2, 1, -1], [4, 0, 0, -2, 1]]);
      return { f: f, g: scale(f, -1), k: f.map(function (a, i) { return i % 2 ? -a : a; }) };
    },
    ablesen: function (R) {
      var c = R.pick([-3, -2, -1, 1, 2, 3]), d = R.pick([-3, -2, -1, 1, 2, 3]);
      return { c: c, d: d, g: compose([0, 0, 1], [-c, 1]).map(function (x, i) { return i === 0 ? x + d : x; }) };
    },
    kombi: function (R) { var d = R.pick([2, 3, 4, 5]); return { d: d }; },
    sach: function (R) {
      var c = R.pick([2, 3]), d = R.pick([[3, 2], [1, 1], [2, 1]]), L = 6; // Rutsche f(x) = 4 − x²/3 + x³/27 auf [0; 6]
      var dv = d[0] / d[1];
      var f = [4, 0, -1 / 3, 1 / 27], g = padd(shiftX(f, c), [dv]);
      return { c: c, dv: dv, dTxt: A.dec(dv), L: L, f: f, g: g,
        P: M.poly([M.Q(4), M.Q(0), M.Q(-1, 3), M.Q(1, 27)]) };
    },
    papier: function (R) { return { c: R.pick([1, 2, 3]), d: R.pick([-2, -1, 3]) }; },
    zusatz: function (R) { var a = R.pick([-1, 0, 1]), k = R.pick([2, 3]), y = R.pick([3, 5, 7]); return { a: a, b: a + 2 * k, k: k, y: y, c: a + k, d: y - k * k }; }
  };

  KP.defineWeek({
    n: 8,
    order: ['einstieg', 'lab', 'verschieben', 'normal', 'spiegeln', 'ablesen', 'kombi', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Einstieg ----------
      var s1 = E.section('Graphen verschieben und spiegeln', [
        A.box('Vier Grundbewegungen', [
          P('Aus dem Graphen einer Funktion $f$ entsteht durch eine kleine Änderung am Term der Graph einer neuen Funktion $g$:'),
          A.list([
            '$g(x)=f(x)+d$: Verschiebung um $d$ in $y$-Richtung – für $d>0$ nach oben, für $d<0$ nach unten.',
            '$g(x)=f(x−c)$: Verschiebung um $c$ in $x$-Richtung – für $c>0$ nach **rechts**, für $c<0$ nach links.',
            '$g(x)=−f(x)$: Spiegelung an der $x$-Achse.',
            '$g(x)=f(−x)$: Spiegelung an der $y$-Achse.'
          ]),
          P('**Achtung beim Verschieben in $x$-Richtung:** Bei $f(x−2)$ wandert der Graph nach rechts, obwohl dort ein Minuszeichen steht. Denn $g(2)=f(0)$: Was $f$ an der Stelle 0 macht, macht $g$ erst an der Stelle 2.'),
          A.fig({ x: [-3, 5], y: [-2, 6], w: 300, step: [1, 1], curves: [{ f: function (x) { return x * x; }, cls: 'ref', label: 'f', at: -1.9, ldx: -18 }, { f: function (x) { return (x - 2) * (x - 2) + 1; }, label: 'g', at: 3.6 }],
            points: [{ x: 0, y: 0, cls: 'blue' }, { x: 2, y: 1, label: 'S', dx: 6, dy: 16 }], aria: 'Normalparabel und verschobene Parabel' },
            '$f(x)=x^2$ (gestrichelt) und $g(x)=f(x−2)+1=(x−2)^2+1$: um 2 nach rechts und um 1 nach oben verschoben. Der Scheitelpunkt wandert von $(0|0)$ nach $S(2|1)$.')
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 Labor ----------
      var base = [0, -1.5, 0, 0.5];
      var lab = KP.lab({
        title: 'Verschieben und Spiegeln',
        intro: 'Der gestrichelte Graph gehört zu $f(x)=0,5x^3−1,5x$. Verändere $c$ und $d$ und schalte die Spiegelungen ein. Der blaue Graph gehört zu $g$.',
        sliders: [
          { k: 'c', label: 'Verschiebung $c$ in $x$-Richtung', min: -4, max: 4, step: 1, v: 2 },
          { k: 'd', label: 'Verschiebung $d$ in $y$-Richtung', min: -4, max: 4, step: 1, v: 0 }
        ],
        toggles: [{ k: 'sx', label: 'an der $x$-Achse spiegeln', v: false }, { k: 'sy', label: 'an der $y$-Achse spiegeln', v: false }],
        note: 'Zuerst wird gespiegelt, danach verschoben.',
        render: function (s) {
          var f = KP.polyFn(base), c = s.c, d = s.d, sx = s.sx ? -1 : 1, sy = s.sy ? -1 : 1;
          var g = function (x) { return sx * f(sy * (x - c)) + d; };
          var arg = c === 0 ? (sy < 0 ? '−x' : 'x') : (sy < 0 ? '−(' + inner(c) + ')' : inner(c));
          var t = 'g(x)=' + (sx < 0 ? '−' : '') + 'f(' + arg + ')' + (d ? sgn(d) : '');
          return [h('p', { class: 'lab-term' }, M.view(t)),
            KP.graph({ x: [-6, 6], y: [-6, 6], w: 300, h: 300, step: [1, 1], curves: [{ f: f, cls: 'ref' }, { f: g, label: 'g', at: Math.max(-5, Math.min(5, c + 2.2)) }], aria: 'Graphen von f und g' })];
        }
      });
      var s2 = E.section('Entdecken', [
        lab,
        A.partsStep(E, 'lab', 'Was hast du beobachtet?', {
          parts: [function (st) {
            return A.sentence(['Ist $c>0$, wird der Graph nach ', A.choice(st, 'c', ['rechts', 'links'], 0, { R: E.rng('lab:c') }), ' verschoben. Ist $d<0$, wird er nach ',
              A.choice(st, 'd', ['unten', 'oben'], 0, { R: E.rng('lab:d') }), ' verschoben. Bei der Spiegelung an der $x$-Achse wechseln alle ', A.choice(st, 'v', ['$y$-Koordinaten', '$x$-Koordinaten'], 0, { R: E.rng('lab:v') }), ' ihr Vorzeichen.'], { name: '' });
          }]
        }).el
      ]);

      // ---------- 3 Terme angeben ----------
      var g3 = E.gen('verschieben', V.verschieben);
      var s3 = E.section('Terme nach einer Verschiebung', [
        A.partsStep(E, 'verschieben', 'Neue Funktionsterme', {
          task: 'Gegeben ist $f$ mit $f(x)=' + A.term(g3.f) + '$. Gib die Funktionsterme an. Ausmultiplizieren musst du nicht.',
          parts: [
            function (st) { return A.termIn(st, 'g', { v: 'x', p: A.poly(g3.g), fns: { f: A.poly(g3.f) } }, A.term(g3.f) + sgn(g3.d), { text: 'a) Der Graph von $f$ wird um ' + Math.abs(g3.d) + ' nach ' + (g3.d > 0 ? 'oben' : 'unten') + ' verschoben. So entsteht der Graph von $g$.', pre: 'g(x)=', name: 'a)' }); },
            function (st) { return A.termIn(st, 'h', { v: 'x', p: A.poly(g3.hh), fns: { f: A.poly(g3.f) } }, substArg(g3.f, '(' + inner(g3.c) + ')'), { text: 'b) Der Graph von $f$ wird um ' + Math.abs(g3.c) + ' nach ' + (g3.c > 0 ? 'rechts' : 'links') + ' verschoben. So entsteht der Graph von $h$.', pre: 'h(x)=', name: 'b)' }); }
          ],
          tip: KP.tip('Bei einer Verschiebung in $x$-Richtung ersetzt du jedes $x$ durch eine Klammer. Beispiel: Wird $x^2+x$ um 5 nach rechts verschoben, entsteht $(x−5)^2+(x−5)$.')
        }).el
      ]);

      // ---------- 4 Normalform ----------
      var g4 = E.gen('normal', V.normal);
      var s4 = E.section('Ausmultiplizieren', [
        A.wayStep(E, 'normal', 'Den neuen Term ausrechnen', {
          task: 'Gegeben ist $f(x)=' + g4.fTxt + '$. Der Graph von $f$ wird um ' + Math.abs(g4.c) + ' nach ' + (g4.c > 0 ? 'rechts' : 'links') + ' verschoben; so entsteht der Graph von $h$. Berechne die Normalform von $h(x)$. Beginne mit $h(x)=f(' + inner(g4.c) + ')=…$',
          T: g4.T, model: g4.model, keys: ['h(x)', 'f( )'], wayLabel: 'Deine Rechnung:',
          tip: KP.tip('Setze die Klammer ein, multipliziere mit einer binomischen Formel aus und fasse zusammen. Beispiel: $(x+3)^2=x^2+6x+9$.')
        }).el
      ]);

      // ---------- 5 Spiegeln ----------
      var g5 = E.gen('spiegeln', V.spiegeln);
      var s5 = E.section('Spiegeln', [
        A.partsStep(E, 'spiegeln', 'An den Achsen spiegeln', {
          task: 'Gegeben ist $f$ mit $f(x)=' + A.term(g5.f) + '$.',
          parts: [
            function (st) { return A.termIn(st, 'g', { v: 'x', p: A.poly(g5.g), fns: { f: A.poly(g5.f) } }, '−(' + A.term(g5.f) + ')', { text: 'a) Der Graph von $f$ wird an der $x$-Achse gespiegelt. Gib den Term der neuen Funktion $g$ an.', pre: 'g(x)=', name: 'a)' }); },
            function (st) { return A.termIn(st, 'k', { v: 'x', p: A.poly(g5.k), fns: { f: A.poly(g5.f) } }, A.term(g5.k), { text: 'b) Der Graph von $f$ wird an der $y$-Achse gespiegelt. Gib den Term der neuen Funktion $k$ an.', pre: 'k(x)=', name: 'b)' }); },
            function (st) { return A.mc(E, 'spiegeln-mc', [{ q: 'c) Für welche Funktionen ändert die Spiegelung an der $y$-Achse den Graphen nicht?', o: ['für Funktionen, deren Graph achsensymmetrisch zur $y$-Achse ist', 'für Funktionen, deren Graph punktsymmetrisch zum Ursprung ist', 'für alle ganzrationalen Funktionen'], a: 0 }], E.obj('spiegeln-mc', [])); }
          ],
          tip: KP.tip('Für b) ersetzt du jedes $x$ durch $(−x)$ und vereinfachst: $(−x)^3=−x^3$, $(−x)^2=x^2$.')
        }).el
      ]);

      // ---------- 6 Ablesen ----------
      var g6 = E.gen('ablesen', V.ablesen);
      var s6 = E.section('Verschiebung ablesen', [
        A.partsStep(E, 'ablesen', 'Woher kommt die Parabel?', {
          task: ['Der blaue Graph von $g$ entsteht aus der Normalparabel $f(x)=x^2$ (gestrichelt) durch eine Verschiebung.',
            A.fig({ x: [-6, 6], y: [-5, 7], w: 300, step: [1, 1], curves: [{ f: function (x) { return x * x; }, cls: 'ref' }, { f: function (x) { return (x - g6.c) * (x - g6.c) + g6.d; }, label: 'g', at: g6.c + 1.6 }], aria: 'Normalparabel und verschobene Parabel' })],
          parts: [
            function (st) {
              return A.sentence(['a) Der Graph ist um ', A.blank(st, 'cx', Math.abs(g6.c), { model: String(Math.abs(g6.c)), label: 'Verschiebung in x-Richtung' }), ' nach ', A.choice(st, 'cr', ['rechts', 'links'], g6.c > 0 ? 0 : 1, { R: E.rng('ablesen:cr') }),
                ' und um ', A.blank(st, 'dy', Math.abs(g6.d), { model: String(Math.abs(g6.d)), label: 'Verschiebung in y-Richtung' }), ' nach ', A.choice(st, 'do', ['oben', 'unten'], g6.d > 0 ? 0 : 1, { R: E.rng('ablesen:do') }), ' verschoben.'], { name: 'a)' });
            },
            function (st) { return A.termIn(st, 'g', { v: 'x', p: A.poly(g6.g) }, '(' + inner(g6.c) + ')^{2}' + sgn(g6.d), { text: 'b) Gib den Funktionsterm von $g$ an.', pre: 'g(x)=', name: 'b)' }); }
          ],
          tip: KP.tip('Verfolge den Scheitelpunkt: Bei der Normalparabel liegt er in $(0|0)$. Wo liegt er bei $g$?')
        }).el
      ]);

      // ---------- 7 Reihenfolge ----------
      var g7 = E.gen('kombi', V.kombi), d7 = g7.d;
      var s7 = E.section('Kommt es auf die Reihenfolge an?', [
        A.partsStep(E, 'kombi', 'Erst spiegeln oder erst verschieben?', {
          task: 'Der Graph von $f(x)=x^2$ wird an der $x$-Achse gespiegelt und um ' + d7 + ' nach oben verschoben – einmal in dieser, einmal in umgekehrter Reihenfolge.',
          parts: [
            function (st) { return A.termIn(st, 'g', { v: 'x', p: A.poly([d7, 0, -1]) }, '−x^{2}+' + d7, { text: 'a) Erst spiegeln, dann verschieben: Gib den Term von $g$ an.', pre: 'g(x)=', name: 'a)' }); },
            function (st) { return A.termIn(st, 'k', { v: 'x', p: A.poly([-d7, 0, -1]) }, '−(x^{2}+' + d7 + ')', { text: 'b) Erst verschieben, dann spiegeln: Gib den Term von $k$ an.', pre: 'k(x)=', name: 'b)' }); },
            function (st) { return A.sentence(['c) Der Scheitelpunkt von $g$ liegt bei $y=$ ', A.blank(st, 'sg', d7, { model: String(d7), label: 'y-Koordinate' }), ', der von $k$ bei $y=$ ', A.blank(st, 'sk', -d7, { model: A.zahl(-d7), label: 'y-Koordinate' }), '. Die Reihenfolge ', A.choice(st, 'r', ['spielt eine Rolle', 'spielt keine Rolle'], 0, { R: E.rng('kombi:r') }), '.'], { name: 'c)' }); }
          ],
          tip: KP.tip('Beim Spiegeln an der $x$-Achse wird der ganze bisherige Term mit −1 multipliziert. Was schon verschoben ist, wird mitgespiegelt.')
        }).el
      ]);

      // ---------- 8 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach), f8 = KP.polyFn(g8.f), gf8 = function (x) { return f8(x - g8.c) + g8.dv; };
      var s8 = E.section('Anwendung: eine Rutsche umbauen', [
        A.partsStep(E, 'sach', 'Die Rutsche wandert', {
          task: ['Das Profil einer Kinderrutsche wird durch $f(x)=4−\\frac{1}{3}x^2+\\frac{1}{27}x^3$ mit $D_f=[0;6]$ beschrieben ($x$ und $f(x)$ in m). Die Rutsche wird umgebaut: Sie steht jetzt auf einem ' + A.dec(g8.dv) + ' m hohen Podest und beginnt ' + g8.c + ' m weiter rechts. Ihr neues Profil beschreibt die Funktion $g$.',
            A.fig({ x: [-0.5, 10], y: [-0.5, 7], w: 330, h: 230, step: [1, 1], yName: 'y', curves: [{ f: f8, dom: [0, 6], ends: true, cls: 'ref', label: 'f', at: 1, ldx: -4 }, { f: gf8, dom: [g8.c, g8.c + 6], ends: true, label: 'g', at: g8.c + 1.2 }], aria: 'Profil der Rutsche vorher und nachher' })],
          parts: [
            function (st) { return A.termIn(st, 'g', { v: 'x', p: M.poly(g8.g.map(function (v) { var z = Math.round(v * 54); return M.Q(z, 54); })), fns: { f: g8.P } }, '4−\\frac{1}{3}(x−' + g8.c + ')^{2}+\\frac{1}{27}(x−' + g8.c + ')^{3}+' + g8.dTxt, { text: 'a) Gib den Funktionsterm von $g$ an. Ausmultiplizieren musst du nicht.', pre: 'g(x)=', name: 'a)' }); },
            function (st) { return A.set(st, 'D', S.iv(g8.c, g8.c + 6, true, true), { text: 'b) Gib die Definitionsmenge von $g$ an.', pre: 'D_{g}=', name: 'b)' }); },
            function (st) { return A.points(st, 'e', [[g8.c + 6, g8.dv]], ['E(' + (g8.c + 6) + '|' + g8.dTxt + ')'], { text: 'c) Gib den Endpunkt $E$ der neuen Rutsche an.', name: 'c)', ph: 'z. B. E(1|2)', idBase: 'sach-e' }); },
            function (st) {
              return A.sentence(['Antwortsatz: Die neue Rutsche beginnt ', A.blank(st, 'hs', 4 + g8.dv, { model: A.dec(4 + g8.dv), label: 'Höhe in m' }),
                ' m über dem Boden und überwindet einen Höhenunterschied von ', A.blank(st, 'hd', 4, { model: '4', label: 'Höhenunterschied in m' }), ' m.'],
                { name: 'd)', text: 'd) Gib an, in welcher Höhe die neue Rutsche beginnt und welchen Höhenunterschied sie überwindet. Vervollständige dazu den Antwortsatz.' });
            }
          ],
          tip: KP.tip('Ein Podest hebt die Rutsche an (Verschiebung in $y$-Richtung), „weiter rechts“ ist eine Verschiebung in $x$-Richtung. Auch die Definitionsmenge wandert mit.')
        }).el
      ]);

      // ---------- 9 Papier ----------
      var s9 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R), c = g.c, d = g.d;
          var gt = '−(x−' + c + ')^{2}' + sgn(d);
          return {
            title: 'Verschieben und Spiegeln',
            intro: 'Gegeben sind $f(x)=x^2$ und $g(x)=' + gt + '$ sowie $p(x)=x^3−x$.',
            parts: [
              { t: 'Beschreibe, wie der Graph von $g$ aus dem Graphen von $f$ entsteht, und gib den Scheitelpunkt von $g$ an.', s: ['Spiegelung an der $x$-Achse, dann Verschiebung um ' + c + ' nach rechts und um ' + Math.abs(d) + ' nach ' + (d > 0 ? 'oben' : 'unten') + '. Scheitelpunkt $S(' + c + '|' + A.zahl(d) + ')$.'] },
              { t: 'Berechne die Normalform von $g(x)$.', s: [ED.show(['g(x)=' + gt + '=−(x^{2}−' + 2 * c + 'x+' + c * c + ')' + sgn(d) + '=' + A.term([-c * c + d, 2 * c, -1])], { nums: false })] },
              { t: 'Skizziere die Graphen von $f$ und $g$ in einem Koordinatensystem.', s: [A.fig({ x: [-3, 6], y: [-6, 6], w: 260, step: [1, 1], curves: [{ f: function (x) { return x * x; }, cls: 'ref', label: 'f', at: -1.8, ldx: -16 }, { f: function (x) { return -(x - c) * (x - c) + d; }, label: 'g', at: c + 1.5 }], aria: 'Graphen von f und g' })] },
              { t: 'Der Graph von $p$ wird an der $y$-Achse gespiegelt. Gib den neuen Funktionsterm an und begründe das Ergebnis mit der Symmetrie des Graphen von $p$.', s: ['$p(−x)=(−x)^3−(−x)=−x^3+x$. Der Graph von $p$ ist punktsymmetrisch zum Ursprung: Spiegeln an der $y$-Achse wirkt deshalb wie Spiegeln an der $x$-Achse, also $p(−x)=−p(x)$.'] }
            ]
          };
        }).el
      ]);

      // ---------- 10 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var s10 = E.section('Zusatzaufgabe', [
        A.partsStep(E, 'zusatz', 'Die passende Verschiebung', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          task: 'Die Normalparabel $f(x)=x^2$ wird in $x$- und in $y$-Richtung verschoben. Der neue Graph geht durch $A(' + A.zahl(g9.a) + '|' + g9.y + ')$ und $B(' + g9.b + '|' + g9.y + ')$. Gib den Term der verschobenen Funktion $g$ an.',
          parts: [function (st) { return A.termIn(st, 'g', { v: 'x', p: A.poly([g9.c * g9.c + g9.d, -2 * g9.c, 1]) }, '(' + inner(g9.c) + ')^{2}' + sgn(g9.d), { pre: 'g(x)=', name: 'Funktionsterm' }); }],
          tip: KP.tip('$A$ und $B$ liegen gleich hoch. Wegen der Symmetrie der Parabel liegt der Scheitelpunkt genau in der Mitte zwischen ihnen.')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche verschiebst und spiegelst du Graphen – und siehst am Funktionsterm, was mit dem Graphen passiert.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]);
    }
  });
})();
