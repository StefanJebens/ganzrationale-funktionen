<script>
// Aufgaben mit eigenen Zahlen je Schüler (gleiches Niveau für alle). Jede Funktion bekommt den Zufallsgenerator R.
// Liefert Text, Prüfauftrag (T) und Musterlösung in Kurzschreibweise.
(function () {
  'use strict';
  var KP = window.KP, A = KP.A;
  var V = KP.V = { w4: {}, w5: {} };
  var t = A.term, z = A.zahl, kl = A.kl;
  function fnT(name, c, v, need, extra) {
    return Object.assign({ v: v || 'x', fn: { name: name, p: A.poly(c) }, start: 'ansatz', need: need || [], goal: 'loesen' }, extra || {});
  }
  // zwei ganzzahlige Nullstellen r1 < 0 < r2 mit gerader Summe ≠ 0 (pq-Formel ohne Brüche)
  function rootsPq(R, lo, hi) {
    var r1, r2, guard = 0;
    do { r1 = -R.int(1, lo); r2 = R.int(1, hi); guard++; } while (((r1 + r2) % 2 !== 0 || r1 + r2 === 0) && guard < 200);
    return [r1, r2];
  }
  // pq-Formel-Zeilen für x² + p·x + q = 0 mit ganzzahligen Nullstellen r1, r2 (Summe gerade)
  function pqLines(v, r1, r2, pre) {
    pre = pre || '';
    var half = -(r1 + r2) / 2, q = r1 * r2, m = -half, d = (r2 - r1) / 2;
    return [
      '<=>' + pre + v + '=' + z(m) + '±\\sqrt{' + kl(half) + '^{2}−' + kl(q) + '}',
      (pre ? '<=>' + pre + v + '=' : '=') + z(m) + '±\\sqrt{' + (d * d) + '}',
      (pre ? '<=>' + pre + v + '=' : '=') + z(m) + '±' + d,
      '<=>' + pre + v + '=' + r1 + '∨' + v + '=' + r2
    ];
  }
  V.pqLines = pqLines;
  V.rootsPq = rootsPq;

  // =====================================================================
  // Woche 4 – Nullstellen I
  // =====================================================================
  V.w4.bedienung = function (R) {
    var a = R.int(2, 5), s = R.int(2, 9), c = [-a * s, a];
    return {
      f: t(c), T: fnT('f', c),
      model: ['f(x)=0', '<=>' + t(c) + '=0', '<=>' + a + 'x=' + a * s, '<=>x=' + s]
    };
  };
  V.w4.linear = function (R) {
    var a = R.pick([4, 6]), k = R.pick([3, 5, 7, 9]), sg = R.pick([1, -1]);
    var x0 = sg * k / 2, c = [-a * x0, a];
    return {
      f: t(c), T: fnT('f', c), x0: x0,
      model: ['f(x)=0', '<=>' + t(c) + '=0', '<=>' + a + 'x=' + z(a * x0), '<=>x=' + z(sg * k, 2)]
    };
  };
  V.w4.wurzel1 = function (R) {
    var a = R.pick([2, 3, 5]), s = R.int(2, 7), c = [-a * s * s, 0, a];
    return {
      f: t(c), T: fnT('f', c, 'x', [], { pqHint: true }),
      model: ['f(x)=0', '<=>' + t(c) + '=0', '<=>' + a + 'x^{2}=' + a * s * s, '<=>x^{2}=' + s * s, '<=>x=−' + s + '∨x=' + s]
    };
  };
  V.w4.wurzel2 = function (R) {
    var n = R.pick([2, 3, 5, 6, 7, 10, 11, 13]), c = [-2 * n, 0, 2];
    return {
      f: t(c), T: fnT('f', c, 'x', [], { pqHint: true }), n: n,
      model: ['f(x)=0', '<=>' + t(c) + '=0', '<=>2x^{2}=' + 2 * n, '<=>x^{2}=' + n, '<=>x=−\\sqrt{' + n + '}∨x=\\sqrt{' + n + '}']
    };
  };
  V.w4.pq1 = function (R) {
    var r = rootsPq(R, 9, 9), c = A.fromRoots(1, r);
    return {
      f: t(c), T: fnT('f', c, 'x', ['pq']), r: r,
      model: ['f(x)=0', '<=>' + t(c) + '=0'].concat(pqLines('x', r[0], r[1]))
    };
  };
  V.w4.pq2 = function (R) {
    var a = R.pick([2, 3]), r = rootsPq(R, 6, 6), c = A.fromRoots(a, r), n = A.fromRoots(1, r);
    return {
      f: t(c), T: fnT('f', c, 'x', ['pq']), r: r,
      model: ['f(x)=0', '<=>' + t(c) + '=0', '<=>' + t(n) + '=0'].concat(pqLines('x', r[0], r[1]))
    };
  };
  V.w4.vergleich = function (R) {
    var s = R.int(3, 9), k = R.int(2, 9), r = rootsPq(R, 7, 7), pq = A.fromRoots(1, r);
    var O = ['nach $x^2$ umstellen und die Wurzel ziehen', 'mit der pq-Formel', '$x$ ausklammern und den Satz vom Nullprodukt anwenden'];
    return [
      { q: 'Welcher Weg führt bei $x^2−' + s * s + '=0$ am schnellsten zum Ziel?', o: O, a: 0 },
      { q: 'Welcher Weg führt bei $' + t(pq) + '=0$ am schnellsten zum Ziel?', o: O, a: 1 },
      { q: 'Welcher Weg führt bei $x^2−' + k + 'x=0$ am schnellsten zum Ziel?', o: O, a: 2 }
    ];
  };
  V.w4.schnitt = function (R) {
    var r = rootsPq(R, 6, 6), c = A.fromRoots(1, r);
    return {
      f: t(c), T: fnT('f', c, 'x', ['pq']), r: r, q: c[0],
      model: ['f(x)=0', '<=>' + t(c) + '=0'].concat(pqLines('x', r[0], r[1])),
      nx: [[r[0], 0], [r[1], 0]], nxModel: ['N_{1}(' + z(r[0]) + '|0)', 'N_{2}(' + z(r[1]) + '|0)'],
      sy: [[0, c[0]]], syModel: ['S_{y}(0|' + z(c[0]) + ')']
    };
  };
  V.w4.sach = function (R) {
    var pair = R.pick([[-1, 3], [-2, 4], [-1, 5], [-3, 5], [-2, 6], [-1, 7]]), c = A.fromRoots(-5, pair), n = A.fromRoots(1, pair);
    return {
      h: t(c, 't'), h0: c[0], r: pair,
      T: fnT('h', c, 't', ['pq'], { D: { lo: 0 } }),
      model: ['h(t)=0', '<=>' + t(c, 't') + '=0', '<=>' + t(n, 't') + '=0'].concat(pqLines('t', pair[0], pair[1]))
    };
  };
  V.w4.papier = function (R) {
    var a = R.pick([2, 3]), r = rootsPq(R, 5, 6), c = A.fromRoots(a, r), n = A.fromRoots(1, r);
    var b = R.pick([2, 3]), m = R.pick([5, 6, 7, 10, 11]), g = [-b * m, 0, b];
    var e = R.int(2, 9);
    return {
      f: t(c), g: t(g), hh: t([e, 0, 1]), r: r, q: c[0], m: m, e: e,
      fWay: ['f(x)=0', '<=>' + t(c) + '=0', '<=>' + t(n) + '=0'].concat(pqLines('x', r[0], r[1])),
      gWay: ['g(x)=0', '<=>' + t(g) + '=0', '<=>' + b + 'x^{2}=' + b * m, '<=>x^{2}=' + m, '<=>x=−\\sqrt{' + m + '}∨x=\\sqrt{' + m + '}']
    };
  };
  V.w4.zusatz = function (R) {
    var p = R.pick([4, 6, 8, 10, -4, -6, -8, -10]);
    return { p: p, c: (p / 2) * (p / 2), x0: -p / 2, f: 'x^{2}' + (p > 0 ? '+' + p : '−' + (-p)) + 'x+c' };
  };

  // =====================================================================
  // Woche 5 – Nullstellen II
  // =====================================================================
  V.w5.aus1 = function (R) {
    var a = R.pick([2, 3, 4]), s = R.int(2, 6), c = [0, -a * s * s, 0, a];
    return {
      f: t(c), T: fnT('f', c, 'x', ['ausklammern', 'nullprodukt']), s: s,
      model: ['f(x)=0', '<=>' + t(c) + '=0', '<=>' + a + 'x(x^{2}−' + s * s + ')=0', '<=>x=0∨x^{2}−' + s * s + '=0', '<=>x=0∨x=−' + s + '∨x=' + s]
    };
  };
  V.w5.aus2 = function (R) {
    var a = R.pick([2, 3, 4]), r = R.pick([-7, -6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 7]), c = [0, 0, -a * r, a];
    return {
      f: t(c), T: fnT('f', c, 'x', ['ausklammern', 'nullprodukt']), r: r,
      model: ['f(x)=0', '<=>' + t(c) + '=0', '<=>' + a + 'x^{2}' + A.lin(r) + '=0', '<=>x^{2}=0∨' + t([-r, 1]) + '=0', '<=>x=0∨x=' + z(r)]
    };
  };
  V.w5.aus3 = function (R) {
    var r = rootsPq(R, 6, 6), q = A.fromRoots(1, r), c = [0].concat(q);
    var lines = pqLines('x', r[0], r[1], 'x=0∨');
    return {
      f: t(c), T: fnT('f', c, 'x', ['ausklammern', 'nullprodukt', 'pq']), r: r,
      model: ['f(x)=0', '<=>' + t(c) + '=0', '<=>x(' + t(q) + ')=0', '<=>x=0∨' + t(q) + '=0'].concat([lines[0], lines[2], lines[3]])
    };
  };
  V.w5.fehler = function (R) {
    var s = R.int(2, 7), c = [0, -s * s, 0, 1];
    return {
      f: t(c), s: s,
      lines: ['f(x)=0', '<=>' + t(c) + '=0', '<=>x^{2}−' + s * s + '=0', '<=>x=−' + s + '∨x=' + s]
    };
  };
  V.w5.lf1 = function (R) {
    var a = R.pick([2, 3, -2, -3]), r1, r2;
    do { r1 = R.pick([-4, -3, -2, -1, 1, 2, 3, 4]); r2 = R.pick([-4, -3, -2, -1, 1, 2, 3, 4]); } while (r1 === r2);
    return { a: a, r1: r1, r2: r2, f: z(a) + A.lin(r1) + A.lin(r2) + '^{2}' };
  };
  V.w5.vielfach = function (R) {
    var a, b;
    do { a = R.pick([-2, -1, 1, 2]); b = R.pick([-2, -1, 0, 1, 2, 3]); } while (Math.abs(a - b) < 2);
    var fs = [
      { c: A.fromRoots(1, [a, a, b]), ok: true },
      { c: A.fromRoots(1, [a, b, b]) },
      { c: A.fromRoots(1, [a, b]) }
    ];

    var graphs = order.map(function (i) { return fs[i]; });
    var correct = graphs.findIndex(function (g) { return g.ok; });
    return { a: a, b: b, f: b === 0 ? 'x·' + A.lin(a) + '^{2}' : A.lin(a) + '^{2}·' + A.lin(b), graphs: graphs.map(function (g) { return g.c; }), correct: correct };
  };
  V.w5.lf2 = function (R) {
    var r = R.pick([-5, -4, -3, -2, 2, 3, 4, 5]), q = A.fromRoots(1, [r, r]), c = [0].concat(q);
    return {
      f: t(c), r: r, T: { v: 'x', fn: { name: 'f', p: A.poly(c) }, goal: 'faktor' },

      f: t(c), g: t(g), r: r, s: s,
      fWay: ['f(x)=0', '<=>' + t(c) + '=0', '<=>x(' + t(q) + ')=0', '<=>x=0∨' + t(q) + '=0'].concat([lines[0], lines[2], lines[3]]),
      fLin: 'f(x)=x' + A.lin(r[0]) + A.lin(r[1]),
      gWay: ['g(x)=0', '<=>' + t(g) + '=0', '<=>x^{2}(' + t(A.fromRoots(1, [s, s])) + ')=0', '<=>x^{2}=0∨' + t(A.fromRoots(1, [s, s])) + '=0', '<=>x=0∨' + A.lin(s) + '^{2}=0', '<=>x=0∨x=' + z(s)]

  };
  V.w5.zusatz = function (R) {
    var r = R.pick([1, 2, -1]), s, a = R.pick([1, 2, -1, -2]);
    do { s = R.pick([-3, -2, 2, 3]); } while (s === r);
    var c = A.fromRoots(a, [r, r, s]);
    return { r: r, s: s, a: a, c: c, y0: c[0] };
  };
})();

        A.wayStep(E, 'wurzel2', 'Wurzel, die stehen bleibt', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g4.f + '$ und $D_f=\\R$.',
          T: g4.T, model: g4.model
        }).el
      ]);

      // ---------- 5 pq-Formel ----------
      var g5 = E.gen('pq1', V.pq1), g6 = E.gen('pq2', V.pq2);
      var s5 = E.section('Die pq-Formel', [
        A.box('Erinnerung: pq-Formel', [
          P('Eine quadratische Gleichung in **Normalform** $x^2+px+q=0$ löst du mit der pq-Formel:'),
          h('p', { class: 'formula' }, KP.M.view('x=−\\frac{p}{2}±\\sqrt{(\\frac{p}{2})^{2}−q}')),
          P('Ist der Term unter der Wurzel negativ, hat die Gleichung keine Lösung. Ist er 0, hat sie genau eine Lösung. Steht vor $x^2$ eine andere Zahl als 1, teilst du zuerst durch diese Zahl.'),
          P('**Beispiel:** $x^2−6x+5=0$ mit $p=−6$ und $q=5$:'),
          ED.show(['x^{2}−6x+5=0', '<=>x=3±\\sqrt{(−3)^{2}−5}', '=3±\\sqrt{4}', '=3±2', '<=>x=1∨x=5'])
        ]),
        A.wayStep(E, 'pq1', 'pq-Formel', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g5.f + '$ und $D_f=\\R$.',
          T: g5.T, model: g5.model,
          tip: KP.tip('Schreibe zuerst die Zeile mit den eingesetzten Werten. Achte bei negativen Zahlen auf Klammern: Für $q=−8$ steht unter der Wurzel $…−(−8)$.')
        }).el,
        A.wayStep(E, 'pq2', 'Erst die Normalform', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g6.f + '$ und $D_f=\\R$.',
          T: g6.T, model: g6.model,
          tip: KP.tip('Teile die Gleichung zuerst durch die Zahl vor $x^2$. Beispiel: $5x^2−10x−15=0⇔x^2−2x−3=0$.')
        }).el
      ]);

      // ---------- 6 Vergleich ----------
      var s6 = E.section('Welcher Weg ist der beste?', [
        E.tasks('vergleich', 'Lösungswege vergleichen', V.vergleich, {
          before: [P('Nicht jede quadratische Gleichung braucht die pq-Formel. Überlege bei jeder Gleichung, welcher Weg am schnellsten zum Ziel führt.')]
        }).el
      ]);

      // ---------- 7 Schnittpunkte ----------
      var g7 = E.gen('schnitt', V.schnitt);
      var s7 = E.section('Schnittpunkte mit den Achsen', [
        A.wayStep(E, 'schnitt', 'Nullstellen und Schnittpunkte', {
          task: ['Gegeben ist die Funktion $f$ mit $f(x)=' + g7.f + '$ und $D_f=\\R$.', 'a) Berechne die Nullstellen von $f$.'],
          T: g7.T, model: g7.model, wayLabel: 'a) Dein Rechenweg:',
          parts: [
            function (st) { return A.points(st, 'nx', g7.nx, g7.nxModel, { text: 'b) Gib die Schnittpunkte des Graphen von $f$ mit der $x$-Achse an. Verschiedene Punkte bekommen verschiedene Namen, z. B. $N_1$ und $N_2$.', name: 'b)', idBase: 'schnitt-nx' }); },
            function (st) { return A.points(st, 'sy', g7.sy, g7.syModel, { text: 'c) Gib den Schnittpunkt des Graphen mit der $y$-Achse an. Nenne ihn $S_y$.', name: 'c)', ph: 'z. B. S_y(0|1)', idBase: 'schnitt-sy' }); }
          ]
        }).el
      ]);

      // ---------- 8 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach);
      var s8 = E.section('Anwendung: ein Wurf', [
        A.wayStep(E, 'sach', 'Wann landet der Ball?', {
          task: ['Ein Ball wird von einer ' + g8.h0 + ' m hohen Aussichtsplattform schräg nach oben geworfen. Die Funktion $h$ mit $h(t)=' + g8.h + '$ und $t≥0$ beschreibt seine Höhe über dem Boden (in m) $t$ Sekunden nach dem Abwurf – bis er auf dem Boden aufkommt.',
            'Berechne, wie viele Sekunden nach dem Abwurf der Ball auf dem Boden aufkommt.'],
          T: g8.T, model: g8.model,
          parts: [function (st) {
            return A.sentence(['Antwortsatz: Der Ball kommt ', A.blank(st, 'antw', g8.r[1], { model: String(g8.r[1]), label: 'Zeit in Sekunden' }), ' Sekunden nach dem Abwurf auf dem Boden auf.']);
          }],
          tip: KP.tip('Die Gleichung hat zwei Lösungen. Schreibe beide auf. Prüfe dann, welche Lösung zur Bedingung $t≥0$ passt – nur sie gehört in den Antwortsatz.')
        }).el
      ]);

      // ---------- 9 Papier ----------
      var s9 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R);
          return {
            title: 'Nullstellen und Schnittpunkte',
            intro: 'Gegeben sind die Funktionen $f$, $g$ und $h$ mit $D_f=D_g=D_h=\\R$ und $f(x)=' + g.f + '$, $g(x)=' + g.g + '$ sowie $h(x)=' + g.hh + '$.',
            parts: [
              { t: 'Berechne die Nullstellen von $f$.', s: [ED.show(g.fWay), 'Die Nullstellen von $f$ sind ' + KP.A.zahl(g.r[0]) + ' und ' + g.r[1] + '.'] },
              { t: 'Berechne die Nullstellen von $g$.', s: [ED.show(g.gWay), 'Die Nullstellen von $g$ sind $−\\sqrt{' + g.m + '}$ und $\\sqrt{' + g.m + '}$.'] },
              { t: 'Gib die Schnittpunkte des Graphen von $f$ mit den Koordinatenachsen an.', s: ['$N_1(' + KP.A.zahl(g.r[0]) + '|0)$, $N_2(' + g.r[1] + '|0)$ und $S_y(0|' + KP.A.zahl(g.q) + ')$'] },
              { t: 'Begründe ohne Rechnung, warum $h$ keine Nullstelle hat.', s: ['Für alle $x∈\\R$ gilt $x^2≥0$, also $h(x)=x^2+' + g.e + '≥' + g.e + '>0$. Der Funktionswert ist nie 0, also hat $h$ keine Nullstelle.'] }
            ]
          };
        }).el
      ]);
      // ---------- 10 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var s10 = E.section('Zusatzaufgabe', [
        A.partsStep(E, 'zusatz', 'Genau eine Nullstelle', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.',
          task: 'Gegeben ist $f$ mit $f(x)=' + g9.f + '$, $D_f=\\R$ und einer Zahl $c$. Für welchen Wert von $c$ hat $f$ genau eine Nullstelle? Wie lautet diese Nullstelle dann?',
          parts: [function (st) {
            return A.sentence(['$f$ hat genau eine Nullstelle, wenn $c=$ ', A.blank(st, 'c', g9.c, { model: String(g9.c), label: 'Wert von c' }), ' ist. Diese Nullstelle ist $x=$ ', A.blank(st, 'x', g9.x0, { model: KP.A.zahl(g9.x0), label: 'Nullstelle' }), '.']);
          }],
          tip: KP.tip('Denke an die pq-Formel. Was muss für den Term unter der Wurzel gelten, damit es nur eine Lösung gibt?')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche wiederholst du die Verfahren aus der Mittelstufe, mit denen du Nullstellen berechnest – und du lernst, wie du die Rechnung in der Oberstufe sauber aufschreibst.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]);
    }
  });
})();

<script>
// Woche 5: Nullstellen II – Ausklammern, Satz vom Nullprodukt, Linearfaktoren, Vielfachheit
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, M = KP.M, V = KP.V.w5, P = KP.P;

  KP.defineWeek({
    n: 5,
    order: ['einstieg', 'aus1', 'aus2', 'aus3', 'fehler', 'lf1', 'vielfach', 'lf2', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Ausklammern und Satz vom Nullprodukt ----------
      var s1 = E.section('Ausklammern und Satz vom Nullprodukt', [
        A.box('Satz vom Nullprodukt', [
          P('Ein Produkt ist genau dann 0, wenn mindestens einer seiner Faktoren 0 ist. Beispiel: $x·(x−5)=0⇔x=0∨x−5=0$.'),
          P('Kommt in jedem Summanden $x$ vor, kannst du $x$ (oder eine Potenz von $x$) **ausklammern**. Dann steht ein Produkt da, und du wendest den Satz vom Nullprodukt an.')
        ]),
        A.box('So schreibst du es auf', [
          P('**Beispiel:** Nullstellen von $f$ mit $f(x)=x^3−4x$ und $D_f=\\R$:'),
          ED.show(['f(x)=0', '<=>x^{3}−4x=0', '<=>x(x^{2}−4)=0', '<=>x=0∨x^{2}−4=0', '<=>x=0∨x=−2∨x=2']),
          A.list([
            'In Zeile 4 steht der Satz vom Nullprodukt: Jeder Faktor wird gleich 0 gesetzt, verbunden mit ∨.',
            'Die Lösung $x=0$ schreibst du in **jeder** weiteren Zeile wieder mit. Sonst wären die Zeilen nicht mehr äquivalent.',
            'Teile nie durch $x$. Denn $x$ kann 0 sein – dann geht die Lösung $x=0$ verloren.'
          ])
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 Ausklammern üben ----------
      var g1 = E.gen('aus1', V.aus1), g2 = E.gen('aus2', V.aus2);
      var s2 = E.section('Ausklammern üben', [
        A.wayStep(E, 'aus1', 'x ausklammern', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g1.f + '$ und $D_f=\\R$.',
          T: g1.T, model: g1.model,
          tip: KP.tip('Klammere so viel aus wie möglich, auch die Zahl. Beispiel: $5x^3−20x=5x(x^2−4)$.')
        }).el,
        A.wayStep(E, 'aus2', 'x² ausklammern', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g2.f + '$ und $D_f=\\R$.',
          T: g2.T, model: g2.model,
          tip: KP.tip('Klammere die kleinste vorkommende Potenz von $x$ aus. Beispiel: $x^4+2x^3=x^3(x+2)$. Aus $x^3=0$ folgt $x=0$.')
        }).el
      ]);

      // ---------- 3 Ausklammern und pq-Formel ----------
      var g3 = E.gen('aus3', V.aus3);
      var s3 = E.section('Ausklammern und pq-Formel', [
        A.wayStep(E, 'aus3', 'Erst ausklammern, dann pq-Formel', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g3.f + '$ und $D_f=\\R$.',
          T: g3.T, model: g3.model,
          tip: KP.tip('Nach dem Ausklammern steht in der Klammer eine quadratische Gleichung. Löse sie mit der pq-Formel und schreibe $x=0∨$ in jeder Zeile mit. Beispiel: $x=0∨x=3±\\sqrt{4}$ wird in der nächsten Zeile zu $x=0∨x=3±2$.')
        }).el
      ]);

      // ---------- 4 Fehlersuche ----------
      var g4 = E.gen('fehler', V.fehler);
      var s4 = E.section('Fehlersuche', [
        E.tasks('fehler', 'Wo steckt der Fehler?', [
          { q: 'In welcher Zeile steckt der Fehler?', o: ['Zeile 2', 'Zeile 3', 'Zeile 4'], a: 1, fix: 1 },
          { q: 'Welche Lösung geht dabei verloren?', pre: '$x=$', v: 0 },
          { q: 'Wie hätte Lisa richtig rechnen müssen?', o: ['$x$ ausklammern und den Satz vom Nullprodukt anwenden', 'zusätzlich durch $x^2$ teilen', 'die pq-Formel auf $x^3−' + g4.s * g4.s + 'x=0$ anwenden'], a: 0 }
        ], {
          before: [P('Lisa berechnet die Nullstellen von $f$ mit $f(x)=' + g4.f + '$ und $D_f=\\R$ so:'), ED.show(g4.lines, { cls: 'faulty' }),
            P('In ihrer Rechnung steckt ein Fehler: Eine Zeile ist nicht äquivalent zur Zeile davor.')]
        }).el
      ]);

      // ---------- 5 Linearfaktordarstellung ----------
      var g5 = E.gen('lf1', V.lf1);
      var s5 = E.section('Linearfaktordarstellung', [
        A.box('Linearfaktoren', [
          P('Kennst du alle Nullstellen $x_1$, $x_2$, $x_3$ einer ganzrationalen Funktion $f$ vom Grad 3, kannst du $f$ als Produkt schreiben:'),
          h('p', { class: 'formula' }, M.view('f(x)=a·(x−x_{1})·(x−x_{2})·(x−x_{3})')),
          P('Die Faktoren $(x−x_1)$ usw. heißen **Linearfaktoren**, $a$ ist der Leitkoeffizient. Umgekehrt liest du an dieser Darstellung die Nullstellen direkt ab – mit dem Satz vom Nullprodukt.'),
          P('Kommt ein Linearfaktor mehrfach vor, z. B. $(x−2)^2$, ist 2 eine **doppelte** Nullstelle (Vielfachheit 2). Eine ganzrationale Funktion vom Grad $n$ hat höchstens $n$ Nullstellen.')
        ]),
        A.partsStep(E, 'lf1', 'Nullstellen ablesen', {
          parts: [
            function (st) { st.mc = st.mc || []; return A.mc(E, 'lf1mc', T.lf, st.mc); },
            function (st) {
              return A.sentence(['Gegeben ist $f$ mit $f(x)=' + g5.f + '$ und $D_f=\\R$. Die einfache Nullstelle von $f$ ist ',
                A.blank(st, 'e', g5.r1, { model: KP.A.zahl(g5.r1), label: 'einfache Nullstelle' }), ', die doppelte Nullstelle ist ',
                A.blank(st, 'd', g5.r2, { model: KP.A.zahl(g5.r2), label: 'doppelte Nullstelle' }), '.']);
            }
          ]
        }).el
      ]);

      // ---------- 6 Vielfachheit am Graphen ----------
      var g6 = E.gen('vielfach', V.vielfach);
      var bsp = KP.graph({
        x: [-3, 3], y: [-3, 4], w: 300, step: [1, 1],
        curves: [{ f: KP.polyFn(KP.A.fromRoots(0.5, [-1, 2, 2])), label: 'f', at: 2.75 }],
        points: [{ x: -1, y: 0, label: 'N_1', dx: -26, dy: -10 }, { x: 2, y: 0, label: 'N_2', dx: -4, dy: 18 }],
        aria: 'Graph mit einer einfachen und einer doppelten Nullstelle'
      });
      var letters = ['A', 'B', 'C'];
      var s6 = E.section('Vielfachheit am Graphen', [
        A.box('Schneiden oder berühren?', [
          P('An einer Nullstelle mit **ungerader** Vielfachheit (einfach, dreifach …) schneidet der Graph die $x$-Achse: Die Funktionswerte wechseln dort das Vorzeichen.'),
          P('An einer Nullstelle mit **gerader** Vielfachheit (doppelt, vierfach …) berührt der Graph die $x$-Achse nur: Die Funktionswerte behalten ihr Vorzeichen.'),
          h('figure', { class: 'fig' }, bsp, h('figcaption', null, KP.rich('$f(x)=\\frac{1}{2}(x+1)(x−2)^2$: einfache Nullstelle −1 (der Graph schneidet die $x$-Achse), doppelte Nullstelle 2 (der Graph berührt sie).')))
        ]),
        E.tasks('vielfach', 'Welcher Graph passt?', [
          { q: 'Welcher Graph gehört zu $f$ mit $f(x)=' + g6.f + '$?', o: ['Graph A', 'Graph B', 'Graph C'], a: g6.correct, fix: 1 }
        ], {
          before: [h('div', { class: 'graph-row' }, g6.graphs.map(function (c, i) {
            return h('figure', { class: 'fig small' }, KP.graph({ x: [-4, 4], y: [-6, 6], w: 220, step: [1, 2], curves: [{ f: KP.polyFn(c) }], aria: 'Graph ' + letters[i] }),
              h('figcaption', null, 'Graph ' + letters[i]));
          }))]
        }).el
      ]);

      // ---------- 7 Linearfaktorzerlegung ----------
      var g7 = E.gen('lf2', V.lf2);
      var s7 = E.section('Linearfaktorzerlegung', [
        A.wayStep(E, 'lf2', 'Als Produkt schreiben', {
          before: [P('Jetzt gehst du den umgekehrten Weg: Du formst den Funktionsterm in ein Produkt aus Linearfaktoren um. Das ist eine Termumformung – die Zeilen beginnen deshalb mit =.')],
          task: 'Schreibe $f(x)=' + g7.f + '$ als Produkt von Linearfaktoren. Beginne mit $f(x)=' + g7.f + '$.',
          T: g7.T, model: g7.model,
          parts: [function (st) {
            return A.sentence(['Die Nullstelle 0 ist einfach, die Nullstelle ', A.blank(st, 'd', g7.r, { model: KP.A.zahl(g7.r), label: 'doppelte Nullstelle' }), ' ist doppelt.']);
          }],
          tip: KP.tip('Nach dem Ausklammern hilft eine binomische Formel. Beispiel: $x^2−10x+25=(x−5)^2$.')
        }).el
      ]);

      // ---------- 8 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach);
      var s8 = E.section('Anwendung: Flug einer Drohne', [
        A.wayStep(E, 'sach', 'Wann landet die Drohne?', {
          task: ['Eine Drohne startet zum Zeitpunkt $t=0$ vom Boden. Bis zur Landung beschreibt die Funktion $h$ mit $h(t)=' + g8.h + '$ und $t≥0$ ihre Flughöhe (in m) $t$ Minuten nach dem Start.',
            'Berechne, wann die Drohne wieder landet.'],
          T: g8.T, model: g8.model,
          parts: [function (st) {
            return A.sentence(['Antwortsatz: Die Drohne landet ', A.blank(st, 'antw', g8.b, { model: String(g8.b), label: 'Zeit in Minuten' }), ' Minuten nach dem Start.']);
          }],
          tip: KP.tip('Klammere $−t$ aus. Von den Lösungen gehört eine zum Start, eine liegt nicht in $t≥0$.')
        }).el
      ]);

      // ---------- 9 Papier ----------
      var s9 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R);
          return {
            title: 'Nullstellen, Linearfaktoren und Vielfachheit',
            intro: 'Gegeben sind die Funktionen $f$ und $g$ mit $D_f=D_g=\\R$ und $f(x)=' + g.f + '$ sowie $g(x)=' + g.g + '$.',
            parts: [
              { t: 'Berechne die Nullstellen von $f$.', s: [ED.show(g.fWay)] },
              { t: 'Gib die Linearfaktordarstellung von $f$ an.', s: ['$' + g.fLin + '$'] },
              { t: 'Berechne die Nullstellen von $g$ und gib ihre Vielfachheit an.', s: [ED.show(g.gWay), 'Die Nullstellen 0 und ' + KP.A.zahl(g.s) + ' sind beide doppelt, denn $g(x)=x^2·' + KP.A.lin(g.s) + '^2$.'] },
              { t: 'Beschreibe, wie der Graph von $g$ an seinen Nullstellen verläuft.', s: ['An beiden Nullstellen hat $g$ eine gerade Vielfachheit. Der Graph berührt die $x$-Achse dort nur und schneidet sie nicht.'] }
            ]
          };
        }).el
      ]);

      // ---------- 10 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var zst = E.obj('zusatz', {});
      var zf = ED.field(zst, 'term', { mode: 'term', v: 'x', label: 'Funktionsterm von f' });
      var s10 = E.section('Zusatzaufgabe', [
        E.step('zusatz', 'Eine Funktion bauen', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.',
          body: [
            h('div', { class: 'task-text' }, P('Gib eine ganzrationale Funktion $f$ vom Grad 3 an, die bei $x=' + KP.A.zahl(g9.r) + '$ eine doppelte und bei $x=' + KP.A.zahl(g9.s) + '$ eine einfache Nullstelle hat und deren Graph die $y$-Achse im Punkt $S_y(0|' + KP.A.zahl(g9.y0) + ')$ schneidet.')),
            h('p', { class: 'ans-line' }, h('span', { class: 'pre' }, KP.M.view('f(x)=')), zf.el),
            KP.tip('Beginne mit der Linearfaktordarstellung $f(x)=a·(x−…)^2·(x−…)$. Setze dann $x=0$ ein, um $a$ zu bestimmen.')
          ],
          check: function () {
            var p;
            try { p = M.readPoly(zst.term, 'x'); } catch (e) { return { ok: false, msg: e.kind ? (e.kind === 'schreib' ? 'Schreibweise: ' : 'Rechnung: ') + e.msg : 'Diesen Term kann ich nicht lesen.' }; }
            var c = M.pf(p);
            if (c.length !== 4) return { ok: false, msg: 'Rechnung: Der Grad stimmt nicht. Gesucht ist eine Funktion 3. Grades.' };
            var f = KP.polyFn(c), d = KP.polyFn(c.slice(1).map(function (x, i) { return x * (i + 1); }));
            if (!M.near(f(g9.r), 0) || !M.near(d(g9.r), 0) || !M.near(f(g9.s), 0)) return { ok: false, msg: 'Rechnung: Die Nullstellen stimmen noch nicht.' };
            if (!M.near(f(0), g9.y0)) return { ok: false, msg: 'Rechnung: Der Graph schneidet die y-Achse noch nicht im richtigen Punkt.' };
            return { ok: true };
          },
          mark: function (m) { zf.el.classList.toggle('bad', !!m); },
          lock: function (ro, done) { zf.setReadOnly(ro); zf.el.classList.toggle('ok', !!done); },
          solution: function () { var k = g9.a === 1 ? '' : g9.a === -1 ? '−' : KP.A.zahl(g9.a) + '·'; return h('div', null, h('p', { class: 'sol-h' }, 'Musterlösung:'), P('$f(x)=' + k + KP.A.lin(g9.r) + '^2·' + KP.A.lin(g9.s) + '$, ausmultipliziert $f(x)=' + KP.A.term(g9.c) + '$')); },
          fill: function () { zf.set(M.ms(KP.A.term(g9.c))); }
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche lernst du neue Verfahren: Du klammerst aus, nutzt den Satz vom Nullprodukt, schreibst Funktionen als Produkt von Linearfaktoren und erkennst die Vielfachheit einer Nullstelle am Graphen.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]);
    }
  });
})();

// Platzhalter für die Wochen, die nach dem Testballon gebaut werden: eine einfache Aufgabe 1 + 2
(function () {
  'use strict';

<script>
// Anbindung an die Lernseiten-Datenbank: Schüler-Anmeldung, Speichern, Sitzung (ein Gerät je Name), Lehrerkonto
(function () {
  'use strict';
  var KP = window.KP, h = KP.h;

    else if (c.art === 'akt') d.kreis(cx, cy, sz * 0.28, { fill: STIFT.akt });
    else d.kreuz(cx, cy, sz * 0.9, STIFT.offen);
    if (s.zahl) d.text(x + w * 0.66, cy + 3.2, s.zahl, { size: 8.5, bold: true, color: STIFT[c.art] });
  }
  function pdfLegende(d, y, aufgaben) {
    var x = 36, maxW = d.W - 72;
    d.haken(x + 5, y - 3, 8, STIFT.ok); d.text(x + 13, y, 'gelöst (Zahl: Fehlversuche vor der Lösung)', { size: 8 });
    var x2 = x + 13 + d.breite('gelöst (Zahl: Fehlversuche vor der Lösung)', 8) + 14;
    d.kreis(x2 + 4, y - 3, 2.6, { fill: STIFT.akt }); d.text(x2 + 11, y, 'aktuelle Aufgabe (Zahl: Fehlversuche)', { size: 8 });
    var x3 = x2 + 11 + d.breite('aktuelle Aufgabe (Zahl: Fehlversuche)', 8) + 14;
    d.kreuz(x3 + 4, y - 3, 8, STIFT.offen); d.text(x3 + 11, y, 'noch nicht gelöst', { size: 8 });
    y += 14;
    if (aufgaben) {
      var line = '';
      aufgaben.forEach(function (t) {
        var next = line ? line + '   ·   ' + t : t;
        if (d.breite(next, 8) > maxW && line) { d.text(x, y, line, { size: 8, color: [70, 76, 85] }); y += 11; line = t; } else line = next;
      });
      if (line) d.text(x, y, line, { size: 8, color: [70, 76, 85] });
    }
  }
  function pdfTabelle(d, o) {
    // o: { titel, unter, kopf: [Texte], breiten, zeilen: [{ links: [Texte], zellen: [c|null], rechts: [Texte] }], legende }
    var y, rowH = o.rowH || 17;
    function seite() {
      d.seite();
      d.text(36, 44, o.titel, { size: 14, bold: true });
      d.text(d.W - 36, 44, stand(), { size: 8.5, color: [95, 102, 112], align: 'right' });
      if (o.unter) d.text(36, 60, o.unter, { size: 9, color: [70, 76, 85] });
      y = o.unter ? 72 : 60;
      var x = 36;
      o.kopf.forEach(function (t, i) {
        d.rect(x, y, o.breiten[i], 20, { fill: [231, 234, 238], stroke: [170, 176, 184], lw: 0.4 });
        var w = o.breiten[i];
        d.text(i < o.links ? x + 4 : x + w / 2, y + 13.5, d.kuerzen(t, w - 6, 8.5, true), { size: 8.5, bold: true, align: i < o.links ? 'left' : 'center' });
        x += w;
      });
      y += 20;
    }
    seite();
    o.zeilen.forEach(function (r) {
      if (y + rowH > d.H - 70) seite();
      var x = 36, i = 0;
      r.links.forEach(function (t) {
        var w = o.breiten[i++];
        d.rect(x, y, w, rowH, { stroke: [170, 176, 184], lw: 0.4 });
        d.text(x + 4, y + rowH / 2 + 3.3, d.kuerzen(t, w - 7, 9, i === 1), { size: 9, bold: i === 1 });
        x += w;
      });
      r.zellen.forEach(function (c) { var w = o.breiten[i++]; pdfZelle(d, x, y, w, rowH, c); x += w; });
      r.rechts.forEach(function (t) {
        var w = o.breiten[i++];
        d.rect(x, y, w, rowH, { stroke: [170, 176, 184], lw: 0.4 });
        d.text(x + w / 2, y + rowH / 2 + 3.3, d.kuerzen(t, w - 6, 8.5), { size: 8.5, align: 'center' });
        x += w;
      });
      y += rowH;
    });
    if (y + 40 > d.H - 30) seite();
    pdfLegende(d, y + 22, o.legende);
  }
  function pdfWoche(g, n) {
    var wk = weekByN(n), cols = spalten(n), list = schuelerDer(g), d = LS.pdf({ quer: true });
    var frei = d.W - 72 - 150 - 70 - 46 - 84, cw = Math.min(34, Math.floor(frei / Math.max(1, cols.length)));
    var breiten = [150, 70].concat(cols.map(function () { return cw; }), [46, 84]);
    pdfTabelle(d, {
      titel: D.meta.longTitle + ' · ' + g.name + ' · Woche ' + n + ': ' + wk.title,
      kopf: ['Name', 'Benutzername'].concat(cols.map(function (id, i) { return String(i + 1); }), ['Erledigt', 'Zuletzt aktiv']),
      links: 2, breiten: breiten,
      zeilen: list.map(function (s) {
        var z = zellen(n, statusVon(s.sid, n));
        return { links: [s.nn + ', ' + s.vn, s.bn], zellen: z.z, rechts: [z.fertig + '/' + z.pflicht, wann((S.zuletzt || {})[s.sid], 'abs')] };
      }),
      legende: aufgabenListe(n)
    });
    LS.speichern(d.blob(D.meta.longTitle + ' ' + g.name + ' Woche ' + n), LS.dateiname(D.meta.datei + '_' + g.name + '_Woche_' + (n < 10 ? '0' : '') + n) + '.pdf');
  }
  function pdfSchueler(sid) {
    var s = S.schueler[sid], max = 0, d = LS.pdf({ quer: true });
    D.weeks.forEach(function (wk) { max = Math.max(max, spalten(wk.n).length); });
    var gn = Object.keys(s.gr || {}).filter(function (g) { return S.gruppen[g]; }).map(function (g) { return S.gruppen[g].name; }).join(', ');
    var frei = d.W - 72 - 250 - 46, cw = Math.min(34, Math.floor(frei / Math.max(1, max)));
    var breiten = [250]; for (var i = 0; i < max; i++) breiten.push(cw); breiten.push(46);
    var kopfT = ['Woche']; for (var k = 0; k < max; k++) kopfT.push(String(k + 1)); kopfT.push('Erledigt');
    pdfTabelle(d, {
      titel: D.meta.longTitle + ' · ' + s.vn + ' ' + s.nn + ' (' + s.bn + ')',
      unter: (gn ? 'Lerngruppe ' + gn + ' · ' : '') + 'zuletzt aktiv: ' + wann((S.zuletzt || {})[sid], 'abs') + ' · grau: diese Woche hat weniger Aufgaben',
      kopf: kopfT, links: 1, breiten: breiten, rowH: 22,
      zeilen: D.weeks.map(function (wk) {
        var z = zellen(wk.n, statusVon(sid, wk.n)), zz = [];
        for (var j = 0; j < max; j++) zz.push(z.z[j] || null);
        return { links: ['Woche ' + wk.n + ': ' + wk.title], zellen: zz, rechts: [z.fertig + '/' + z.pflicht] };
      }),
      legende: null
    });
    LS.speichern(d.blob(D.meta.longTitle + ' ' + s.vn + ' ' + s.nn), LS.dateiname(D.meta.datei + '_' + s.nn + '_' + s.vn) + '.pdf');
  }
})();

</script>
<script>
// Startseite, Platzhalter-Wochen und Navigation
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, S = KP.svg, D = KP.DATA;
  var app = document.getElementById('app');
  var cleanup = null;

  function weekByN(n) { for (var i = 0; i < D.weeks.length; i++) if (D.weeks[i].n === n) return D.weeks[i]; return null; }

  // ---------- gemeinsame Bausteine ----------
  KP.modeChip = function () {
    if (KP.mode === 'lehrer') return h('span', { class: 'chip teacher', id: 'mode-chip' }, 'Lehrerkonto');
    if (KP.mode === 'schueler') return h('span', { class: 'chip student', id: 'mode-chip', title: 'Angemeldet' }, KP.db.bn);
    return h('span', { class: 'chip test', id: 'mode-chip', title: 'Gespeichert wird nur in diesem Browser.' }, 'Testmodus');
  };

  KP.weekBar = function (wk, prog) {
    var right = h('div', { class: 'tb-right' }, prog, KP.modeChip());
    if (KP.mode === 'schueler') right.appendChild(KP.db.speicherAnzeige());
    if (KP.mode === 'lehrer') right.appendChild(h('a', { class: 'btn small ghost', href: '#uebersicht', id: 'zur-uebersicht' }, 'Übersicht'));
    if (KP.mode === 'test' || KP.teacher) {
      var reset = h('button', { type: 'button', class: 'btn small ghost', id: 'week-reset' }, 'Von vorne beginnen');
      reset.addEventListener('click', function () {
        KP.confirm('Woche ' + wk.n + ' von vorne beginnen?',
          'Alle Eingaben und gelösten Aufgaben dieser Woche werden gelöscht.', 'Von vorne beginnen')
          .then(function (yes) { if (yes) { KP.resetWeek(wk.n); route(); } });
      });
      right.appendChild(reset);
    }
    return h('header', { class: 'topbar wkbar' },
      h('a', { class: 'back', href: '#start' }, '← Alle Wochen'),
      h('div', { class: 'tb-title' }, h('span', { class: 'tb-n' }, 'Woche ' + wk.n), h('span', { class: 'tb-t' }, wk.title)),
      right);
  };

  KP.weekProgress = function (n) {
    var d = KP.teacher ? KP.tdata : KP.data;
    var wd = d.weeks && d.weeks[n];
    var sol = (wd && wd.solved) || {};
    var def = KP.WEEKS[n], order = def ? def.order : [];
    var done = 0;
    order.forEach(function (id) { if (sol[id]) done++; });
    return { done: done, total: Math.max(1, order.length) };
  };

  // ---------- Bild: Graph einer ganzrationalen Funktion mit ihren Nullstellen ----------
  function heroArt() {
    var f = KP.polyFn(KP.A.fromRoots(0.16, [-3, 1, 4]));
    var svg = KP.graph({
      x: [-5, 6], y: [-3, 4], w: 470, step: [1, 1], cls: 'hero-art', noTicks: true,
      curves: [{ f: f, label: 'f', at: 4.75, ldx: 10, ldy: 0 }],
      points: [{ x: -3, y: 0, label: 'N_1', dx: -30, dy: -10 }, { x: 1, y: 0, label: 'N_2', dx: -26, dy: 22 }, { x: 4, y: 0, label: 'N_3', dx: -32, dy: 22 }],
      aria: 'Zeichnung: Graph einer ganzrationalen Funktion mit drei Nullstellen'
    });
    return svg;
  }
  function brandIcon() {
    var svg = S('svg', { class: 'brand-icon', viewBox: '0 0 40 40', 'aria-hidden': 'true' });
    svg.appendChild(S('rect', { x: 1, y: 1, width: 38, height: 38, rx: 9, class: 'bi-bg' }));
    svg.appendChild(S('path', { d: 'M 6 20 L 34 20 M 20 6 L 20 34', class: 'bi-ax' }));
    svg.appendChild(S('path', { d: 'M 6 32 C 11 8, 17 10, 20 20 S 29 32, 34 8', class: 'bi-curve' }));
    return svg;
  }

  // ---------- Startseite ----------
  function loginArea() {
    var DB = KP.db;
    var note = h('p', { class: 'login-note', id: 'login-note', role: 'status', 'aria-live': 'polite' }, DB.meldung || '');
    if (DB.meldung) note.className = 'login-note info-note';
    if (KP.mode === 'lehrer') {
      var ab = h('button', { type: 'button', class: 'btn small', id: 'lehrer-abmelden' }, 'Abmelden');
      ab.addEventListener('click', function () { DB.lehrerAbmelden('selbst'); });
      return h('div', { class: 'login' }, KP.modeChip(),
        h('a', { class: 'btn small primary', href: '#uebersicht', id: 'zur-uebersicht' }, 'Übersicht'),
        h('a', { class: 'btn small ghost', href: '../verwaltung/#start', id: 'zur-verwaltung' }, 'Verwaltung'), ab);
    }
    if (KP.mode === 'schueler') {
      var out = h('button', { type: 'button', class: 'btn small', id: 'logout-btn' }, 'Abmelden');
      out.addEventListener('click', function () { out.disabled = true; DB.abmelden('selbst'); });
      return h('div', { class: 'login' }, h('span', { class: 'login-as' }, 'Angemeldet als'), KP.modeChip(), DB.speicherAnzeige(), out);
    }
    var nameIn = h('input', {
      type: 'text', id: 'login-name', class: 'login-in', placeholder: 'Benutzername',
      autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Benutzername'
    });
    var loginBtn = h('button', { type: 'button', class: 'btn primary', id: 'login-btn' }, 'Anmelden');
    function login() {
      DB.meldung = '';
      note.className = 'login-note';
      note.textContent = 'Melde an …';
      loginBtn.disabled = true;
      DB.anmelden(nameIn.value).then(function () {
        if (location.hash !== '#start') location.hash = '#start'; else route();
      }).catch(function (e) {
        loginBtn.disabled = false;
        note.className = 'login-note bad';
        note.textContent = e.lsText || 'Die Anmeldung hat nicht geklappt.';
      });
    }
    loginBtn.addEventListener('click', login);
    nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    KP.startStatus = function () {
      if (!document.body.contains(note)) return;
      if (DB.status === 'fehler') { note.className = 'login-note bad'; note.textContent = 'Keine Verbindung zur Datenbank. Du kannst im Testmodus üben.'; }
      else if (DB.meldung && !note.textContent) { note.className = 'login-note info-note'; note.textContent = DB.meldung; }
    };
    setTimeout(KP.startStatus, 0);
    return h('div', { class: 'login' }, h('div', { class: 'login-field' }, nameIn), loginBtn, KP.modeChip(), note);
  }
  function renderStart() {
    var top = h('header', { class: 'topbar start-bar' },
      h('a', { class: 'brand', href: '#start' }, brandIcon(), h('span', null, D.meta.title)),
      loginArea());

    var hero = h('section', { class: 'hero' }, h('div', { class: 'hero-in' },
      h('div', { class: 'hero-text' },
        h('h1', { class: 'hero-title' }, 'Ganzrationale Funktionen'),
        h('p', { class: 'hero-sub' }, 'Mathematik · Einführungsphase'),
        h('p', { class: 'hero-lead' }, 'Lesen, rechnen, entdecken, üben – eine Woche nach der anderen.')),
      heroArt()));

    var info = h('div', { class: 'info', id: 'start-info' },
      KP.mode === 'lehrer'
        ? [h('p', null, h('strong', null, 'Lehrerkonto: '), 'Alle Aufgaben sind freigeschaltet, Lösungen lassen sich anzeigen und einsetzen. Es wird nichts gespeichert.'),
          h('p', null, h('a', { class: 'btn small primary', href: '#uebersicht' }, 'Zur Übersicht der Lerngruppen'))]
        : KP.mode === 'schueler'
          ? [h('p', null, h('strong', null, 'Angemeldet als ' + KP.db.bn + ': '), 'Dein Fortschritt wird gespeichert. Du kannst auf jedem Gerät weiterarbeiten.'),
            h('p', null, 'Deine Lehrkraft sieht deinen Fortschritt und deine Eingaben, auch live. Wenn du fertig bist, tippe oben auf „Abmelden“.')]
          : [h('p', null, h('strong', null, 'Testmodus: '), 'Dein Fortschritt wird nur in diesem Browser auf diesem Gerät gespeichert. Melde dich oben mit deinem Benutzernamen an, dann wird er gespeichert.'),
            h('p', null, 'Nach der Anmeldung sieht deine Lehrkraft deinen Fortschritt und deine Eingaben, auch live.'),
            !KP.storageOk ? h('p', { class: 'warn' }, 'Dieser Browser erlaubt kein Speichern. Dein Fortschritt geht beim Schließen der Seite verloren.') : null]);

    var grid = h('div', { class: 'wgrid' }, D.weeks.map(function (wk) {
      var p = KP.weekProgress(wk.n);
      var state = p.done === 0 ? 'new' : p.done >= p.total ? 'done' : 'part';
      var status = state === 'new' ? 'Noch nicht begonnen' : state === 'done' ? 'Erledigt' : p.done + ' von ' + p.total + ' Aufgaben';
      return h('a', { class: 'wcard ' + state, href: '#woche-' + wk.n, id: 'wcard-' + wk.n },
        h('span', { class: 'wc-top' }, h('span', { class: 'wc-n' }, 'Woche ' + wk.n), wk.tag ? h('span', { class: 'wc-tag' }, wk.tag) : null),
        h('span', { class: 'wc-t' }, wk.title),
        h('span', { class: 'wc-bar' }, h('span', { style: 'width:' + (100 * p.done / p.total).toFixed(1) + '%' })),
        h('span', { class: 'wc-s' }, status));
    }));

    app.appendChild(top);
    app.appendChild(hero);
    app.appendChild(h('main', { class: 'start' }, info, h('h2', { class: 'start-h' }, 'Wochen'), grid,
      h('p', { class: 'start-foot' }, 'Texte, Aufgaben und Grafiken: eigene Erstellung')));
    return null;
  }

  // ---------- Live-Ansicht im eingebetteten Rahmen (nur Anzeige, nichts speichern) ----------
  function ansichtModus() {
    KP.mode = 'ansicht';
    KP.teacher = false;
    document.body.classList.add('ansicht');
    app.textContent = '';
    app.appendChild(h('p', { class: 'live-wait' }, 'Warte auf Daten …'));
    var lastN = null;
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || e.source !== window.parent) return;
      var m = e.data;
      if (!m || m.typ !== 'zeige') return;
      var wk = weekByN(+m.n);
      if (!wk) return;
      var y = lastN === m.n ? window.scrollY : 0;
      lastN = m.n;
      KP.data = { seed: m.seed || 'ohne', weeks: {} };
      KP.data.weeks[m.n] = m.week || {};
      if (cleanup) { try { cleanup(); } catch (x) { /* egal */ } cleanup = null; }
      app.textContent = '';
      cleanup = KP.renderWeek(app, wk);
      window.scrollTo(0, y);
    });
    window.parent.postMessage({ typ: 'bereit' }, location.origin);
  }

  // ---------- Navigation ----------
  function route() {
    if (KP.mode === 'ansicht') return;
    if (cleanup) { try { cleanup(); } catch (e) { /* egal */ } cleanup = null; }
    if (KP.liveZu) KP.liveZu();
    var name = '';
    try { name = decodeURIComponent(location.hash.slice(1)); } catch (e) { name = location.hash.slice(1); }
    var m = /^woche-(\d{1,2})$/.exec(name);
    var wk = m ? weekByN(+m[1]) : null;
    var ov = /^uebersicht(?:-s-(.+))?$/.exec(name);
    if (KP.ED) KP.ED.hide();
    app.textContent = '';
    document.body.classList.toggle('is-teacher', KP.teacher);
    if (ov && KP.mode === 'lehrer') {
      cleanup = KP.renderUebersicht(app, ov[1] || null);
      document.title = 'Übersicht · ' + D.meta.title;
    } else if (wk) {
      cleanup = KP.renderWeek(app, wk);
      document.title = 'Woche ' + wk.n + ': ' + wk.title + ' · ' + D.meta.title;
    } else {
      cleanup = renderStart();
      document.title = D.meta.longTitle;
    }
    window.scrollTo(0, 0);
    if (KP.db && KP.db.ortGeaendert) KP.db.ortGeaendert();
  }
  KP.route = route;
  function renderLaden() {
    app.textContent = '';
    app.appendChild(h('header', { class: 'topbar start-bar' }, h('a', { class: 'brand', href: '#start' }, brandIcon(), h('span', null, D.meta.title))));
    app.appendChild(h('main', { class: 'start' }, h('p', { class: 'loading', id: 'verbinde' }, 'Verbinde mit der Datenbank …')));
  }
  if (window.self !== window.top && location.hash === '#live') { ansichtModus(); return; }
  window.addEventListener('hashchange', route);
  if (KP.db.erwartet()) {
    renderLaden();
    KP.db.start().then(route);
  } else {
    route();
    KP.db.start().then(function (geaendert) { if (geaendert) route(); else if (KP.startStatus) KP.startStatus(); });
  }
})();

</script>
