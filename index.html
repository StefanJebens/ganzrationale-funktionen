      for (var i = 0; i <= c.length; i++) n.push((i > 0 ? c[i - 1] : 0) - r * (i < c.length ? c[i] : 0));
      c = n;
    });
    return c;
  };
  // Linearfaktor als Text: (x − 3), (x + 2), x
  A.lin = function (r, v) { v = v || 'x'; return r === 0 ? v : '(' + v + (r > 0 ? '−' + r : '+' + (-r)) + ')'; };

  // ---------- Bausteine mit einheitlicher Schnittstelle ----------
  // { el, check() -> { ok, msg }, mark(res|null), lock(ro, done), fill(), solution() }

  // Zahl in einem Satz (Lückensatz)
  A.blank = function (store, key, want, o) {
    o = o || {};
    var F = ED.field(store, key, { mode: 'zahl', label: o.label || 'Lücke', ph: '…' });
    F.el.classList.add('blank');
    return {
      el: F.el, F: F,
      check: function () { return M.checkNumber(store[key], want, o); },
      mark: function (r) { F.el.classList.toggle('bad', !!r && !r.ok); },
      lock: function (ro, done) { F.setReadOnly(ro); F.el.classList.toggle('ok', !!done); },
      fill: function () { F.set(M.ms(o.model || '')); },
      model: o.model
    };
  };
  // Lückensatz: Teile sind Text (mit $Formeln$) oder Lücken (A.blank)
  // Beschriftung vor einer Musterlösung: „a) …“ bei Teilaufgaben, sonst „Name: …“
  function lab(name) { return !name ? '' : /\)$/.test(name) ? name + ' ' : name + ': '; }
  A.sentence = function (parts, o) {
    o = o || {};
    var name = o.name === undefined ? 'Antwortsatz' : o.name;
    var blanks = parts.filter(function (p) { return p && p.check; });
    var el = h('p', { class: 'cloze' }, parts.map(function (p) { return p && p.check ? p.el : KP.rich(p); }));
    // mit Frage davor (o.text): Frage und Antwortsatz als eine Teilaufgabe
    if (o.text) el = h('div', { class: 'part' }, h('p', { class: 'part-q' }, KP.rich(o.text)), el);
    return {
      el: el,
      check: function () {
        for (var i = 0; i < blanks.length; i++) {
          var r = blanks[i].check();
          if (!r.ok) return { ok: false, msg: (name ? name + ' – ' : '') + (r.art === 'leer' ? 'Fülle alle Lücken aus.' : r.msg), i: i };
        }
        return { ok: true };
      },
      mark: function (r) { blanks.forEach(function (b, i) { b.mark(r && r.i === i ? { ok: false } : null); }); },
      lock: function (ro, done) { blanks.forEach(function (b) { b.lock(ro, done); }); },
      fill: function () { blanks.forEach(function (b) { b.fill(); }); },
      solution: function () {
        var first = parts[0], dabei = name && typeof first === 'string' && first.trim().indexOf(name) === 0;
        return h('p', null, dabei ? '' : lab(name), parts.map(function (p) { return p && p.check ? (p.text != null ? h('strong', null, KP.rich(p.text)) : M.view(p.model)) : KP.rich(p); }));
      }
    };
  };
  // Punkte angeben
  A.points = function (store, key, want, model, o) {
    o = o || {};
    var P = ED.points(store, key, { ph: o.ph, idBase: o.idBase });
    return {
      el: h('div', { class: 'part' }, o.text ? h('p', { class: 'part-q' }, KP.rich(o.text)) : null, P.el),
      check: function () { var r = M.checkPoints(store[key], want); return r.ok ? r : { ok: false, msg: (o.name ? o.name + ' – ' : '') + r.msg, idx: r.idx }; },
      mark: function (r) { P.mark(r ? (r.idx != null ? r.idx : -1) : null); },
      lock: function (ro, done) { P.lock(ro, done); },
      fill: function () { P.set(model); },
      solution: function () { return h('p', null, lab(o.name || 'Punkte'), model.map(function (m, i) { return [i ? ', ' : '', M.view(m)]; })); }
    };
  };
  // Zahl angeben (mit Text davor und danach)
  A.number = function (store, key, want, model, o) {
    o = o || {};
    var b = A.blank(store, key, want, { model: model, label: o.label, round: o.round, v: o.v });
    return {
      el: h('div', { class: 'part' }, o.text ? h('p', { class: 'part-q' }, KP.rich(o.text)) : null,
        h('p', { class: 'ans-line' }, o.pre ? h('span', { class: 'pre' }, KP.rich(o.pre)) : null, b.el, o.post ? h('span', { class: 'post' }, KP.rich(o.post)) : null)),
      check: function () { var r = b.check(); return r.ok ? r : { ok: false, msg: (o.name ? o.name + ' – ' : '') + (r.art === 'leer' ? 'Das Feld ist leer.' : r.msg) }; },
      mark: function (r) { b.mark(r); },
      lock: b.lock, fill: b.fill,
      solution: function () { return h('p', null, o.pre ? KP.rich(o.pre) : null, ' ', M.view(model), ' ', o.post ? KP.rich(o.post) : null); }
    };
  };

  // Zahl als Kurzschreibweise (ganz, Bruch oder Dezimalzahl mit Komma)
  A.num = function (v) {
    if (Math.abs(v - Math.round(v)) < 1e-9) return A.zahl(Math.round(v));
    for (var d = 2; d <= 16; d++) { var z = Math.round(v * d); if (Math.abs(z / d - v) < 1e-9 && d !== 10) return A.zahl(z, d); }
    for (var k = 1; k <= 5; k++) { var t = v * Math.pow(10, k); if (Math.abs(t - Math.round(t)) < 1e-7) return A.dec(Math.round(t) / Math.pow(10, k), k); }
    for (var d2 = 17; d2 <= 2000; d2++) { var z2 = Math.round(v * d2); if (Math.abs(z2 / d2 - v) < 1e-9) return A.zahl(z2, d2); }
    return A.dec(v);
  };
  A.dec = function (v, k) {
    var s = k == null ? String(Math.round(v * 1e6) / 1e6) : v.toFixed(k);
    return s.replace('-', '−').replace('.', ',');
  };
  // Zeile mit festem Anfang (Kurzschreibweise), z. B. „D_{f}=“
  function preLine(pre, el) { return h('div', { class: 'pre-line' }, pre ? h('span', { class: 'pre' }, M.view(pre)) : null, el); }
  function partEl(o, kids) { return h('div', { class: 'part' }, o.text ? h('p', { class: 'part-q' }, KP.rich(o.text)) : null, kids); }
  function named(o, r) { return r.ok ? r : { ok: false, art: r.art, msg: (o.name ? o.name + ' – ' : '') + (r.art === 'leer' ? 'Das Feld ist leer.' : r.msg), zeile: r.zeile }; }
  function fieldPart(F, store, key, o, model, check) {
    return {
      el: partEl(o, preLine(o.pre, F.el)), F: F,
      check: function () { return named(o, check()); },
      mark: function (r) { F.el.classList.toggle('bad', !!r && !r.ok); },
      lock: function (ro, done) { F.setReadOnly(ro); F.el.classList.toggle('ok', !!done); },
      fill: function () { F.set(M.ms(model)); },
      solution: function () { return h('p', null, lab(o.name), M.view((o.pre || '') + model)); },
      model: model
    };
  }
  // Menge angeben (Definitions- oder Wertemenge); want: Menge aus M.set
  A.set = function (store, key, want, o) {
    o = o || {};
    var model = o.model || M.setText(want);
    var F = ED.field(store, key, { mode: 'menge', label: o.label || 'Menge', ph: o.ph || '' });
    return fieldPart(F, store, key, o, model, function () { return M.checkSet(store[key], want); });
  };
  // Term angeben; T: { v, p: Polynom, fns, normal }
  A.termIn = function (store, key, T, model, o) {
    o = o || {};
    var F = ED.field(store, key, { mode: 'term', v: T.v || 'x', keys: o.keys || [], label: o.label || 'Term', ph: o.ph || '' });
    return fieldPart(F, store, key, o, model, function () { return M.checkTerm(store[key], T); });
  };
  // Ergebnis mit dem Rechner bestimmt; T: { v, sols, round }
  A.result = function (store, key, T, model, o) {
    o = o || {};
    var F = ED.field(store, key, { mode: 'erg', v: T.v || 'x', label: o.label || 'Ergebnis', ph: o.ph || '' });
    return fieldPart(F, store, key, o, model, function () { return M.checkResult(store[key], T); });
  };
  // Lücke für +∞, −∞ oder eine Zahl; want: { inf: ±1 } oder { num: z }
  A.inf = function (store, key, want, o) {
    o = o || {};
    var F = ED.field(store, key, { mode: 'inf', label: o.label || 'Lücke', ph: '…' });
    F.el.classList.add('blank');
    var model = o.model || (want.inf ? (want.inf > 0 ? '+∞' : '−∞') : A.num(want.num));
    return {
      el: F.el, F: F,
      check: function () { return M.checkInf(store[key], want); },
      mark: function (r) { F.el.classList.toggle('bad', !!r && !r.ok); },
      lock: function (ro, done) { F.setReadOnly(ro); F.el.classList.toggle('ok', !!done); },
      fill: function () { F.set(M.ms(model)); },
      model: model
    };
  };
  // Auswahl in einer Lücke; want: Nummer der richtigen Auswahl; Reihenfolge je Schüler über o.R
  A.choice = function (store, key, opts, want, o) {
    o = o || {};
    var order = o.R ? o.R.perm(opts.length) : opts.map(function (x, i) { return i; });
    var ro = false, btns = [];
    var box = h('span', { class: 'choice', role: 'group', 'aria-label': o.label || 'Auswahl' });
    function show() { btns.forEach(function (x) { x.b.setAttribute('aria-pressed', String(store[key] === x.j)); }); }
    order.forEach(function (j) {
      var b = h('button', { type: 'button', 'aria-pressed': 'false', 'data-c': String(j) }, KP.rich(opts[j]));
      b.addEventListener('click', function () { if (ro) return; store[key] = j; show(); box.classList.remove('bad'); KP.save(); });
      btns.push({ b: b, j: j });
      box.appendChild(b);
    });
    show();
    return {
      el: box,
      check: function () {
        if (store[key] == null) return { ok: false, art: 'leer', msg: 'Wähle in jeder Lücke eine Antwort aus.' };
        return store[key] === want ? { ok: true } : { ok: false, art: 'rechnung', msg: 'Mindestens eine Auswahl stimmt nicht.' };
      },
      mark: function (r) { box.classList.toggle('bad', !!r && !r.ok); },
      lock: function (r, done) { ro = !!r; btns.forEach(function (x) { x.b.disabled = ro; }); box.classList.toggle('ro', ro); box.classList.toggle('ok', !!done); },
      fill: function () { store[key] = want; show(); },
      text: opts[want], model: null
    };
  };
  // Grenzwerte zeilenweise: lim_{x→±∞} f(x) = …; T wie bei M.checkLimits, model: Zeilen in Kurzschreibweise
  A.limits = function (store, key, T, model, o) {
    o = o || {};
    var v = T.v || 'x';
    var W = ED.way(store, key, { v: v, mode: 'grenz', keys: o.keys || [T.fn.name + '(' + v + ')'], idBase: o.idBase });
    return {
      el: partEl(o, W.el), W: W,
      check: function () { return named(o, M.checkLimits(store[key], T)); },
      mark: function (r) { W.mark(r && !r.ok ? (r.zeile == null ? 0 : r.zeile) : null); },
      lock: function (ro, done) { W.lock(ro, done); },
      fill: function () { W.set(model); },
      solution: function () { return h('div', null, o.name ? h('p', null, /\)$/.test(o.name) ? o.name : o.name + ':') : null, ED.show(model, { nums: false })); },
      model: model
    };
  };
  // Wertetabelle mit Lücken; xs: Stellen, ys: Werte
  A.table = function (store, key, xs, ys, o) {
    o = o || {};
    if (!store[key] || typeof store[key] !== 'object' || Array.isArray(store[key])) store[key] = {};
    var sub = store[key], fn = o.fn || 'f', v = o.v || 'x';
    var models = xs.map(function (x, i) { return o.models ? o.models[i] : A.num(ys[i]); });
    var blanks = xs.map(function (x, i) { return A.blank(sub, 'y' + i, ys[i], { model: models[i], label: fn + '(' + x + ')', round: o.round }); });
    function tab(cells) {
      return h('div', { class: 'vtab-wrap' }, h('table', { class: 'vtab' },
        h('tr', null, h('th', null, M.view(v)), xs.map(function (x) { return h('th', null, M.view(A.num(x))); })),
        h('tr', null, h('th', null, M.view(fn + '(' + v + ')')), cells.map(function (c) { return h('td', null, c); }))));
    }
    return {
      el: partEl(o, tab(blanks.map(function (b) { return b.el; }))),
      check: function () {
        for (var i = 0; i < blanks.length; i++) {
          var r = blanks[i].check();
          if (!r.ok) return { ok: false, art: r.art, msg: (o.name ? o.name + ' – ' : '') + 'Wertetabelle bei ' + v + ' = ' + A.num(xs[i]).replace('\\frac', '') + ': ' + (r.art === 'leer' ? 'Das Feld ist leer.' : r.msg), i: i };
        }
        return { ok: true };
      },
      mark: function (r) { blanks.forEach(function (b, i) { b.mark(r && r.i === i ? { ok: false } : null); }); },
      lock: function (ro, done) { blanks.forEach(function (b) { b.lock(ro, done); }); },
      fill: function () { blanks.forEach(function (b) { b.fill(); }); },
      solution: function () { return tab(models.map(function (m) { return M.view(m); })); }
    };
  };
  // selbst gebaute ganzrationale Funktion mit Eigenschaften; props(p) -> true oder Text (was noch nicht stimmt)
  A.polyProp = function (store, key, props, model, o) {
    o = o || {};
    var F = ED.field(store, key, { mode: 'term', v: o.v || 'x', keys: [], label: o.label || 'Funktionsterm', ph: o.ph || '' });
    return fieldPart(F, store, key, o, model, function () {
      if (M.empty(store[key])) return { ok: false, art: 'leer', msg: 'Das Feld ist leer.' };
      var p;
      try { p = M.readPoly(store[key], o.v || 'x'); } catch (e) { if (e.kind) return { ok: false, art: e.kind, msg: (e.kind === 'schreib' ? 'Schreibweise: ' : 'Rechnung: ') + e.msg }; throw e; }
      var r = props(M.pf(p));
      return r === true ? { ok: true } : { ok: false, art: 'rechnung', msg: 'Rechnung: ' + r };
    });
  };
  // Abbildung mit Graph
  A.fig = function (opts, caption, cls) {
    return h('figure', { class: 'fig' + (cls ? ' ' + cls : '') }, KP.graph(opts), caption ? h('figcaption', null, KP.rich(caption)) : null);
  };
  // Mehrere kleine Graphen nebeneinander (A, B, C …)
  A.figRow = function (list, cls) {
    return h('div', { class: 'graph-row' + (cls ? ' ' + cls : '') }, list.map(function (x) {
      return h('figure', { class: 'fig small' }, KP.graph(x.g), h('figcaption', null, KP.rich(x.cap)));
    }));
  };

  // ---------- Schritt mit Rechenweg ----------
  // cfg: { task: Text/Knoten, T: Prüfauftrag für M.checkWay, model: [Zeilen], mode: 'weg'|'term', parts: [Bausteine], before, after, tip, okText, optional, lockText }
  A.wayStep = function (E, id, title, cfg) {
    var store = E.obj(id, {});
    var T = cfg.T;
    var W = ED.way(store, 'z', { v: T.v, fn: T.fn ? T.fn.name : null, keys: cfg.keys, mode: cfg.mode || (T.goal === 'faktor' || T.goal === 'kette' ? 'term' : 'weg'), idBase: id });
    var parts = (cfg.parts || []).map(function (f) { return typeof f === 'function' ? f(store) : f; });
    var body = [].concat(cfg.before || [],
      h('div', { class: 'task-text' }, (Array.isArray(cfg.task) ? cfg.task : [cfg.task]).map(function (t) { return t && t.nodeType ? t : h('p', null, KP.rich(t)); })),
      cfg.wayLabel === false ? [] : h('p', { class: 'way-label' }, cfg.wayLabel || 'Dein Rechenweg:'),
      W.el,
      parts.map(function (p) { return p.el; }),
      cfg.tip || [], cfg.after || []);
    var st = E.step(id, title, {
      body: body, optional: cfg.optional, lockText: cfg.lockText, okText: cfg.okText,
      check: function () {
        var r = M.checkWay(store.z, T);
        if (!r.ok) return { ok: false, msg: r.msg, marks: { way: r.zeile === null ? 0 : r.zeile } };
        for (var i = 0; i < parts.length; i++) {
          var pr = parts[i].check();
          if (!pr.ok) return { ok: false, msg: pr.msg, marks: { part: i, res: pr } };
        }
        return { ok: true, okMsg: r.okMsg ? r.okMsg + (cfg.okText ? ' ' + cfg.okText : '') : null };
      },
      mark: function (m) {
        W.mark(m && m.way !== undefined ? m.way : null);
        parts.forEach(function (p, i) { p.mark(m && m.part === i ? m.res : null); });
      },
      lock: function (ro, done) { W.lock(ro, done); parts.forEach(function (p) { p.lock(ro, done); }); },
      solution: function () {
        return h('div', null, h('p', { class: 'sol-h' }, 'Musterlösung:'), ED.show(cfg.model), parts.map(function (p) { return p.solution(); }));
      },
      fill: function () { W.set(cfg.model); parts.forEach(function (p) { p.fill(); }); }
    });
    st.T = T; st.model = cfg.model; st.parts = parts;
    E.Q[id] = { model: cfg.model, T: T, parts: parts.map(function (p) { return p.model || null; }) };
    return st;
  };

  // Schritt nur mit Bausteinen (ohne Rechenweg)
  A.partsStep = function (E, id, title, cfg) {
    var store = E.obj(id, {});
    var parts = cfg.parts.map(function (f) { return typeof f === 'function' ? f(store) : f; });
    var st = E.step(id, title, {
      body: [].concat(cfg.before || [], cfg.task ? h('div', { class: 'task-text' }, (Array.isArray(cfg.task) ? cfg.task : [cfg.task]).map(function (t) { return t && t.nodeType ? t : h('p', null, KP.rich(t)); })) : [],
        parts.map(function (p) { return p.el; }), cfg.tip || [], cfg.after || []),
      optional: cfg.optional, lockText: cfg.lockText, okText: cfg.okText,
      check: function () {
        for (var i = 0; i < parts.length; i++) { var pr = parts[i].check(); if (!pr.ok) return { ok: false, msg: pr.msg, marks: { part: i, res: pr } }; }
        return { ok: true };
      },
      mark: function (m) { parts.forEach(function (p, i) { p.mark(m && m.part === i ? m.res : null); }); },
      lock: function (ro, done) { parts.forEach(function (p) { p.lock(ro, done); }); },
      solution: function () { return h('div', null, parts.map(function (p) { return p.solution(); })); },
      fill: function () { parts.forEach(function (p) { p.fill(); }); }
    });
    st.parts = parts;
    return st;
  };

  // Auswahlfragen als Baustein
  A.mc = function (E, id, qs, store) {
    var tb = E.taskBlock(id, qs, store);
    return {
      el: tb.el,
      check: function () { var r = tb.check(); return r.ok ? { ok: true } : { ok: false, msg: 'Noch nicht ganz richtig. Die rot markierten Antworten stimmen nicht.', marks: r.marks }; },
      mark: function (r) { tb.mark(r ? r.marks : null); },
      lock: tb.lock, fill: tb.fill,
      solution: function () { return tb.solution(); }
    };
  };
  // Lesetext als Kasten
  A.box = function (title, kids, cls) {
    return h('div', { class: 'infobox' + (cls ? ' ' + cls : '') }, title ? h('p', { class: 'ib-h' }, KP.rich(title)) : null, kids);
  };
  A.list = function (items) { return h('ul', { class: 'ib-list' }, items.map(function (t) { return h('li', null, KP.rich(t)); })); };
  // Bedienhilfe für das Tastenfeld
  A.howto = function () {
    return h('details', { class: 'howto' }, h('summary', null, 'So bedienst du das Tastenfeld'), A.list([
      'Tippe in eine Zeile. Unten erscheint dann das Tastenfeld.',
      '„neue Zeile“ legt darunter eine neue Zeile an. Jede neue Zeile beginnt mit ⇔ (oder mit =, wenn du nur einen Term umformst).',
      '⌫ löscht das Zeichen vor der Schreibmarke. Steht die Schreibmarke am Anfang einer leeren Zeile, löscht ⌫ die ganze Zeile.',
      'Mit ◀ und ▶ bewegst du die Schreibmarke. Du kannst auch direkt auf eine Stelle tippen.',
      '$x^2$ schreibt ein Quadrat. □ⁿ, √ und „Bruch“ legen Kästchen an, in die du schreibst. Mit ▶ kommst du wieder heraus (im Bruch erst in den Nenner).',
      '„Fertig“ schließt das Tastenfeld.'
    ]));
  };
})();

<script>
// Entdeckungslabor: Schieberegler und Schalter verändern eine Darstellung (Graph, Funktionsterm) sofort
(function () {
  'use strict';
  var KP = window.KP, h = KP.h;
  // o: { title, intro, sliders: [{ k, label, min, max, step, v, fmt }], toggles: [{ k, label, v }], render: function (state) -> Knoten oder Liste }
  KP.lab = function (o) {
    var st = {}, out = h('div', { class: 'lab-out', 'aria-live': 'polite' }), ctl = h('div', { class: 'lab-ctl' });
    function fmt(s, v) { return s.fmt ? s.fmt(v) : String(Math.round(v * 1000) / 1000).replace('.', ',').replace('-', '−'); }
    (o.sliders || []).forEach(function (s) {
      st[s.k] = s.v;
      var id = 'lab-' + Math.random().toString(36).slice(2, 8);
      var outv = h('output', { for: id }, fmt(s, s.v));
      var inp = h('input', { type: 'range', id: id, min: String(s.min), max: String(s.max), step: String(s.step || 1), value: String(s.v) });
      inp.addEventListener('input', function () {
        var v = parseFloat(inp.value);
        if (s.skip0 && Math.abs(v) < 1e-9) v = s.step || 1;
        st[s.k] = v;
        outv.textContent = fmt(s, v);
        draw();
      });
      ctl.appendChild(h('div', { class: 'lab-sl' }, h('label', { for: id }, h('span', null, KP.rich(s.label)), outv), inp));
    });
    if (o.toggles && o.toggles.length) {
      var tg = h('div', { class: 'lab-tg' });
      o.toggles.forEach(function (t) {
        st[t.k] = !!t.v;
        var b = h('button', { type: 'button', 'aria-pressed': String(!!t.v) }, KP.rich(t.label));
        b.addEventListener('click', function () { st[t.k] = !st[t.k]; b.setAttribute('aria-pressed', String(st[t.k])); draw(); });
        tg.appendChild(b);
      });
      ctl.appendChild(tg);
    }
    if (o.note) ctl.appendChild(h('p', { class: 'lab-note' }, KP.rich(o.note)));
    function draw() {

      var kc = R.pick([[1, 3], [1, 8], [4, 5], [4, 12]]), k = kc[0], c = kc[1], m = Math.round(Math.sqrt(c + k)), a = R.pick([-1, -2, 3]);
      var on = R.pick([true, false]), px = R.pick([-3, 3]), py = px * px - k + (on ? 0 : 1);
      return { k: k, c: c, m: m, a: a, on: on, px: px, py: py };
    },
    zusatz: function (R) {
      var a = R.pick([2, 3, 4, 6, 7]), b = R.pick([2, 3, 4]);
      return { a: a, b: b, Df: S.iv(-INF, a, false, true), Dg: S.ohne(S.R(), [-b, b]) };
    }
  };

  KP.defineWeek({
    n: 1,
    order: ['einstieg', 'graphtest', 'gleichung', 'werte', 'stelle', 'dmenge', 'wmenge', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Einstieg ----------
      var s1 = E.section('Was ist eine Funktion?', [
        A.box('Funktion, Funktionswert, Graph', [
          P('Eine **Funktion** $f$ ordnet jeder Zahl $x$ aus ihrer **Definitionsmenge** $D_f$ **genau eine** Zahl $f(x)$ zu. Die Zahl $f(x)$ heißt **Funktionswert** von $f$ an der Stelle $x$.'),
          P('Meist ist eine Funktion durch einen **Funktionsterm** gegeben, z. B. $f(x)=x^2−1$. Dann ist $f(2)=2^2−1=3$: Der Stelle 2 wird der Funktionswert 3 zugeordnet.'),
          P('Der **Graph** von $f$ besteht aus allen Punkten $P(x|f(x))$. Zu $f(2)=3$ gehört der Punkt $P(2|3)$ auf dem Graphen.'),
          P('Die **Wertemenge** $W_f$ enthält alle Funktionswerte, die $f$ annimmt.'),
          A.fig({ x: [-3, 3], y: [-2, 5], w: 280, step: [1, 1], curves: [{ f: function (x) { return x * x - 1; }, label: 'f', at: 2.3, ldx: 10 }],
            points: [{ x: 2, y: 3, label: 'P', dx: -18, dy: -6 }], aria: 'Graph von f mit dem Punkt P(2|3)' }, 'Graph von $f$ mit $f(x)=x^2−1$ und dem Punkt $P(2|3)$')
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el

      // ---------- 2 Senkrechten-Test ----------
      var gt = E.gen('graphtest', V.graphtest), letters = ['A', 'B', 'C', 'D'];
      var kreis = { x: [-4, 4], y: [-4, 4], w: 260, step: [1, 1], curves: [{ par: function (t) { return [3 * Math.cos(t), 3 * Math.sin(t)]; }, t: [0, 2 * Math.PI] }],
        lines: [{ x1: 1.5, y1: -4.5, x2: 1.5, y2: 4.5 }], points: [{ x: 1.5, y: Math.sqrt(6.75), cls: 'c2' }, { x: 1.5, y: -Math.sqrt(6.75), cls: 'c2' }], aria: 'Kreis mit einer senkrechten Geraden, die ihn zweimal schneidet' };
      var s2 = E.section('Graph oder nicht?', [
        A.box('Der Senkrechten-Test', [
          P('Eine Kurve ist genau dann der Graph einer Funktion, wenn **jede senkrechte Gerade** die Kurve **höchstens einmal** schneidet. Denn zu jedem $x$ gehört höchstens ein Funktionswert.'),
          A.fig(kreis, 'Kein Graph einer Funktion: Die senkrechte Gerade schneidet den Kreis zweimal. Zur Stelle 1,5 würden zwei Werte gehören.')

        E.tasks('graphtest', 'Graph einer Funktion?', gt.map(function (k, i) {
          return { q: 'Ist Kurve ' + letters[i] + ' der Graph einer Funktion?',
            o: ['Ja – jede senkrechte Gerade schneidet die Kurve höchstens einmal.', 'Nein – es gibt eine senkrechte Gerade, die die Kurve mehrmals schneidet.'], a: KURVEN[k].ja ? 0 : 1 };
        }), { before: [A.figRow(gt.map(function (k, i) { return { g: graphOf(k), cap: 'Kurve ' + letters[i] }; }), 'four')] }).el

      // ---------- 3 Gleichungen ----------
      var s3 = E.section('Gleichungen untersuchen', [
        A.box('Beschreibt eine Gleichung eine Funktion?', [
          P('Auch eine Gleichung mit $x$ und $y$ legt fest, welche $y$-Werte zu einem $x$ gehören. Sie beschreibt eine Funktion, wenn zu jedem $x$ genau ein $y$ gehört.'),
          P('**Beispiel:** $x^2+y^2=25$ beschreibt den Kreis um den Ursprung mit dem Radius 5. Für $x=3$ gilt $y^2=16$, also $y=−4∨y=4$. Zur Stelle 3 gehören zwei Werte – die Gleichung beschreibt keine Funktion.')
        ]),
        E.tasks('gleichung', 'Funktion oder nicht?', V.gleichung).el
      ]);

      // ---------- 4 Funktionswerte ----------
      var g4 = E.gen('werte', V.werte);
      var s4 = E.section('Funktionswerte berechnen', [
        A.box('Einsetzen und ausrechnen', [
          P('Den Funktionswert an einer Stelle berechnest du, indem du die Zahl für $x$ einsetzt. Negative Zahlen setzt du in Klammern: $(−2)^2=4$, aber $−2^2=−4$.'),
          P('Du schreibst eine **Kette** von Termen, die du mit = verbindest: Zuerst steht der gesuchte Funktionswert, dann der Term mit der eingesetzten Zahl, am Ende das Ergebnis.'),
          P('**Beispiel** mit $g(x)=x^2+4x$:'),
          ED.show(['g(−3)=(−3)^{2}+4·(−3)=9−12=−3'], { nums: false })

        A.wayStep(E, 'werte', 'Einsetzen', {
          before: [P('Für Rechnungen gibt es hier ein eigenes Tastenfeld. Tippe in die Zeile – dann erscheint es unten auf dem Bildschirm.'), A.howto()],
          task: ['Gegeben ist die Funktion $f$ mit $f(x)=' + g4.f + '$ und $D_f=\\R$.', 'a) Berechne $f(' + A.zahl(g4.x0) + ')$. Beginne mit $f(' + A.zahl(g4.x0) + ')=…$'],
          T: g4.T, model: g4.model, keys: ['f( )'], wayLabel: 'a) Deine Rechnung:',
          parts: [function (st) {
            return A.sentence(['b) Gib die Funktionswerte an: $f(0)=$ ', A.blank(st, 'f0', g4.c, { model: A.zahl(g4.c), label: 'f(0)' }), ' und $f(1)=$ ', A.blank(st, 'f1', g4.f1, { model: A.zahl(g4.f1), label: 'f(1)' }), '.'], { name: 'b)' });

      // ---------- 5 Stellen und Punktprobe ----------
      var g5 = E.gen('stelle', V.stelle);
      var s5 = E.section('Stellen zu einem Funktionswert', [

            function (st) { return A.set(st, 'h', g6.Dh, { text: 'c) $h(x)=' + g6.h + '$', pre: 'D_{h}=', name: 'c)' }); }
          ],
          tip: KP.tip('Frage dich bei jedem Term: Für welche Zahl wäre der Nenner 0? Steht unter der Wurzel etwas Negatives? Das Tastenfeld hat Tasten für ℝ, „\\“, Klammern, +∞ und −∞.')

        { x: [-5, 5], y: [-5, 6], w: 240, step: [1, 1], curves: [{ f: function (x) { return -(x - g7.p) * (x - g7.p) + g7.q; }, label: 'f', at: g7.p + 0.9 }], aria: 'Graph von f' },

        { x: [-7, 7], y: [-4, 4], w: 300, step: [2, 1], grid: [1, 1], curves: [{ f: function (x) { return g7.s * Math.sin(x); }, label: 'h', at: 2.1 }], aria: 'Graph von h' },
        { x: [-4, 4], y: [-1, 10], w: 240, step: [1, 1], curves: [{ f: function (x) { return x * x; }, dom: [g7.l, g7.u], ends: true, label: 'k', at: g7.u - 0.6, ldx: -26 }], aria: 'Graph von k mit eingeschränkter Definitionsmenge' }
      ];
      var s7 = E.section('Wertemenge', [
        A.box('Welche Funktionswerte kommen vor?', [
          P('Die Wertemenge $W_f$ enthält alle Funktionswerte von $f$. Am Graphen liest du sie an der $y$-Achse ab: Welche $y$-Werte erreicht der Graph?'),
          P('**Beispiel:** Der Graph von $f$ mit $f(x)=x^2−1$ hat seinen tiefsten Punkt bei $(0|−1)$ und steigt nach beiden Seiten unbegrenzt an: $W_f=[−1;+∞[$.'),
          P('Ist die Definitionsmenge eingeschränkt, gehören nur die Funktionswerte zu diesen $x$ dazu.')
        ]),
        A.partsStep(E, 'wmenge', 'Wertemengen ablesen', {
          task: 'Gib jeweils die Wertemenge an. Die Graphen setzen sich nach links und rechts so fort, wie es zu erwarten ist – außer bei $k$.',
          parts: [
            function (st) { return A.set(st, 'f', g7.Wf, { text: 'a) $f(x)=' + g7.f + '$ mit $D_f=\\R$', pre: 'W_{f}=', name: 'a)' }); },
            function (st) { return A.set(st, 'g', g7.Wg, { text: 'b) $g(x)=\\frac{1}{x^{2}}' + (g7.r < 0 ? '−' + (-g7.r) : '+' + g7.r) + '$ mit $D_g=\\R\\ohne\\{0\\}$ (der Graph nähert sich der grauen Linie immer mehr an, ohne sie zu erreichen)', pre: 'W_{g}=', name: 'b)' }); },
            function (st) { return A.set(st, 'h', g7.Wh, { text: 'c) $h(x)=' + (g7.s === 1 ? '' : g7.s + '·') + '\\sin(x)$ mit $D_h=\\R$', pre: 'W_{h}=', name: 'c)' }); },
            function (st) { return A.set(st, 'k', g7.Wk, { text: 'd) $k(x)=x^2$ mit $D_k=[' + A.zahl(g7.l) + ';' + g7.u + ']$', pre: 'W_{k}=', name: 'd)' }); }
          ].map(function (f, i) { return function (st) { var p = f(st); p.el.insertBefore(A.fig(gs7[i]), p.el.children[1] || null); return p; }; }),
          tip: KP.tip('Suche den höchsten und den tiefsten Punkt des Graphen. Gehört der Rand dazu, zeigt die Klammer nach innen. Ein Wert, den der Graph nur immer näher erreicht, gehört nicht dazu.')
        }).el
      ]);

      // ---------- 8 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach);
      var s8 = E.section('Anwendung: eine Kerze', [
        A.wayStep(E, 'sach', 'Wann ist die Kerze abgebrannt?', {
          task: ['Eine ' + g8.L0 + ' cm hohe Kerze wird angezündet. Die Funktion $L$ mit $L(t)=' + g8.term + '$ beschreibt die Höhe der Kerze (in cm) $t$ Stunden nach dem Anzünden.',
            'a) Berechne, nach wie vielen Stunden die Kerze ganz abgebrannt ist.'],
          T: g8.TT, model: g8.model, wayLabel: 'a) Dein Rechenweg:',
          parts: [
            function (st) { return A.sentence(['Antwortsatz: Die Kerze ist nach ', A.blank(st, 'antw', g8.T, { model: String(g8.T), label: 'Zeit in Stunden' }), ' Stunden abgebrannt.']); },
            function (st) { return A.set(st, 'D', g8.D, { text: 'b) Gib eine sinnvolle Definitionsmenge von $L$ an: Für welche Zeiten beschreibt $L$ die Kerze?', pre: 'D_{L}=', name: 'b)' }); },
            function (st) { return A.set(st, 'W', g8.W, { text: 'c) Gib die Wertemenge von $L$ zu dieser Definitionsmenge an.', pre: 'W_{L}=', name: 'c)' }); }
          ],
          tip: KP.tip('Die Kerze ist abgebrannt, wenn ihre Höhe 0 ist. Vor dem Anzünden und nach dem Abbrennen beschreibt $L$ die Kerze nicht mehr.')
        }).el
      ]);

      // ---------- 9 Papier ----------
      var s9 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R), k = g.k, xs = [-3, -2, -1, 0, 1, 2, 3];
          var fterm = 'x^{2}−' + k;
          return {
            title: 'Funktionen untersuchen',
            intro: 'Gegeben sind die Funktionen $f$ mit $f(x)=' + fterm + '$ und $g$ mit $g(x)=\\frac{1}{x' + (g.a < 0 ? '+' + (-g.a) : '−' + g.a) + '}$.',
            parts: [
              { t: 'Erstelle eine Wertetabelle von $f$ für die ganzen Zahlen von −3 bis 3 und zeichne den Graphen von $f$.', s: [h('div', { class: 'vtab-wrap' }, h('table', { class: 'vtab' }, h('tr', null, h('th', null, 'x'), xs.map(function (x) { return h('th', null, M.view(A.zahl(x))); })), h('tr', null, h('th', null, M.view('f(x)')), xs.map(function (x) { return h('td', null, M.view(A.zahl(x * x - k))); })))),
                A.fig({ x: [-3.5, 3.5], y: [-k - 1, 9 - k + 1], w: 260, step: [1, 1], curves: [{ f: function (x) { return x * x - k; }, label: 'f', at: 2.6 }], aria: 'Graph von f' })] },
              { t: 'Gib $D_f$ und $W_f$ an.', s: ['$D_f=\\R$ und $W_f=[−' + k + ';+∞[$, denn der tiefste Punkt des Graphen ist $(0|−' + k + ')$.'] },
              { t: 'Prüfe rechnerisch, ob der Punkt $P(' + A.zahl(g.px) + '|' + A.zahl(g.py) + ')$ auf dem Graphen von $f$ liegt.', s: ['$f(' + A.zahl(g.px) + ')=' + A.kl(g.px) + '^2−' + k + '=' + (9 - k) + '$. ' + (g.on ? 'Das ist die $y$-Koordinate von $P$, also liegt $P$ auf dem Graphen.' : 'Das ist nicht die $y$-Koordinate ' + A.zahl(g.py) + ', also liegt $P$ nicht auf dem Graphen.')] },
              { t: 'Berechne die Stellen, an denen $f$ den Wert ' + g.c + ' annimmt.', s: [ED.show(['f(x)=' + g.c, '<=>x^{2}−' + k + '=' + g.c, '<=>x^{2}=' + (g.c + k), '<=>x=−' + g.m + '∨x=' + g.m])] },
              { t: 'Gib die Definitionsmenge von $g$ an und begründe sie.', s: ['$D_g=\\R\\ohne\\{' + A.zahl(g.a) + '\\}$, denn für $x=' + A.zahl(g.a) + '$ ist der Nenner 0, und durch 0 darf man nicht teilen.'] }
            ]
          };
        }).el
      ]);

      // ---------- 10 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var s10 = E.section('Zusatzaufgabe', [
        A.partsStep(E, 'zusatz', 'Knifflige Definitionsmengen', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          task: 'Gib jeweils die größtmögliche Definitionsmenge an.',
          parts: [
            function (st) { return A.set(st, 'f', g9.Df, { text: 'a) $f(x)=\\sqrt{' + g9.a + '−x}$', pre: 'D_{f}=', name: 'a)' }); },
            function (st) { return A.set(st, 'g', g9.Dg, { text: 'b) $g(x)=\\frac{1}{x^{2}−' + g9.b * g9.b + '}$', pre: 'D_{g}=', name: 'b)' }); }
          ],
          tip: KP.tip('a) Unter der Wurzel muss eine Zahl ≥ 0 stehen. Beispiel: Für $\\sqrt{5−x}$ muss $5−x≥0$ gelten. b) Für welche Zahlen wird $x^2$ gleich der Zahl im Nenner?')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche klärst du, was eine Funktion ist: Funktionsterm, Funktionswert und Graph. Du lernst, welche Zahlen man einsetzen darf (Definitionsmenge) und welche Werte herauskommen (Wertemenge).' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]);
    }
  });
})();

<script>
// Woche 2: Ganzrationale Funktionen – Definition, Grad, Koeffizienten; x⁻² als Gegenbeispiel; besondere Punkte, lokal und global
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, M = KP.M, P = KP.P, S = KP.M.set, INF = Infinity;

  // Summanden in vorgegebener Reihenfolge: [[Koeffizient, Hochzahl], …]
  function seq(list, v) {
    v = v || 'x';
    var out = '';
    list.forEach(function (t) {
      var a = t[0], k = t[1];
      if (!a) return;
      var sign = a < 0 ? '−' : (out ? '+' : ''), abs = Math.abs(a);
      out += sign + (k > 0 && abs === 1 ? '' : String(abs)) + (k === 0 ? '' : k === 1 ? v : v + '^{' + k + '}');
    });
    return out || '0';
  }
  function cubicGraph(r) { return function (x) { return -x * x * x + 3 * x + r; }; }
  // Nullstellen numerisch (für Beschriftungen)
  function zeros(f, a, b) {
    var out = [], n = 600, prev = f(a);
    for (var i = 1; i <= n; i++) {
      var x = a + (b - a) * i / n, y = f(x);
      if (prev * y < 0) { var lo = x - (b - a) / n, hi = x; for (var k = 0; k < 50; k++) { var m = (lo + hi) / 2; if (f(lo) * f(m) <= 0) hi = m; else lo = m; } out.push((lo + hi) / 2); }
      prev = y;
    }
    return out;
  }

  var V = KP.V.w2 = {
    erkennen: function (R) {
      var ja = R.sample([['3x^{4}−x+1', 'Ja – alle Hochzahlen sind natürliche Zahlen.'], ['(x−1)(x+2)', 'Ja – ausmultipliziert $x^2+x−2$.'], ['\\frac{1}{2}x^{3}', 'Ja – der Koeffizient $\\frac{1}{2}$ ist eine reelle Zahl.'],
        ['5', 'Ja – eine konstante Funktion vom Grad 0.'], ['(2x−1)^{2}', 'Ja – ausmultipliziert $4x^2−4x+1$.'], ['x^{3}−\\sqrt{2}x', 'Ja – der Koeffizient $\\sqrt{2}$ ist eine reelle Zahl.']], 3);
      var nein = R.sample([['\\frac{1}{x}', 'Nein – $x$ steht im Nenner.'], ['\\sqrt{x}', 'Nein – $x$ steht unter der Wurzel.'], ['2^{x}', 'Nein – $x$ steht in der Hochzahl.'], ['x^{2}+\\frac{3}{x}', 'Nein – $x$ steht im Nenner.']], 2);
      return R.shuffle(ja.map(function (t) { return { q: 'Ist $f$ mit $f(x)=' + t[0] + '$ ganzrational?', o: ['ganzrational', 'nicht ganzrational'], a: 0, why: t[1] }; })
        .concat(nein.map(function (t) { return { q: 'Ist $f$ mit $f(x)=' + t[0] + '$ ganzrational?', o: ['ganzrational', 'nicht ganzrational'], a: 1, why: t[1] }; })));
    },
    grad: function (R) {
      var n = R.pick([3, 4, 5]), lead = R.pick([-3, -2, 2, 3, 5].filter(function (v) { return v !== n; })), c0 = R.pick([-7, -4, 2, 6, 9]), mid = R.pick([-4, -1, 3]), lo = R.pick([-5, 2, 7]);
      var terms = R.shuffle([[mid, n - 2], [lead, n], [c0, 0], [lo, 1]]);
      if (terms[0][1] === n) terms.push(terms.shift());
      return { f: seq(terms), n: n, lead: lead, c0: c0 };
    },
    ausmult: function (R) {
      var a = R.pick([2, 3, -2]), b = R.pick([-4, -3, -1, 1, 2, 5]), c = R.pick([-5, -3, -2, 1, 3, 4]);
      var p = [b * c, a * c, b, a];
      return {
        f: '(' + seq([[a, 1], [b, 0]]) + ')(x^{2}' + (c < 0 ? '−' + (-c) : '+' + c) + ')', a: a, b: b, c: c, p: p,
        T: { v: 'x', goal: 'kette', fns: { f: A.poly(p) }, start: { name: 'f', arg: A.poly([0, 1]), text: 'f(x)' }, end: 'normal' },
        model: ['f(x)=(' + seq([[a, 1], [b, 0]]) + ')(x^{2}' + (c < 0 ? '−' + (-c) : '+' + c) + ')=' + seq([[a, 3], [a * c, 1], [b, 2], [b * c, 0]]) + '=' + seq([[a, 3], [b, 2], [a * c, 1], [b * c, 0]])]
      };
    },
    xminus2: function (R) { var c = R.pick([1, 2, -1, -2]); return { c: c, W: c > 0 ? S.iv(0, INF, false, false) : S.iv(-INF, 0, false, false) }; },
    begriffe: function (R) {
      var r = R.pick([0, 4, -3]);
      return {
        r: r, H: [1, 2 + r], T: [-1, -2 + r],
        qs: [
          { q: 'Was ist die Zahl 1 für $f$?', o: ['eine Extremstelle (Maximalstelle)', 'ein Extremwert (Maximum)', 'ein Extrempunkt', 'eine Nullstelle'], a: 0 },
          { q: 'Was ist der Punkt $H(1|' + A.zahl(2 + r) + ')$?', o: ['ein Hochpunkt (Extrempunkt)', 'eine Extremstelle', 'ein Extremwert', 'ein Schnittpunkt mit der $x$-Achse'], a: 0 },
          { q: 'Was ist die Zahl ' + A.zahl(-2 + r).replace('−', '−') + ' für $f$?', o: ['ein Extremwert (lokales Minimum)', 'eine Minimalstelle', 'ein Tiefpunkt', 'der $y$-Achsenabschnitt'], a: 0 },
          { q: 'Wie lautet der $y$-Achsenabschnitt von $f$?', o: ['$' + A.zahl(r) + '$', '$S_y(0|' + A.zahl(r) + ')$', '$1$', '$' + A.zahl(2 + r) + '$'], a: 0 },
          { q: 'Ist $H(1|' + A.zahl(2 + r) + ')$ ein globaler Hochpunkt?', o: ['Nein – weiter links liegen Punkte des Graphen höher.', 'Ja – kein Punkt des Graphen liegt höher.', 'Ja – denn $H$ ist der einzige Hochpunkt.'], a: 0 }
        ]
      };
    },
    ablesen: function (R) {
      var q = R.pick([-3, -2, -1]), s = R.pick([-1, 0, 1]);
      return { q: q, s: s, T1: [-2 + s, q], T2: [2 + s, q], H: [s, 4 + q] };
    },
    sach: function (R) {
      var c = R.pick([300, 350, 400, 450]);
      return { c: c, H: [2, c], T: [4, c - 20], start: c - 100, end: c + 80 };
    },
    papier: function (R) {
      var r = R.pick([1, 2]), a = R.pick([-1, 1]);
      // f(x) = a·(x + r)(x − 2)²
      var p = A.fromRoots(a, [-r, 2, 2]);
      return { r: r, a: a, p: p };
    },
    zusatz: function (R) { return { n: R.pick([4, 5]), lead: R.pick([-3, -2, 3]), c0: R.pick([-4, 2, 5]) }; }
  };

  KP.defineWeek({
    n: 2,
    order: ['einstieg', 'erkennen', 'grad', 'ausmult', 'xminus2', 'begriffe', 'ablesen', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Einstieg ----------
      var s1 = E.section('Ganzrationale Funktionen', [
        A.box('Definition', [
          P('Eine Funktion $f$ heißt **ganzrational**, wenn sich ihr Funktionsterm so schreiben lässt:'),
          h('p', { class: 'formula' }, M.view('f(x)=a_{n}·x^{n}+a_{n−1}·x^{n−1}+…+a_{1}·x+a_{0}')),
          P('Dabei ist $n$ eine natürliche Zahl, und die Zahlen $a_n$ bis $a_0$ sind reelle Zahlen mit $a_n≠0$. Sie heißen **Koeffizienten**.'),
          A.list([
            'Die höchste Hochzahl $n$ ist der **Grad** von $f$.',
            '$a_n$, der Koeffizient vor der höchsten Potenz, heißt **Leitkoeffizient**.',
            '$a_0$, der Summand ohne $x$, heißt **absolutes Glied**.'
          ]),
          P('**Beispiel:** $f(x)=2x^3−x+5$ ist ganzrational vom Grad 3 mit dem Leitkoeffizienten 2 und dem absoluten Glied 5. Die fehlende Potenz $x^2$ hat den Koeffizienten 0.'),
          P('Ganzrationale Funktionen sind für alle reellen Zahlen definiert: $D_f=\\R$. Steht $x$ im Nenner, unter einer Wurzel oder in der Hochzahl, ist die Funktion nicht ganzrational.')
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 erkennen ----------
      var s2 = E.section('Ganzrational oder nicht?', [
        E.tasks('erkennen', 'Ganzrational?', V.erkennen, {
          before: [P('Manchmal musst du den Term erst ausmultiplizieren, um zu sehen, dass er ganzrational ist.')]
        }).el
      ]);

      // ---------- 3 Grad und Koeffizienten ----------
      var g3 = E.gen('grad', V.grad);
      var s3 = E.section('Grad und Koeffizienten', [
        A.partsStep(E, 'grad', 'Ablesen', {
          task: 'Gegeben ist die ganzrationale Funktion $f$ mit $f(x)=' + g3.f + '$. Gib den Grad, den Leitkoeffizienten und das absolute Glied an.',
          parts: [function (st) {
            return A.sentence(['Grad: ', A.blank(st, 'n', g3.n, { model: String(g3.n), label: 'Grad' }), ', Leitkoeffizient: ', A.blank(st, 'a', g3.lead, { model: A.zahl(g3.lead), label: 'Leitkoeffizient' }),
              ', absolutes Glied: ', A.blank(st, 'c', g3.c0, { model: A.zahl(g3.c0), label: 'absolutes Glied' })], { name: '' });
          }],
          tip: KP.tip('Ordne die Summanden in Gedanken nach den Hochzahlen. Das Vorzeichen gehört zum Koeffizienten: Bei $5−4x^6$ ist der Leitkoeffizient −4.')
        }).el
      ]);

      // ---------- 4 Ausmultiplizieren ----------
      var g4 = E.gen('ausmult', V.ausmult);
      var s4 = E.section('Ausmultiplizieren', [
        A.box('Erst ausmultiplizieren', [
          P('Ist der Term als Produkt gegeben, siehst du Grad und Koeffizienten erst nach dem Ausmultiplizieren. Das ist eine Termumformung: Die Zeilen verbindest du mit =.'),
          P('Am Ende steht die **Normalform**: zusammengefasst und nach fallenden Hochzahlen geordnet.'),
          P('**Beispiel:**'),
          ED.show(['g(x)=(x+4)(x^{2}−2)=x^{3}−2x+4x^{2}−8=x^{3}+4x^{2}−2x−8'], { nums: false })
        ]),
        A.wayStep(E, 'ausmult', 'Normalform berechnen', {
          task: ['Gegeben ist $f$ mit $f(x)=' + g4.f + '$.', 'a) Berechne die Normalform von $f(x)$. Beginne mit $f(x)=' + g4.f + '$.'],
          T: g4.T, model: g4.model, keys: ['f(x)'], wayLabel: 'a) Deine Rechnung:',
          parts: [function (st) {
            return A.sentence(['b) Grad: ', A.blank(st, 'n', 3, { model: '3', label: 'Grad' }), ', Leitkoeffizient: ', A.blank(st, 'a', g4.a, { model: A.zahl(g4.a), label: 'Leitkoeffizient' }),
              ', absolutes Glied: ', A.blank(st, 'c', g4.b * g4.c, { model: A.zahl(g4.b * g4.c), label: 'absolutes Glied' })], { name: 'b)' });
          }],
          tip: KP.tip('Multipliziere jeden Summanden der ersten Klammer mit jedem Summanden der zweiten. Ordne danach nach fallenden Hochzahlen.')
        }).el
      ]);

      // ---------- 5 Gegenbeispiel x^(−2) ----------
      var g5 = E.gen('xminus2', V.xminus2), c5 = g5.c;
      var fterm5 = (c5 === 1 ? '' : c5 === -1 ? '−' : A.zahl(c5) + '·') + 'x^{−2}';
      var s5 = E.section('Ein Gegenbeispiel: negative Hochzahl', [
        A.box('Negative Hochzahlen', [
          P('Für $x≠0$ ist $x^{−2}=\\frac{1}{x^2}$. Die Hochzahl −2 ist keine natürliche Zahl – Funktionen wie $f(x)=x^{−2}$ sind deshalb **nicht ganzrational**.'),
          P('Für $x=0$ ist $x^{−2}$ nicht definiert, denn dann stünde im Nenner 0.')
        ]),
        A.partsStep(E, 'xminus2', 'Eine Funktion mit negativer Hochzahl', {
          task: ['Gegeben ist $f$ mit $f(x)=' + fterm5 + '$.', A.fig({ x: [-4, 4], y: c5 > 0 ? [-1, 6] : [-6, 1], w: 260, step: [1, 1], curves: [{ f: function (x) { return c5 / (x * x); }, label: 'f', at: 1.3 }], aria: 'Graph von f' }, 'Graph von $f$')],
          parts: [
            function (st) { return A.mc(E, 'xminus2-mc', [{ q: 'Warum ist $f$ nicht ganzrational?', o: ['Die Hochzahl −2 ist keine natürliche Zahl.', 'Der Funktionsterm hat nur einen Summanden.', 'Der Koeffizient ist negativ.', 'Der Graph ist achsensymmetrisch.'], a: 0 }], E.obj('xminus2-mc', [])); },
            function (st) { return A.set(st, 'D', S.ohne(S.R(), [0]), { text: 'Gib die Definitionsmenge an.', pre: 'D_{f}=', name: 'Definitionsmenge' }); },
            function (st) { return A.set(st, 'W', g5.W, { text: 'Gib die Wertemenge an.', pre: 'W_{f}=', name: 'Wertemenge' }); }
          ]
        }).el
      ]);

      // ---------- 6 Besondere Punkte ----------
      var g6 = E.gen('begriffe', V.begriffe), f6 = cubicGraph(g6.r), z6 = zeros(f6, -3, 3);
      var pts6 = [{ x: 1, y: 2 + g6.r, label: 'H', dx: 6, dy: -10 }, { x: -1, y: -2 + g6.r, label: 'T', dx: 6, dy: 18 }, { x: 0, y: g6.r, label: 'S_y', dx: 8, dy: g6.r >= 1 ? 18 : -8, cls: 'c2' }]
        .concat(z6.map(function (x, i) { return { x: x, y: 0, label: 'N_' + (i + 1), dx: x < 0 ? -26 : 6, dy: -9, cls: 'blue' }; }));
      var s6 = E.section('Besondere Punkte', [
        A.box('Achsenschnittpunkte', [
          A.list([
            'Eine **Nullstelle** ist eine Zahl $x$ mit $f(x)=0$. Der Punkt $N(x|0)$ ist ein **Schnittpunkt mit der $x$-Achse**.',
            'Der **$y$-Achsenabschnitt** ist die Zahl $f(0)$. Der Punkt $S_y(0|f(0))$ ist der **Schnittpunkt mit der $y$-Achse**.'
          ])
        ]),
        A.box('Hoch- und Tiefpunkte', [
          A.list([
            'Ein **Hochpunkt** $H$ ist ein Punkt, in dessen Umgebung kein Punkt des Graphen höher liegt. Ein **Tiefpunkt** $T$ ist ein Punkt, in dessen Umgebung kein Punkt tiefer liegt. Beide heißen **Extrempunkte**.',
            'Die $x$-Koordinate eines Extrempunkts heißt **Extremstelle** (Maximal- bzw. Minimalstelle), die $y$-Koordinate heißt **Extremwert** oder **Extremum** (Maximum bzw. Minimum).',
            'Ein Hochpunkt ist **global**, wenn überhaupt kein Punkt des Graphen höher liegt; sonst ist er nur **lokal**. Für Tiefpunkte gilt das entsprechend.'
          ]),
          A.fig({ x: [-3, 3], y: [Math.min(g6.r - 4, -1), Math.max(g6.r + 4, 2)], w: 300, step: [1, 1], curves: [{ f: f6, label: 'f', at: -1.9, ldx: -20 }], points: pts6, aria: 'Graph von f mit Hochpunkt, Tiefpunkt und Achsenschnittpunkten' },
            'Graph von $f$ mit $f(x)=−x^3+3x' + (g6.r ? (g6.r < 0 ? '−' + (-g6.r) : '+' + g6.r) : '') + '$: Hochpunkt $H(1|' + A.zahl(2 + g6.r) + ')$, Tiefpunkt $T(−1|' + A.zahl(-2 + g6.r) + ')$, Schnittpunkt mit der $y$-Achse $S_y(0|' + A.zahl(g6.r) + ')$ und die Schnittpunkte mit der $x$-Achse.')
        ]),
        E.tasks('begriffe', 'Die richtigen Begriffe', g6.qs).el
      ]);

      // ---------- 7 Ablesen ----------
      var g7 = E.gen('ablesen', V.ablesen), f7 = function (x) { var u = x - g7.s; return 0.25 * (u * u - 4) * (u * u - 4) + g7.q; };
      var s7 = E.section('Extrempunkte ablesen', [
        A.partsStep(E, 'ablesen', 'Hoch- und Tiefpunkte', {
          task: ['Der Graph gehört zu einer ganzrationalen Funktion $f$ vom Grad 4 mit $D_f=\\R$. Er steigt links und rechts unbegrenzt an.', A.fig({ x: [-4, 4], y: [g7.q - 1, g7.q + 6], w: 300, step: [1, 1], curves: [{ f: f7, label: 'f', at: 2.9 + g7.s > 3.6 ? 3.4 : 2.9 + g7.s }], aria: 'Graph einer Funktion vom Grad 4' })],
          parts: [
            function (st) { return A.points(st, 'pts', [g7.T1, g7.T2, g7.H], ['T_{1}(' + A.zahl(g7.T1[0]) + '|' + A.zahl(g7.q) + ')', 'T_{2}(' + A.zahl(g7.T2[0]) + '|' + A.zahl(g7.q) + ')', 'H(' + A.zahl(g7.s) + '|' + A.zahl(g7.H[1]) + ')'],
              { text: 'a) Gib alle Hoch- und Tiefpunkte an. Nenne sie $H$, $T_1$ und $T_2$.', name: 'a)', ph: 'z. B. H(1|5)', idBase: 'ablesen-pts' }); },
            function (st) {
              return A.sentence(['b) Das globale Minimum von $f$ ist ', A.blank(st, 'min', g7.q, { model: A.zahl(g7.q), label: 'globales Minimum' }), '. Der Hochpunkt ist ',
                A.choice(st, 'hlg', ['nur lokal', 'global'], 0, { R: E.rng('ablesen:hlg') }), ', denn ', A.choice(st, 'grund', ['links und rechts liegen höhere Punkte', 'kein Punkt liegt höher'], 0, { R: E.rng('ablesen:grund') }), '.'], { name: 'b)' });
            }
          ],
          tip: KP.tip('Ein Punkt wird so angegeben: Name, dann die Koordinaten mit senkrechtem Strich, z. B. $T_1(−3|1)$. Das globale Minimum ist ein Wert, kein Punkt.')
        }).el
      ]);

      // ---------- 8 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach), c8 = g8.c, f8 = function (x) { return 5 * (x - 2) * (x - 2) * (x - 5) + c8; };
      var s8 = E.section('Anwendung: ein Höhenprofil', [
        A.partsStep(E, 'sach', 'Auf und ab', {
          task: ['Ein Wanderweg ist 6 km lang. Die Funktion $h$ mit $D_h=[0;6]$ beschreibt die Höhe des Weges über dem Meeresspiegel (in m) nach $x$ Kilometern. Der Graph zeigt das Höhenprofil.', A.fig({ x: [-0.7, 6.6], y: [c8 - 120, c8 + 100], w: 330, h: 300, axisAt: [0, c8 - 120], step: [1, 20], grid: [0.5, 10], yName: 'h(x)',
            curves: [{ f: f8, dom: [0, 6], ends: true }], aria: 'Höhenprofil des Wanderwegs' }, '$x$: Strecke in km, $h(x)$: Höhe in m')],
          parts: [
            function (st) { return A.points(st, 'pts', [g8.H, g8.T], ['H(2|' + c8 + ')', 'T(4|' + (c8 - 20) + ')'], { text: 'a) Gib den Hochpunkt $H$ und den Tiefpunkt $T$ im Inneren des Weges an.', name: 'a)', ph: 'z. B. H(1|500)', idBase: 'sach-pts' }); },
            function (st) {
              return A.sentence(['b) Der höchste Punkt des Weges liegt nach ', A.blank(st, 'xm', 6, { model: '6', label: 'Strecke in km' }), ' km auf ', A.blank(st, 'hm', g8.end, { model: String(g8.end), label: 'Höhe in m' }),
                ' m Höhe. Der Hochpunkt $H$ ist deshalb ', A.choice(st, 'lg', ['nur lokal', 'global'], 0, { R: E.rng('sach:lg') }), '.'], { name: 'b)' });
            },
            function (st) { return A.sentence(['c) Der tiefste Punkt des Weges liegt ', A.choice(st, 'tief', ['am Start', 'im Tiefpunkt T', 'am Ziel'], 0, { R: E.rng('sach:tief') }), ' in ', A.blank(st, 'hmin', g8.start, { model: String(g8.start), label: 'Höhe in m' }), ' m Höhe.'], { name: 'c)' }); }
          ],
          tip: KP.tip('Bei einer eingeschränkten Definitionsmenge können der höchste und der tiefste Punkt auch am Rand liegen – hier am Start oder am Ziel des Weges.')
        }).el
      ]);

      // ---------- 9 Papier ----------
      var s9 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R), p = g.p, a = g.a, r = g.r;
          var fx = (a < 0 ? '−' : '') + '(x+' + r + ')(x−2)^{2}', f = KP.polyFn(p);
          var exp1 = (a < 0 ? '−' : '') + '(x+' + r + ')(x^{2}−4x+4)';
          var xe = (2 - 2 * r) / 3, ye = f(xe);
          return {
            title: 'Eine ganzrationale Funktion untersuchen',
            intro: ['Gegeben ist die Funktion $f$ mit $f(x)=' + fx + '$ und $D_f=\\R$. Die Abbildung zeigt ihren Graphen.',
              A.fig({ x: [-3, 4], y: a > 0 ? [-6, 11] : [-11, 6], w: 260, h: 300, step: [1, 2], grid: [1, 1], curves: [{ f: f, label: 'f', at: a > 0 ? 3.1 : 3.1 }], aria: 'Graph von f' })],
            parts: [
              { t: 'Berechne die Normalform von $f(x)$ und gib Grad, Leitkoeffizient und absolutes Glied an.', s: [ED.show(['f(x)=' + fx + '=' + exp1 + '=' + A.term(p)], { nums: false }), 'Grad 3, Leitkoeffizient ' + A.zahl(p[3]) + ', absolutes Glied ' + A.zahl(p[0]) + '.'] },
              { t: 'Berechne den $y$-Achsenabschnitt und gib den Schnittpunkt mit der $y$-Achse an.', s: ['$f(0)=' + A.zahl(p[0]) + '$, also $S_y(0|' + A.zahl(p[0]) + ')$.'] },
              { t: 'Lies die Schnittpunkte mit der $x$-Achse und die Extrempunkte am Graphen ab (auf eine Nachkommastelle).', s: ['$N_1(' + A.zahl(-r) + '|0)$ und $N_2(2|0)$. ' + (a > 0 ? 'Hochpunkt' : 'Tiefpunkt') + ' etwa bei $(' + A.dec(Math.round(xe * 10) / 10) + '|' + A.dec(Math.round(ye * 10) / 10) + ')$, ' + (a > 0 ? 'Tiefpunkt' : 'Hochpunkt') + ' $(2|0)$.'] },
              { t: 'Entscheide, ob die Extrempunkte lokal oder global sind, und begründe.', s: ['Beide sind nur lokal: Der Graph einer Funktion vom Grad 3 steigt auf einer Seite unbegrenzt an und fällt auf der anderen unbegrenzt ab. Es gibt also höhere und tiefere Punkte.'] }
            ]
          };
        }).el
      ]);

      // ---------- 10 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz);
      var s10 = E.section('Zusatzaufgabe', [
        A.partsStep(E, 'zusatz', 'Eine Funktion nach Wunsch', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          task: 'Gib den Term einer ganzrationalen Funktion $f$ vom Grad ' + g9.n + ' an, deren Leitkoeffizient ' + A.zahl(g9.lead) + ' und deren absolutes Glied ' + A.zahl(g9.c0) + ' ist. Außerdem soll $f(1)=0$ gelten.',
          parts: [function (st) {
            var model = (function () { // a·x^n + b·x + c0 mit f(1) = 0
              var b = -(g9.lead + g9.c0);
              return A.term([g9.c0, b].concat(new Array(g9.n - 2).fill(0)).concat([g9.lead]));
            })();
            return A.polyProp(st, 'f', function (c) {
              var n = c.length - 1;
              while (n > 0 && Math.abs(c[n]) < 1e-12) n--;
              if (n !== g9.n) return 'Der Grad stimmt noch nicht.';
              if (Math.abs(c[n] - g9.lead) > 1e-9) return 'Der Leitkoeffizient stimmt noch nicht.';
              if (Math.abs(c[0] - g9.c0) > 1e-9) return 'Das absolute Glied stimmt noch nicht.';
              var s = c.reduce(function (a, b) { return a + b; }, 0);
              if (Math.abs(s) > 1e-9) return 'Es gilt noch nicht $f(1)=0$.';
              return true;
            }, model, { pre: 'f(x)=', name: 'Funktionsterm' });
          }],
          tip: KP.tip('Beginne mit dem Leitkoeffizienten und dem absoluten Glied. Mit einem weiteren Summanden, z. B. $b·x$, kannst du $f(1)=0$ erreichen: Setze 1 ein und bestimme $b$.')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche lernst du die ganzrationalen Funktionen kennen: wie ihr Term aufgebaut ist und wie Grad und Koeffizienten heißen. Außerdem benennst du besondere Punkte am Graphen – Achsenschnittpunkte, Hoch- und Tiefpunkte – und unterscheidest lokal und global.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]);
    }
  });
})();

</script>
<script>
// Woche 3: GeoGebra – der CAS-Rechner (nur Wiederholung der Wochen 1 und 2 mit dem Rechner, dazu Wertetabellen)
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, M = KP.M, P = KP.P;

  // Ausgabe des Rechners (nur Text) mit Eingabe
  function cas(inp, out) { return h('div', { class: 'cas' }, h('div', { class: 'in' }, 'Eingabe: ', inp), h('div', { class: 'out' }, 'Ausgabe: ', out)); }
  function gg(v) { return String(v).replace('−', '-'); } // Zahl so, wie GeoGebra sie zeigt (Dezimalpunkt)
  function ggNum(v) { return (Math.round(v * 1000) / 1000).toString(); }
  // reelle Nullstellen eines Polynoms (Koeffizienten aufsteigend, auch Dezimalzahlen)
  function roots(c) { return M.solvePoly(A.poly(c.map(function (x) { return Math.round(x * 1000); }))).v.slice().sort(function (a, b) { return a - b; }); }
  function r2(v) { return A.dec(Math.round(v * 100) / 100, 2); }

  var V = KP.V.w3 = {
    werte: function (R) {
      var b = R.pick([-3, -2, 2]), c = R.pick([1, 3, 5]);
      var f = function (x) { return 0.25 * x * x * x + b * x + c; };
      return { b: b, c: c, f: '\\frac{1}{4}x^{3}' + (b < 0 ? '−' + (-b) : '+' + b) + 'x+' + c, v1: f(2.5), v2: f(-0.5), v3: f(Math.sqrt(3)), gg: '1/4 x^3' + (b < 0 ? '-' + (-b) : '+' + b) + 'x+' + c };
    },
    tabelle: function (R) {
      var a = R.pick([2, 3, 4]), b = R.pick([-1, 1, 2]);
      var g = function (x) { return x * x * x * x - a * x * x + b * x; };
      return { a: a, b: b, g: 'x^{4}−' + a + 'x^{2}' + (b < 0 ? '−x' : '+' + (b === 1 ? '' : b) + 'x'), gg: 'x^4-' + a + 'x^2' + (b < 0 ? '-x' : '+' + (b === 1 ? '' : b) + 'x'),
        xs: [-2, -1, 0, 1, 2], ys: [-2, -1, 0, 1, 2].map(g), xs2: [0, 0.5, 1, 1.5, 2], ys2: [0, 0.5, 1, 1.5, 2].map(g) };
    },
    nullexakt: function (R) {
      var a = R.pick([2, 3, 5, 6, 7]), s = Math.sqrt(a);
      return { a: a, f: 'x^{3}−' + a + 'x', sols: [-s, 0, s], model: 'x=−\\sqrt{' + a + '}∨x=0∨x=\\sqrt{' + a + '}', pts: [[-s, 0], [0, 0], [s, 0]],
        ptModel: ['N_{1}(−\\sqrt{' + a + '}|0)', 'N_{2}(0|0)', 'N_{3}(\\sqrt{' + a + '}|0)'] };
    },
    nullrund: function (R) {
      var pq = R.pick([[3, 1], [4, 1], [4, 2], [5, 3], [3, -1], [5, -2]]), c = [pq[1], -pq[0], 0, 1], z = roots(c);
      return { p: pq[0], q: pq[1], f: A.term(c), sols: z, model: z.map(function (x) { return 'x≈' + r2(x); }).join('∨') };
    },
    gleichung: function (R) {
      var b = R.pick([2, 4]), c = R.pick([3, 4, 6, 8]); // f(x) = x² − b·x, f(x) = c → x = b/2 ± √(b²/4 + c)
      var m = b / 2, d = m * m + c, sd = Math.sqrt(d);
      var exact = Math.abs(sd - Math.round(sd)) < 1e-9;
      if (exact) c = c + 1, d = m * m + c, sd = Math.sqrt(d);
      return { b: b, c: c, m: m, d: d, f: 'x^{2}−' + b + 'x', sols: [m - sd, m + sd], model: 'x=' + m + '−\\sqrt{' + d + '}∨x=' + m + '+\\sqrt{' + d + '}', modelR: 'x≈' + r2(m - sd) + '∨x≈' + r2(m + sd) };
    },
    uebersetzen: function (R) {
      var a = R.pick([-1.5, -2.5, -0.5]), b = R.pick([2, 3, 4]), px = R.pick([2.5, 1.5, -0.5]), py = R.pick([-3, 4, -2]), s = R.pick([3, 5, 7]);
      return { a: a, b: b, px: px, py: py, s: s };
    },
    normal: function (R) {
      var r = R.pick([1, 2]), q = R.pick([-1, -3, 2]);
      var c = A.fromRoots(1, [r, r, r, -q]); // (x − r)³(x + q)
      return { r: r, q: q, c: c, f: '(x−' + r + ')^{3}(x' + (q < 0 ? '−' + (-q) : '+' + q) + ')', gg: '(x-' + r + ')^3 (x' + (q < 0 ? '-' + (-q) : '+' + q) + ')' };
    },
    sach: function (R) {
      var abc = R.pick([[-0.08, 0.9, 1.2], [-0.06, 0.8, 1.4], [-0.1, 1.1, 1.3], [-0.05, 0.7, 1.6]]), a = abc[0], b = abc[1], c = abc[2];
      var z = roots([c, b, a]), z2 = roots([c - 2, b, a]);
      return { a: a, b: b, c: c, f: A.dec(a) + 'x^{2}+' + A.dec(b) + 'x+' + A.dec(c), gg: a + 'x^2+' + b + 'x+' + c, end: z[1], two: z2 };
    },
    papier: function (R) {
      var p = R.pick([[4, 1], [6, 2], [5, 1]]), c = [p[1], -p[0], 0, 1];
      return { p: p[0], q: p[1], c: c, z: roots(c) };
    },
    zusatz: function (R) {
      var px = R.pick([2, 3]), py = R.pick([10, 12, 5]), k = R.pick([2, 3]);
      return { px: px, py: py, k: k, a: (py + k * px) / (px * px * px) };
    }
  };

  KP.defineWeek({
    n: 3,
    order: ['einstieg', 'werte', 'tabelle', 'nullexakt', 'nullrund', 'gleichung', 'uebersetzen', 'normal', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Einstieg ----------
      var s1 = E.section('Der CAS-Rechner', [
        A.box('So startest du', [
          P('Öffne die App **GeoGebra Rechner Suite** und wähle den Rechner **CAS**. In dieser Woche arbeitest du nur mit dem CAS-Rechner. Neue Mathematik gibt es nicht – du wiederholst die Wochen 1 und 2 mit dem Rechner.'),
          P('In jede Zeile tippst du einen Befehl und bestätigst mit der Eingabetaste. Die Ausgabe erscheint darunter.')
        ]),
        A.box('Die wichtigsten Befehle', [
          A.list([
            '`f(x):=x^3-2x` – definiert die Funktion $f$ mit $f(x)=x^3−2x$. Wichtig ist der Doppelpunkt vor dem Gleichheitszeichen.',
            '`f(2)` – berechnet den Funktionswert $f(2)$ exakt, also als Bruch oder mit Wurzel.',
            '`Folge(f(k), k, -2, 2)` – berechnet die Funktionswerte für $k=−2$, $−1$, $0$, $1$, $2$: eine Wertetabelle. Mit `Folge(f(k), k, 0, 2, 0.5)` geht es in Schritten von 0,5.',
            '`Löse(f(x)=0)` – löst die Gleichung exakt.',
            '`NLöse(f(x)=0)` – löst die Gleichung näherungsweise. Die Lösungen sind gerundet.',
            '`Multipliziere((x+1)(x-3))` – multipliziert aus.',
            'Die Taste ≈ zeigt ein exaktes Ergebnis als gerundete Dezimalzahl.'
          ])
        ]),
        A.box('GeoGebra schreibt anders als du', [
          P('Der Rechner hat seine eigene Schreibweise. In GeoGebra tippst du sie so ein – auf dem Papier und hier auf der Seite schreibst du korrekt:'),
          A.list([
            'GeoGebra zeigt Dezimalzahlen mit Punkt, z. B. `2.5`. Du schreibst $2,5$.',
            'GeoGebra zeigt Lösungen in Mengenklammern mit Kommas, z. B. `{x = -2, x = 2}`. Du schreibst $x=−2∨x=2$.',
            'GeoGebra zeigt Punkte mit Komma, z. B. `(2, 3)`. Du schreibst $P(2|3)$.'
          ])
        ]),
        A.box('Der Operator „bestimme“', [
          P('Heißt es „**Bestimme** …“, darfst du den Rechner benutzen. Aufgeschrieben wird nur das Ergebnis – in korrekter Schreibweise.'),
          P('Steht dabei „gerundet auf zwei Nachkommastellen“, schreibst du ≈, z. B. $x≈1,73$. Sonst gibst du das Ergebnis exakt an, z. B. $x=\\sqrt{3}$.')
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 Funktionswerte ----------
      var g2 = E.gen('werte', V.werte);
      var s2 = E.section('Funktionswerte bestimmen', [
        A.partsStep(E, 'werte', 'Funktionswerte', {
          task: ['Gegeben ist die Funktion $f$ mit $f(x)=' + g2.f + '$. Definiere sie im CAS: `f(x):=' + g2.gg + '`', 'Bestimme die Funktionswerte. Brüche darfst du als Bruch oder als Dezimalzahl angeben.'],
          parts: [function (st) {
            return A.sentence(['$f(2,5)=$ ', A.blank(st, 'a', g2.v1, { model: A.num(g2.v1), label: 'f(2,5)' }), ' (exakt), $f(−\\frac{1}{2})=$ ', A.blank(st, 'b', g2.v2, { model: A.num(g2.v2), label: 'f(−1/2)' }),
              ' (exakt) und $f(\\sqrt{3})≈$ ', A.blank(st, 'c', g2.v3, { model: r2(g2.v3), label: 'f(√3) gerundet', round: 2 }), ' (gerundet auf zwei Nachkommastellen).'], { name: '' });
          }],
          tip: KP.tip('Tippe im CAS `f(2.5)` – mit Punkt. Für $−\\frac{1}{2}$ tippst du `f(-1/2)`, für $\\sqrt{3}$ tippst du `f(sqrt(3))`. Mit der Taste ≈ wird ein exaktes Ergebnis zur Dezimalzahl.')
        }).el
      ]);

      // ---------- 3 Wertetabelle ----------
      var g3 = E.gen('tabelle', V.tabelle);
      var s3 = E.section('Wertetabellen', [
        A.partsStep(E, 'tabelle', 'Wertetabelle mit Folge', {
          task: ['Gegeben ist $g$ mit $g(x)=' + g3.g + '$. Definiere $g$ im CAS: `g(x):=' + g3.gg + '`'],
          parts: [
            function (st) { return A.table(st, 't1', g3.xs, g3.ys, { fn: 'g', text: 'a) Bestimme die Wertetabelle für die ganzen Zahlen von −2 bis 2 mit `Folge(g(k), k, -2, 2)`.', name: 'a)' }); },
            function (st) { return A.table(st, 't2', g3.xs2, g3.ys2, { fn: 'g', text: 'b) Bestimme die Wertetabelle von 0 bis 2 in Schritten von 0,5. Gib die Werte als Dezimalzahl oder als Bruch an.', name: 'b)' }); }
          ],
          tip: KP.tip('Die Liste zeigt GeoGebra in Mengenklammern mit Kommas, z. B. `{3, 0, -1}`. In die Tabelle trägst du die Werte einzeln ein. Die Schrittweite ist bei `Folge` die letzte Angabe.')
        }).el
      ]);

      // ---------- 4 Nullstellen exakt ----------
      var g4 = E.gen('nullexakt', V.nullexakt);
      var s4 = E.section('Nullstellen exakt bestimmen', [
        P('Nullstellen kennst du aus Woche 2: die Stellen, an denen der Graph die $x$-Achse schneidet oder berührt. Mit dem Rechner bestimmst du sie über die Gleichung $f(x)=0$.'),
        A.partsStep(E, 'nullexakt', 'Exakt mit Löse', {
          task: 'Gegeben ist $f$ mit $f(x)=' + g4.f + '$.',
          parts: [
            function (st) { return A.result(st, 'r', { v: 'x', sols: g4.sols }, g4.model, { text: 'a) Bestimme die Lösungen der Gleichung $f(x)=0$ exakt.', name: 'a)' }); },
            function (st) { return A.points(st, 'p', g4.pts, g4.ptModel, { text: 'b) Gib die Schnittpunkte des Graphen mit der $x$-Achse an.', name: 'b)', idBase: 'nullexakt-p' }); }
          ],
          tip: KP.tip('Mehrere Lösungen verbindest du mit ∨. Eine Wurzel schreibst du mit der Taste √. Für Punkte gibt es ein eigenes Tastenfeld mit dem senkrechten Strich.')
        }).el
      ]);

      // ---------- 5 Nullstellen gerundet ----------
      var g5 = E.gen('nullrund', V.nullrund);
      var s5 = E.section('Nullstellen gerundet bestimmen', [
        A.partsStep(E, 'nullrund', 'Näherungsweise mit NLöse', {
          task: 'Gegeben ist $f$ mit $f(x)=' + g5.f + '$. Hier liefert `Löse` sehr unübersichtliche Terme. Nimm `NLöse`.',
          parts: [function (st) { return A.result(st, 'r', { v: 'x', sols: g5.sols, round: 2 }, g5.model, { text: 'Bestimme die Nullstellen von $f$, gerundet auf zwei Nachkommastellen.', name: 'Nullstellen' }); }],
          tip: KP.tip('Gerundete Werte schreibst du mit ≈, z. B. $x≈−0,41$. Mehrere Lösungen verbindest du mit ∨.')
        }).el
      ]);

      // ---------- 6 Gleichungen ----------
      var g6 = E.gen('gleichung', V.gleichung);
      var s6 = E.section('Gleichungen lösen', [
        A.partsStep(E, 'gleichung', 'Stellen zu einem Funktionswert', {
          task: 'Gegeben ist $f$ mit $f(x)=' + g6.f + '$. An welchen Stellen nimmt $f$ den Wert ' + g6.c + ' an?',
          parts: [
            function (st) { return A.result(st, 'ex', { v: 'x', sols: g6.sols }, g6.model, { text: 'a) Bestimme die Stellen exakt.', name: 'a)' }); },
            function (st) { return A.result(st, 'rd', { v: 'x', sols: g6.sols, round: 2 }, g6.modelR, { text: 'b) Bestimme die Stellen gerundet auf zwei Nachkommastellen.', name: 'b)' }); }
          ],
          tip: KP.tip('Tippe `Löse(f(x)=' + g6.c + ')` bzw. `NLöse(f(x)=' + g6.c + ')`. Statt zwei Lösungen mit ∨ darfst du bei a) auch ± verwenden.')
        }).el
      ]);

      // ---------- 7 Übersetzen ----------
      var g7 = E.gen('uebersetzen', V.uebersetzen);
      var s7 = E.section('Richtig aufschreiben', [
        A.partsStep(E, 'uebersetzen', 'Vom Rechner aufs Papier', {
          task: 'Schreibe die Ausgaben des Rechners in korrekter Schreibweise auf.',
          parts: [
            function (st) {
              var p = A.result(st, 'a', { v: 'x', sols: [g7.a, g7.b] }, 'x=' + A.dec(g7.a) + '∨x=' + g7.b, { name: 'a)' });
              p.el.insertBefore(cas(h('code', null, 'Löse(…)'), h('code', null, '{x = ' + gg(g7.a) + ', x = ' + g7.b + '}')), p.el.firstChild);
              p.el.insertBefore(h('p', { class: 'part-q' }, 'a) Lösungen einer Gleichung:'), p.el.firstChild);
              return p;
            },
            function (st) {
              var p = A.points(st, 'b', [[g7.px, g7.py]], ['P(' + A.dec(g7.px) + '|' + A.zahl(g7.py) + ')'], { name: 'b)', ph: 'z. B. P(1|2)', idBase: 'uebersetzen-b' });
              p.el.insertBefore(cas(h('code', null, 'P=(' + gg(g7.px) + ', ' + gg(g7.py) + ')'), h('code', null, 'P = (' + gg(g7.px) + ', ' + gg(g7.py) + ')')), p.el.firstChild);
              p.el.insertBefore(h('p', { class: 'part-q' }, 'b) Ein Punkt P:'), p.el.firstChild);
              return p;
            },
            function (st) {
              var s = Math.sqrt(g7.s);
              var p = A.result(st, 'c', { v: 'x', sols: [-s, s] }, 'x=±\\sqrt{' + g7.s + '}', { name: 'c)' });
              p.el.insertBefore(cas(h('code', null, 'Löse(x^2=' + g7.s + ')'), h('code', null, '{x = -√' + g7.s + ', x = √' + g7.s + '}')), p.el.firstChild);
              p.el.insertBefore(h('p', { class: 'part-q' }, 'c) Lösungen einer Gleichung:'), p.el.firstChild);
              return p;
            }
          ]
        }).el
      ]);

      // ---------- 8 Ausmultiplizieren ----------
      var g8 = E.gen('normal', V.normal);
      var s8 = E.section('Ausmultiplizieren', [
        A.partsStep(E, 'normal', 'Normalform mit Multipliziere', {
          task: 'Gegeben ist $f$ mit $f(x)=' + g8.f + '$. Tippe `Multipliziere(' + g8.gg + ')`.',
          parts: [
            function (st) { return A.termIn(st, 'n', { v: 'x', p: A.poly(g8.c), normal: true }, A.term(g8.c), { text: 'a) Bestimme die Normalform von $f(x)$.', pre: 'f(x)=', name: 'a)' }); },
            function (st) {
              return A.sentence(['b) Grad: ', A.blank(st, 'g', 4, { model: '4', label: 'Grad' }), ', Leitkoeffizient: ', A.blank(st, 'l', 1, { model: '1', label: 'Leitkoeffizient' }),
                ', absolutes Glied: ', A.blank(st, 'c', g8.c[0], { model: A.zahl(g8.c[0]), label: 'absolutes Glied' })], { name: 'b)' });
            }
          ]
        }).el
      ]);

      // ---------- 9 Sachaufgabe ----------
      var g9 = E.gen('sach', V.sach);
      var s9 = E.section('Anwendung: ein Wasserstrahl', [
        A.partsStep(E, 'sach', 'Wie weit spritzt der Strahl?', {
          task: ['Ein Rasensprenger spritzt einen Wasserstrahl. Die Funktion $h$ mit $h(x)=' + g9.f + '$ beschreibt die Höhe des Strahls über dem Boden (in m) in der waagerechten Entfernung $x$ (in m) von der Düse – für $x≥0$, bis der Strahl auf dem Boden auftrifft.',
            A.fig({ x: [-1, Math.ceil(g9.end) + 1], y: [-0.5, 4.5], w: 340, h: 200, step: [2, 1], grid: [1, 0.5], yName: 'h(x)', curves: [{ f: function (x) { return g9.a * x * x + g9.b * x + g9.c; }, dom: [0, g9.end], ends: [true, false] }], aria: 'Flugbahn des Wasserstrahls' })],
          parts: [
            function (st) { return A.sentence(['a) Die Düse liegt ', A.blank(st, 'h0', g9.c, { model: A.dec(g9.c), label: 'Höhe in m' }), ' m über dem Boden.'], { name: 'a)' }); },
            function (st) { return A.sentence(['b) Der Strahl trifft etwa ', A.blank(st, 'w', g9.end, { model: r2(g9.end), label: 'Entfernung in m', round: 2 }), ' m von der Düse entfernt auf dem Boden auf (gerundet auf zwei Nachkommastellen).'], { name: 'b)' }); },
            function (st) { return A.result(st, 'zw', { v: 'x', sols: g9.two, round: 2 }, 'x≈' + r2(g9.two[0]) + '∨x≈' + r2(g9.two[1]), { text: 'c) Bestimme die Stellen, an denen der Strahl genau 2 m hoch ist, gerundet auf zwei Nachkommastellen.', name: 'c)' }); }
          ],
          tip: KP.tip('`NLöse(h(x)=0)` liefert zwei Lösungen. Nur eine passt zur Bedingung $x≥0$.')
        }).el
      ]);

      // ---------- 10 Papier ----------
      var s10 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R), c = g.c, f = KP.polyFn(c), xs = [-3, -2, -1, 0, 1, 2, 3];
          var ft = A.term(c), gg2 = 'x^3-' + g.p + 'x+' + g.q;
          return {
            title: 'Eine Funktion mit dem Rechner untersuchen',
            intro: 'Gegeben ist die Funktion $f$ mit $f(x)=' + ft + '$ und $D_f=\\R$. Du darfst den CAS-Rechner benutzen. Schreibe zu jeder Teilaufgabe auf, welchen Befehl du verwendet hast.',
            parts: [
              { t: 'Bestimme eine Wertetabelle von $f$ für die ganzen Zahlen von −3 bis 3.', s: ['`f(x):=' + gg2 + '`, dann `Folge(f(k), k, -3, 3)`:', h('div', { class: 'vtab-wrap' }, h('table', { class: 'vtab' }, h('tr', null, h('th', null, 'x'), xs.map(function (x) { return h('th', null, M.view(A.zahl(x))); })), h('tr', null, h('th', null, M.view('f(x)')), xs.map(function (x) { return h('td', null, M.view(A.zahl(f(x)))); }))))] },
              { t: 'Zeichne mithilfe der Tabelle den Graphen von $f$.', s: [A.fig({ x: [-3.5, 3.5], y: [-14, 14], w: 240, h: 300, step: [1, 4], grid: [1, 2], curves: [{ f: f, label: 'f', at: 2.6 }], aria: 'Graph von f' })] },
              { t: 'Bestimme die Nullstellen von $f$, gerundet auf zwei Nachkommastellen.', s: ['`NLöse(f(x)=0)`: $' + g.z.map(function (x) { return 'x≈' + r2(x); }).join('∨') + '$'] },
              { t: 'Gib den Schnittpunkt des Graphen mit der $y$-Achse an.', s: ['`f(0)` ergibt ' + g.q + ', also $S_y(0|' + g.q + ')$.'] },
              { t: 'Bestimme exakt, an welchen Stellen $f$ den Wert ' + g.q + ' annimmt.', s: ['`Löse(f(x)=' + g.q + ')`: $x=−\\sqrt{' + g.p + '}∨x=0∨x=\\sqrt{' + g.p + '}$'] }
            ]
          };
        }).el
      ]);

      // ---------- 11 Zusatz ----------
      var gz = E.gen('zusatz', V.zusatz);
      var s11 = E.section('Zusatzaufgabe', [
        A.partsStep(E, 'zusatz', 'Einen Parameter bestimmen', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          task: 'Die Funktion $f$ mit $f(x)=a·x^3−' + gz.k + 'x$ hat eine noch unbekannte Zahl $a$. Ihr Graph soll durch den Punkt $P(' + gz.px + '|' + gz.py + ')$ gehen.',
          parts: [function (st) { return A.sentence(['Bestimme $a$ exakt: $a=$ ', A.blank(st, 'a', gz.a, { model: A.num(gz.a), label: 'a' }), '.'], { name: '' }); }],
          tip: KP.tip('Setze die Koordinaten von $P$ ein: Der Graph geht durch $P$, wenn $f(' + gz.px + ')=' + gz.py + '$ gilt. Den Befehl `Löse` kannst du auch nach einer anderen Variablen lösen lassen, z. B. `Löse(a*8-4=3, a)`.')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche lernst du den CAS-Rechner kennen. Du wiederholst Funktionswerte, Wertetabellen, Nullstellen und Gleichungen aus den Wochen 1 und 2 – diesmal mit dem Rechner. Und du übst, die Ergebnisse in korrekter Schreibweise aufzuschreiben.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11]);
    }
  });
})();

</script>
<script>
// Woche 4: Nullstellen I – bekannte Verfahren (Sek-I-Wiederholung), Schreibweise, Schnittpunkte mit den Achsen
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, V = KP.V.w4, P = KP.P;

  KP.defineWeek({
    n: 4,
    order: ['einstieg', 'bedienung', 'linear', 'wurzel1', 'wurzel2', 'pq1', 'pq2', 'vergleich', 'schnitt', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Einstieg ----------
      var bsp = KP.graph({
        x: [-4, 4], y: [-3, 4], w: 300, step: [1, 1],
        curves: [{ f: function (x) { return 0.5 * x * x - 2; }, label: 'f', at: 2.9 }],
        points: [{ x: -2, y: 0, label: 'N_1', dx: -26, dy: 18 }, { x: 2, y: 0, label: 'N_2', dx: 7, dy: 18 }, { x: 0, y: -2, label: 'S_y', dx: 8, dy: 16 }],
        aria: 'Graph von f mit den Schnittpunkten N1, N2 und Sy'
      });
      var s1 = E.section('Nullstellen und Schnittpunkte', [
        A.box('Nullstelle und Schnittpunkt', [
          P('Eine **Nullstelle** einer Funktion $f$ ist eine Zahl $x$, für die $f(x)=0$ gilt. An einer Nullstelle schneidet oder berührt der Graph von $f$ die $x$-Achse.'),
          P('Der zugehörige Punkt $N(x|0)$ ist ein **Schnittpunkt mit der $x$-Achse**. Nullstellen sind also Zahlen, Schnittpunkte sind Punkte.'),
          P('Der **Schnittpunkt mit der $y$-Achse** hat die $x$-Koordinate 0: $S_y(0|f(0))$.'),
          h('figure', { class: 'fig' }, bsp, h('figcaption', null, KP.rich('Graph von $f$ mit $f(x)=\\frac{1}{2}x^2−2$: Nullstellen −2 und 2, Schnittpunkte $N_1(−2|0)$, $N_2(2|0)$ und $S_y(0|−2)$.')))
        ]),
        A.box('So schreibst du die Rechnung auf', [
          A.list([
            'Du beginnst mit dem **Ansatz** $f(x)=0$.',
            'Jede Umformung der Gleichung schreibst du in eine **neue Zeile** und beginnst sie mit dem Äquivalenzzeichen ⇔. Es bedeutet: Beide Gleichungen haben genau dieselben Lösungen.',
            'Formst du nur einen Term um, ohne dass sich die Gleichung ändert (z. B. unter der Wurzel ausrechnen), beginnt die neue Zeile mit =.',
            'Mehrere Lösungen verbindest du mit ∨. Du darfst auch das Wort „oder“ schreiben.',
            'Die Variable heißt in jeder Zeile $x$ – sie bekommt keine Nummer.',
            'Was du gerechnet hast, sieht man an der Umformung. Einen Rechenhinweis neben der Zeile schreibst du nicht auf.',
            'In der letzten Zeile steht das Ergebnis vollständig ausgerechnet: $x=…$. Wurzeln wie $\\sqrt{7}$ bleiben stehen – du rundest nicht.'
          ]),
          P('**Beispiel:** Nullstellen von $f$ mit $f(x)=\\frac{1}{2}x^2−2$ und $D_f=\\R$:'),
          ED.show(['f(x)=0', '<=>\\frac{1}{2}x^{2}−2=0', '<=>\\frac{1}{2}x^{2}=2', '<=>x^{2}=4', '<=>x=−2∨x=2']),
          P('Die Nullstellen von $f$ sind −2 und 2.')
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 Tastenfeld ----------
      var g1 = E.gen('bedienung', V.bedienung);
      var s2 = E.section('Zum Aufwärmen', [
        A.wayStep(E, 'bedienung', 'Eine lineare Funktion', {
          before: [P('Zum Aufwärmen eine lineare Funktion. Das Tastenfeld kennst du schon aus den Wochen 1 bis 3.'), A.howto()],
          task: 'Berechne die Nullstelle von $f$ mit $f(x)=' + g1.f + '$ und $D_f=\\R$.',
          T: g1.T, model: g1.model,
          okText: 'Richtig! So sieht ein sauberer Rechenweg aus.'
        }).el
      ]);

      // ---------- 3 lineare Gleichung ----------
      var g2 = E.gen('linear', V.linear);
      var s3 = E.section('Lineare Funktionen', [
        A.wayStep(E, 'linear', 'Nullstelle einer linearen Funktion', {
          task: 'Berechne die Nullstelle von $f$ mit $f(x)=' + g2.f + '$ und $D_f=\\R$.',
          T: g2.T, model: g2.model,
          tip: KP.tip('Kürze Brüche vollständig. Beispiel: $\\frac{10}{4}=\\frac{5}{2}$. Statt des Bruchs darfst du auch die Dezimalzahl schreiben: $2,5$.')
        }).el
      ]);

      // ---------- 4 Wurzelziehen ----------
      var g3 = E.gen('wurzel1', V.wurzel1), g4 = E.gen('wurzel2', V.wurzel2);
      var s4 = E.section('Wurzelziehen', [
        A.box('Erinnerung: Gleichungen der Form $x^2=a$', [
          P('Für $a>0$ hat $x^2=a$ zwei Lösungen: $x=−\\sqrt{a}∨x=\\sqrt{a}$, kurz $x=±\\sqrt{a}$. Beispiel: $x^2=9⇔x=−3∨x=3$, denn auch $(−3)^2=9$.'),
          P('Ist $a$ keine Quadratzahl, bleibt die Wurzel stehen: $x^2=5⇔x=±\\sqrt{5}$. Für $a<0$ gibt es keine Lösung.')
        ]),
        A.wayStep(E, 'wurzel1', 'Rein quadratisch', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g3.f + '$ und $D_f=\\R$.',
          T: g3.T, model: g3.model
        }).el,
        A.wayStep(E, 'wurzel2', 'Wurzel, die stehen bleibt', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g4.f + '$ und $D_f=\\R$.',
          T: g4.T, model: g4.model
        }).el
      ]);

      // ---------- 5 pq-Formel ----------
      var g5 = E.gen('pq1', V.pq1), g6 = E.gen('pq2', V.pq2);
      var s5 = E.section('Die pq-Formel', [
        A.box('Erinnerung: pq-Formel', [
          P('Eine quadratische Gleichung in **Normalform** $x^2+px+q=0$ löst du mit der pq-Formel:'),
          h('p', { class: 'formula' }, KP.M.view('x=−\\frac{p}{2}±\\sqrt{(\\frac{p}{2})^{2}−q}')),
          P('Ist der Term unter der Wurzel negativ, hat die Gleichung keine Lösung. Ist er 0, hat sie genau eine Lösung. Steht vor $x^2$ eine andere Zahl als 1, teilst du zuerst durch diese Zahl.'),
          P('**Beispiel:** $x^2−6x+5=0$ mit $p=−6$ und $q=5$:'),
          ED.show(['x^{2}−6x+5=0', '<=>x=3±\\sqrt{(−3)^{2}−5}', '=3±\\sqrt{4}', '=3±2', '<=>x=1∨x=5'])
        ]),
        A.wayStep(E, 'pq1', 'pq-Formel', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g5.f + '$ und $D_f=\\R$.',
          T: g5.T, model: g5.model,
          tip: KP.tip('Schreibe zuerst die Zeile mit den eingesetzten Werten. Achte bei negativen Zahlen auf Klammern: Für $q=−8$ steht unter der Wurzel $…−(−8)$.')
        }).el,
        A.wayStep(E, 'pq2', 'Erst die Normalform', {
          task: 'Berechne die Nullstellen von $f$ mit $f(x)=' + g6.f + '$ und $D_f=\\R$.',
          T: g6.T, model: g6.model,
          tip: KP.tip('Teile die Gleichung zuerst durch die Zahl vor $x^2$. Beispiel: $5x^2−10x−15=0⇔x^2−2x−3=0$.')
        }).el
      ]);

      // ---------- 6 Vergleich ----------
      var s6 = E.section('Welcher Weg ist der beste?', [
        E.tasks('vergleich', 'Lösungswege vergleichen', V.vergleich, {
          before: [P('Nicht jede quadratische Gleichung braucht die pq-Formel. Überlege bei jeder Gleichung, welcher Weg am schnellsten zum Ziel führt.')]
        }).el
      ]);

      // ---------- 7 Schnittpunkte ----------
      var g7 = E.gen('schnitt', V.schnitt);
      var s7 = E.section('Schnittpunkte mit den Achsen', [
        A.wayStep(E, 'schnitt', 'Nullstellen und Schnittpunkte', {
          task: ['Gegeben ist die Funktion $f$ mit $f(x)=' + g7.f + '$ und $D_f=\\R$.', 'a) Berechne die Nullstellen von $f$.'],
          T: g7.T, model: g7.model, wayLabel: 'a) Dein Rechenweg:',
          parts: [
