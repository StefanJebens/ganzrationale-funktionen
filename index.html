<script>
// Woche 9: Transformationen II – Strecken in y- und x-Richtung, Kombination mit Verschiebungen
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, A = KP.A, ED = KP.ED, M = KP.M, P = KP.P;

  function padd(a, b) { var r = []; for (var i = 0; i < Math.max(a.length, b.length); i++) r.push((a[i] || 0) + (b[i] || 0)); return r; }
  function pmul(a, b) { var r = new Array(a.length + b.length - 1).fill(0); a.forEach(function (x, i) { b.forEach(function (y, j) { r[i + j] += x * y; }); }); return r; }
  function compose(f, g) { var r = [0]; for (var i = f.length - 1; i >= 0; i--) r = padd(pmul(r, g), [f[i]]); return r; }
  function inner(c) { return c === 0 ? 'x' : 'x' + (c > 0 ? '−' + c : '+' + (-c)); }
  function sgn(d) { return d < 0 ? '−' + String(-d).replace('.', ',') : '+' + String(d).replace('.', ','); }
  function frac(v) { return A.num(v); }
  // exaktes Polynom aus Zahlen (Nenner bis 64)
  function exact(c) { return M.poly(c.map(function (v) { for (var d = 1; d <= 64; d++) { var z = Math.round(v * d); if (Math.abs(z / d - v) < 1e-9) return M.Q(z, d); } return M.Q(Math.round(v * 1000), 1000); })); }

  var V = KP.V.w9 = {
    ystreck: function (R) {
      var a = R.pick([2, 3, 0.5, -2, [1, 3]]), av = Array.isArray(a) ? a[0] / a[1] : a;
      var x0 = R.pick([3, -3]), fx0 = x0 * x0 - 4;
      return { a: av, aTxt: frac(av), x0: x0, y0: av * fx0, f: [-4, 0, 1], g: [-4 * av, 0, av] };
    },
    xstreck: function (R) {
      var b = R.pick([2, 3, 0.5]), r = R.pick([2, 3]);
      var f = [0, -r * r, 0, 1]; // x³ − r²x, Nullstellen −r, 0, r
      return { b: b, r: r, f: f, g: compose(f, [0, b]), zs: [-r / b, 0, r / b] };
    },
    unterscheiden: function (R) {
      var pool = [
        { t: '2·f(x)', g: function (x) { return 2 * (x * x - 1); } },
        { t: 'f(2x)', g: function (x) { return 4 * x * x - 1; } },
        { t: 'f(x)+2', g: function (x) { return x * x + 1; } },
        { t: 'f(x+2)', g: function (x) { return (x + 2) * (x + 2) - 1; } }
      ];
      return R.perm(4).map(function (i) { return pool[i]; });
    },
    kombi: function (R) {
      var a = R.pick([2, 3, -2, 0.5]), c = R.pick([-2, 1, 2, 3]), d = R.pick([-3, -1, 2, 4]);
      var g = padd(compose([0, 0, a], [-c, 1]), [d]);
      return { a: a, c: c, d: d, g: g, aTxt: A.dec(a) };
    },
    parameter: function (R) {
      var c = R.pick([1, 2, 3]), d = R.pick([-2, 1, 3]), dx = R.pick([2, -2, 3]), a = R.pick([2, 3, -1, 0.5]);
      var x0 = c + dx, y0 = a * dx * dx + d;
      return { c: c, d: d, x0: x0, y0: y0, a: a, k: dx * dx };
    },
    sach: function (R) {
      var v = R.pick([[50, 40, 10], [20, 20, 5], [100, 80, 20]]); // Maßstab 1:m, f(x) = −x²/k + h
      var m = v[0], k = v[1], hh = v[2];
      var w = Math.sqrt(k * hh); // halbe Breite des Bogens
      return { m: m, k: k, h: hh, w: w, g: [hh / m, 0, -m / k], mh: hh / m, mb: 2 * w / m };
    },
    papier: function (R) { return { c: R.pick([1, 2]), d: R.pick([3, 4]) }; },
    zusatz: function (R) { return { b: R.pick([2, 3, 4]) }; }
  };

  KP.defineWeek({
    n: 9,
    order: ['einstieg', 'lab', 'ystreck', 'xstreck', 'unterscheiden', 'kombi', 'parameter', 'sach', 'papier'],
    optional: { zusatz: 'papier' },
    render: function (E, root) {
      var T = E.T;

      // ---------- 1 Einstieg ----------
      var s1 = E.section('Graphen strecken', [
        A.box('Streckung in y-Richtung und in x-Richtung', [
          A.list([
            '$g(x)=a·f(x)$: **Streckung in $y$-Richtung mit dem Faktor $a$.** Jeder Punkt $(x|y)$ des Graphen wird zu $(x|a·y)$. Für $a>1$ wird der Graph gestreckt, für $0<a<1$ gestaucht, für $a<0$ zusätzlich an der $x$-Achse gespiegelt. Die Nullstellen bleiben gleich.',
            '$g(x)=f(b·x)$ mit $b>0$: **Streckung in $x$-Richtung mit dem Faktor $\\frac{1}{b}$.** Jeder Punkt $(x|y)$ wird zu $(\\frac{x}{b}|y)$. Für $b>1$ wird der Graph zur $y$-Achse hin gestaucht. Der Schnittpunkt mit der $y$-Achse bleibt gleich, die Nullstellen werden durch $b$ geteilt.'
          ]),
          A.fig({ x: [-3, 3], y: [-1, 6], w: 280, step: [1, 1], curves: [{ f: function (x) { return x * x; }, cls: 'ref', label: 'f', at: -2.2, ldx: -14 }, { f: function (x) { return 2 * x * x; }, label: 'g', at: 1.3 }, { f: function (x) { return 0.5 * x * x; }, cls: 'c2', label: 'h', at: 2.6 }], aria: 'Normalparabel, gestreckt und gestaucht' },
            '$f(x)=x^2$ (gestrichelt), $g(x)=2·f(x)$ ist in $y$-Richtung gestreckt, $h(x)=\\frac{1}{2}·f(x)$ gestaucht.')
        ]),
        A.box('Mehrere Schritte nacheinander', [
          P('Bei $g(x)=a·f(x−c)+d$ wird der Graph von $f$ zuerst mit dem Faktor $a$ in $y$-Richtung gestreckt und dann um $c$ in $x$-Richtung und um $d$ in $y$-Richtung verschoben. Die Reihenfolge ist wichtig: Verschiebst du zuerst nach oben und streckst dann, wird die Verschiebung mitgestreckt.')
        ]),
        E.tasks('einstieg', 'Kurz geprüft', T.einstieg).el
      ]);

      // ---------- 2 Labor ----------
      var lab = KP.lab({
        title: 'Strecken',
        intro: 'Der gestrichelte Graph gehört zu $f(x)=x^3−3x$ mit dem Hochpunkt $H(−1|2)$. Der blaue Graph gehört zu $g(x)=a·f(b·x)$. Beobachte, wohin der Hochpunkt wandert.',
        sliders: [
          { k: 'a', label: 'Faktor $a$ (vor $f$)', min: -3, max: 3, step: 0.5, v: 2, skip0: true },
          { k: 'b', label: 'Faktor $b$ (vor $x$)', min: 0.5, max: 3, step: 0.5, v: 1 }
        ],
        render: function (s) {
          var f = function (x) { return x * x * x - 3 * x; }, a = s.a, b = s.b;
          var hx = -1 / b, hy = 2 * a;
          var t = 'g(x)=' + (a === 1 ? '' : a === -1 ? '−' : A.dec(a) + '·') + 'f(' + (b === 1 ? '' : A.dec(b)) + 'x)';
          return [h('p', { class: 'lab-term' }, M.view(t)),
            KP.graph({ x: [-3, 3], y: [-7, 7], w: 300, h: 300, step: [1, 1], curves: [{ f: f, cls: 'ref' }, { f: function (x) { return a * f(b * x); }, label: 'g', at: 1.7 / Math.max(1, b) }],
              points: [{ x: -1, y: 2, cls: 'blue' }, { x: hx, y: hy, label: "H'", dx: 6, dy: hy > 0 ? -10 : 18, cls: 'c2' }], aria: 'Graphen von f und g' }),
            h('p', { class: 'lab-note' }, KP.rich('Der Hochpunkt $H(−1|2)$ von $f$ wird zu $(' + A.num(hx) + '|' + A.num(hy) + ')$.'))];
        }
      });
      var s2 = E.section('Entdecken', [
        lab,
        A.partsStep(E, 'lab', 'Was hast du beobachtet?', {
          parts: [function (st) {
            return A.sentence(['Der Faktor $a$ verändert die ', A.choice(st, 'a', ['$y$-Koordinaten', '$x$-Koordinaten'], 0, { R: E.rng('lab:a') }), ' der Punkte: Sie werden mit $a$ multipliziert. Der Faktor $b$ verändert die ',
              A.choice(st, 'b', ['$x$-Koordinaten', '$y$-Koordinaten'], 0, { R: E.rng('lab:b') }), ': Sie werden durch $b$ ', A.choice(st, 'op', ['geteilt', 'multipliziert'], 0, { R: E.rng('lab:op') }), '.'], { name: '' });
          }]
        }).el
      ]);

      // ---------- 3 Streckung in y-Richtung ----------
      var g3 = E.gen('ystreck', V.ystreck);
      var s3 = E.section('Streckung in y-Richtung', [
        A.partsStep(E, 'ystreck', 'Den Faktor bestimmen', {
          task: ['Der Graph von $g$ entsteht aus dem Graphen von $f(x)=x^2−4$ durch eine Streckung in $y$-Richtung. Er geht durch den Punkt $P(' + g3.x0 + '|' + A.num(g3.y0) + ')$.',
            A.fig({ x: [-4, 4], y: g3.a > 0 ? [Math.min(-4 * g3.a, -4) - 1, Math.max(5 * g3.a, 5) + 1] : [-12, 9], w: 280, h: 280, step: [1, g3.a > 1 || g3.a < -1 ? 2 : 1], grid: [1, 1],
              curves: [{ f: function (x) { return x * x - 4; }, cls: 'ref', label: 'f', at: 3.2, ldx: 6 }, { f: function (x) { return g3.a * (x * x - 4); }, label: 'g', at: 1.2, ldx: 8, ldy: g3.a > 0 ? 18 : -8 }], points: [{ x: g3.x0, y: g3.y0, label: 'P', dx: 6, dy: -8 }], aria: 'Graphen von f und g' })],
          parts: [
            function (st) { return A.sentence(['a) Es ist $f(' + g3.x0 + ')=$ ', A.blank(st, 'f', 5, { model: '5', label: 'Funktionswert' }), '. Der Streckfaktor ist also $a=$ ', A.blank(st, 'a', g3.a, { model: g3.aTxt, label: 'Streckfaktor' }), '.'], { name: 'a)' }); },
            function (st) { return A.termIn(st, 'g', { v: 'x', p: exact(g3.g) }, (g3.a === -1 ? '−' : g3.aTxt + '·') + '(x^{2}−4)', { text: 'b) Gib den Funktionsterm von $g$ an.', pre: 'g(x)=', name: 'b)' }); },
            function (st) { return A.sentence(['c) Die Nullstellen von $g$ sind ', A.blank(st, 'n1', -2, { model: '−2', label: 'kleinere Nullstelle' }), ' und ', A.blank(st, 'n2', 2, { model: '2', label: 'größere Nullstelle' }), '.'], { name: 'c)' }); }
          ],
          tip: KP.tip('Bei einer Streckung in $y$-Richtung wird jeder Funktionswert mit demselben Faktor multipliziert. Vergleiche die $y$-Koordinate von $P$ mit dem Funktionswert von $f$ an derselben Stelle.')
        }).el
      ]);

      // ---------- 4 Streckung in x-Richtung ----------
      var g4 = E.gen('xstreck', V.xstreck);
      var bTxt = A.dec(g4.b);
      var s4 = E.section('Streckung in x-Richtung', [
        A.partsStep(E, 'xstreck', 'Was passiert mit den Nullstellen?', {
          task: 'Gegeben ist $f(x)=' + A.term(g4.f) + '$ mit den Nullstellen $−' + g4.r + '$, 0 und ' + g4.r + '. Es sei $g(x)=f(' + bTxt + 'x)$.',
          parts: [
            function (st) { return A.sentence(['a) Der Graph von $g$ entsteht durch eine Streckung in $x$-Richtung mit dem Faktor ', A.blank(st, 'k', 1 / g4.b, { model: A.num(1 / g4.b), label: 'Streckfaktor' }), '.'], { name: 'a)' }); },
            function (st) { return A.result(st, 'n', { v: 'x', sols: g4.zs }, 'x=' + A.num(g4.zs[0]) + '∨x=0∨x=' + A.num(g4.zs[2]), { text: 'b) Gib alle Lösungen der Gleichung $g(x)=0$ an.', name: 'b)' }); },
            function (st) { return A.termIn(st, 'g', { v: 'x', p: exact(g4.g) }, '(' + bTxt + 'x)^{3}−' + g4.r * g4.r + '·' + bTxt + 'x', { text: 'c) Gib den Funktionsterm von $g$ an.', pre: 'g(x)=', name: 'c)' }); }
          ],
          tip: KP.tip('$g(x)=0$ bedeutet $f(' + bTxt + 'x)=0$. Also muss $' + bTxt + 'x$ eine Nullstelle von $f$ sein. Beispiel: Ist $f(5)=0$ und $g(x)=f(10x)$, dann ist $g(0,5)=0$.')
        }).el
      ]);

      // ---------- 5 Unterscheiden ----------
      var g5 = E.gen('unterscheiden', V.unterscheiden), L = ['A', 'B', 'C', 'D'];
      var t5 = g5.map(function (x) { return x.t; });
      var s5 = E.section('Vier Veränderungen unterscheiden', [
        E.tasks('unterscheiden', 'Welcher Term passt?', g5.map(function (x, i) {
          return { q: 'Welcher Term gehört zu Graph ' + L[i] + '?', o: t5.map(function (t) { return '$g(x)=' + t + '$'; }), a: i };
        }), {
          before: [P('Der gestrichelte Graph gehört jeweils zu $f(x)=x^2−1$.'), A.figRow(g5.map(function (x, i) {
            return { g: { x: [-4, 3], y: [-3, 5], w: 200, step: [1, 1], curves: [{ f: function (x) { return x * x - 1; }, cls: 'ref' }, { f: x.g }], aria: 'Graph ' + L[i] }, cap: 'Graph ' + L[i] };
          }), 'four')]
        }).el
      ]);

      // ---------- 6 Kombination ----------
      var g6 = E.gen('kombi', V.kombi), a6 = g6.a, c6 = g6.c, d6 = g6.d;
      var gt6 = (a6 === -1 ? '−' : g6.aTxt) + '(' + inner(c6) + ')^{2}' + sgn(d6);
      var T6 = { v: 'x', goal: 'kette', fns: { g: exact(g6.g) }, start: { name: 'g', arg: A.poly([0, 1]), text: 'g(x)' }, end: 'normal' };
      var sq = A.term(compose([0, 0, 1], [-c6, 1]));
      var s6 = E.section('Strecken und Verschieben', [
        A.wayStep(E, 'kombi', 'Scheitelpunkt und Normalform', {
          task: 'Gegeben ist $g(x)=' + gt6 + '$. Der Graph entsteht aus der Normalparabel. Berechne die Normalform von $g(x)$. Beginne mit $g(x)=' + gt6 + '$.',
          T: T6, model: ['g(x)=' + gt6 + '=' + g6.aTxt.replace(/^1$/, '') + (a6 === 1 ? '' : '·') + '(' + sq + ')' + sgn(d6) + '=' + A.term(g6.g)], keys: ['g(x)'], wayLabel: 'a) Deine Rechnung:',
          parts: [
            function (st) { return A.points(st, 's', [[c6, d6]], ['S(' + A.zahl(c6) + '|' + A.zahl(d6) + ')'], { text: 'b) Gib den Scheitelpunkt $S$ des Graphen von $g$ an.', name: 'b)', ph: 'z. B. S(1|2)', idBase: 'kombi-s' }); },
            function (st) {
              return A.sentence(['c) Die Normalparabel wird mit dem Faktor ', A.blank(st, 'a', a6, { model: g6.aTxt, label: 'Streckfaktor' }), ' in $y$-Richtung gestreckt, dann um ', A.blank(st, 'c', Math.abs(c6), { model: String(Math.abs(c6)), label: 'Verschiebung in x-Richtung' }), ' nach ',
                A.choice(st, 'cr', ['rechts', 'links'], c6 > 0 ? 0 : 1, { R: E.rng('kombi:cr') }), ' und um ', A.blank(st, 'd', Math.abs(d6), { model: String(Math.abs(d6)), label: 'Verschiebung in y-Richtung' }), ' nach ', A.choice(st, 'do', ['oben', 'unten'], d6 > 0 ? 0 : 1, { R: E.rng('kombi:do') }), ' verschoben.'], { name: 'c)' });
            }
          ],
          tip: KP.tip('Rechne zuerst die Klammer mit einer binomischen Formel aus, multipliziere dann mit dem Faktor davor und fasse zusammen.')
        }).el
      ]);

      // ---------- 7 Parameter bestimmen ----------
      var g7 = E.gen('parameter', V.parameter);
      var T7 = { v: 'a', start: 'gleichung', given: M.poly([M.Q(Math.round((g7.d - g7.y0) * 2), 2), M.Q(g7.k)]) };
      var s7 = E.section('Einen Streckfaktor berechnen', [
        A.wayStep(E, 'parameter', 'Durch einen Punkt', {
          task: 'Der Graph von $g$ mit $g(x)=a·(' + inner(g7.c) + ')^{2}' + sgn(g7.d) + '$ soll durch den Punkt $P(' + A.zahl(g7.x0) + '|' + A.num(g7.y0) + ')$ gehen. Berechne $a$. Setze dazu die Koordinaten von $P$ ein.',
          T: T7, model: ['a·(' + A.zahl(g7.x0) + inner(g7.c).slice(1) + ')^{2}' + sgn(g7.d) + '=' + A.num(g7.y0), '<=>' + g7.k + 'a' + sgn(g7.d) + '=' + A.num(g7.y0), '<=>' + g7.k + 'a=' + A.num(g7.y0 - g7.d), '<=>a=' + A.num(g7.a)],
          wayLabel: 'Dein Rechenweg:',
          tip: KP.tip('Beispiel mit $k(x)=a·(x−1)^2+4$ und $Q(3|12)$: $a·(3−1)^2+4=12⇔4a+4=12⇔4a=8⇔a=2$.')
        }).el
      ]);

      // ---------- 8 Sachaufgabe ----------
      var g8 = E.gen('sach', V.sach);
      var s8 = E.section('Anwendung: ein Modell im Maßstab', [
        A.partsStep(E, 'sach', 'Ein Brückenbogen im Modell', {
          task: ['Ein Brückenbogen wird durch $f(x)=−\\frac{1}{' + g8.k + '}x^2+' + g8.h + '$ beschrieben ($x$ und $f(x)$ in m). Für eine Ausstellung wird ein Modell im Maßstab 1 : ' + g8.m + ' gebaut. Sein Bogen wird durch $g(x)=\\frac{1}{' + g8.m + '}·f(' + g8.m + 'x)$ beschrieben (ebenfalls in m).',
            A.fig({ x: [-g8.w - 2, g8.w + 2], y: [-1, g8.h + 2], w: 320, h: 180, step: [g8.w > 15 ? 10 : 5, g8.h > 10 ? 5 : 2], grid: [g8.w > 15 ? 5 : 1, g8.h > 10 ? 5 : 1], yName: 'f(x)', curves: [{ f: function (x) { return -x * x / g8.k + g8.h; }, dom: [-g8.w, g8.w] }], aria: 'Brückenbogen' })],
          parts: [
            function (st) { return A.sentence(['a) Der Bogen wird in $x$-Richtung mit dem Faktor ', A.blank(st, 'fx', 1 / g8.m, { model: '\\frac{1}{' + g8.m + '}', label: 'Faktor in x-Richtung' }), ' und in $y$-Richtung mit dem Faktor ', A.blank(st, 'fy', 1 / g8.m, { model: '\\frac{1}{' + g8.m + '}', label: 'Faktor in y-Richtung' }), ' gestreckt.'], { name: 'a)' }); },
            function (st) { return A.termIn(st, 'g', { v: 'x', p: exact(g8.g) }, A.term(g8.g), { text: 'b) Gib den Funktionsterm von $g$ ohne $f$ an.', pre: 'g(x)=', name: 'b)' }); },
            function (st) { return A.sentence(['c) Das Modell ist ', A.blank(st, 'h', g8.mh, { model: A.dec(g8.mh), label: 'Höhe in m' }), ' m hoch und am Boden ', A.blank(st, 'b', g8.mb, { model: A.dec(g8.mb), label: 'Breite in m' }), ' m breit.'], { name: 'c)' }); }
          ],
          tip: KP.tip('Setze $' + g8.m + 'x$ für $x$ in den Term von $f$ ein und multipliziere danach mit $\\frac{1}{' + g8.m + '}$. Prüfe dein Ergebnis: Das Modell muss ' + g8.m + '-mal so klein sein wie die Brücke.')
        }).el
      ]);

      // ---------- 9 Papier ----------
      var s9 = E.section('Abschlussaufgabe auf Papier', [
        E.paper('papier', function (R) {
          var g = V.papier(R), c = g.c, d = g.d;
          var gt = '−2(x+' + c + ')^{2}+' + d;
          var gp = padd(compose([0, 0, -2], [c, 1]), [d]);
          return {
            title: 'Strecken und Verschieben',
            intro: 'Gegeben sind $f(x)=x^2$, $g(x)=' + gt + '$ und $p(x)=x^3−4x$.',
            parts: [
              { t: 'Beschreibe Schritt für Schritt, wie der Graph von $g$ aus dem Graphen von $f$ entsteht. Gib den Scheitelpunkt von $g$ an.', s: ['Streckung in $y$-Richtung mit dem Faktor −2 (gestreckt und an der $x$-Achse gespiegelt), dann Verschiebung um ' + c + ' nach links und um ' + d + ' nach oben. Scheitelpunkt $S(−' + c + '|' + d + ')$.'] },
              { t: 'Berechne die Normalform von $g(x)$.', s: [ED.show(['g(x)=' + gt + '=−2(x^{2}+' + 2 * c + 'x+' + c * c + ')+' + d + '=' + A.term(gp)], { nums: false })] },
              { t: 'Skizziere die Graphen von $f$ und $g$.', s: [A.fig({ x: [-5, 3], y: [-6, 6], w: 260, step: [1, 1], curves: [{ f: function (x) { return x * x; }, cls: 'ref', label: 'f', at: 1.8 }, { f: KP.polyFn(gp), label: 'g', at: -c + 1.2 }], aria: 'Graphen von f und g' })] },
              { t: 'Gib die Nullstellen von $q(x)=p(2x)$ an und begründe ohne Rechnung.', s: ['$p$ hat die Nullstellen −2, 0 und 2. Die Streckung in $x$-Richtung mit dem Faktor $\\frac{1}{2}$ halbiert sie: $q$ hat die Nullstellen −1, 0 und 1.'] }
            ]
          };
        }).el
      ]);

      // ---------- 10 Zusatz ----------
      var g9 = E.gen('zusatz', V.zusatz), b9 = g9.b;
      var T9 = { v: 'x', goal: 'kette', fns: { f: A.poly([0, 0, 1]) }, start: { name: 'f', arg: A.poly([0, b9]), text: 'f(' + b9 + 'x)' }, end: { name: 'f', arg: A.poly([0, 1]), f: b9 * b9, text: b9 * b9 + '·f(x)' } };
      var s10 = E.section('Zusatzaufgabe', [
        A.wayStep(E, 'zusatz', 'Zwei Streckungen, ein Graph', {
          optional: true, lockText: 'Gesperrt – erledige zuerst die Aufgabe auf Papier.', okText: KP.ZUSATZ_OK,
          task: 'Für die Normalparabel $f(x)=x^2$ gilt: Eine Streckung in $x$-Richtung mit dem Faktor $\\frac{1}{' + b9 + '}$ liefert denselben Graphen wie eine Streckung in $y$-Richtung. Zeige $f(' + b9 + 'x)=' + b9 * b9 + '·f(x)$. Beginne mit $f(' + b9 + 'x)=…$',
          T: T9, model: ['f(' + b9 + 'x)=(' + b9 + 'x)^{2}=' + b9 * b9 + 'x^{2}=' + b9 * b9 + '·f(x)'], keys: ['f( )', 'f(x)'], wayLabel: 'Deine Rechnung:',
          tip: KP.tip('Setze $' + b9 + 'x$ in Klammern für $x$ ein. Beim Quadrieren wird auch der Faktor quadriert: $(5x)^2=25x^2$.')
        }).el
      ]);

      return E.mount(root, { intro: 'In dieser Woche streckst du Graphen in $y$- und in $x$-Richtung und kombinierst Strecken und Verschieben.' },
        [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10]);
    }
  });
})();

<script>
// Anbindung an die Lernseiten-Datenbank: Schüler-Anmeldung, Speichern, Sitzung (ein Gerät je Name), Lehrerkonto
(function () {
  'use strict';
  var KP = window.KP, h = KP.h;
  var PID = KP.DATA.meta.pid;
  var DB = KP.db = { pid: PID, sid: null, bn: null, uid: null, status: 'start', meldung: '', offen: 0, fehler: false };
  var last = { json: {}, st: {} }, timers = [], abos = [], beobachtetBis = 0, letzterPuls = 0, selbst = false, anzeigen = [];
  var flush = Promise.resolve();
  // Hinweis aus dem letzten Neuladen (z. B. nach dem Abmelden des Lehrerkontos)
  try { DB.meldung = sessionStorage.getItem('ls.meldung') || ''; sessionStorage.removeItem('ls.meldung'); } catch (e) { /* ohne Sitzungsspeicher */ }

  function msg(t) { var e = new Error(t); e.lsText = t; return e; }
  function ort() { var s = location.hash.slice(1); return /^woche-\d{1,2}$/.test(s) ? s : 'start'; }
  function verwaist(se) {
    var t = LS.jetzt();
    return se.hg ? (se.akt || 0) < t - 960000 : (se.puls || 0) < t - 120000;
  }
  function abo(path, cb) {
    var ref = LS.ref(path);
    var f = ref.on('value', function (s) { cb(s.val()); }, function () { /* keine Berechtigung mehr */ });
    abos.push(function () { ref.off('value', f); });
  }
  function merkSchueler(on) {
    try {
      if (on) sessionStorage.setItem('ls.schueler', JSON.stringify({ sid: DB.sid, bn: DB.bn }));
      else sessionStorage.removeItem('ls.schueler');
    } catch (e) { /* ohne Sitzungsspeicher */ }
  }

  // Gab es in diesem Tab schon eine Anmeldung? Dann zuerst „Verbinde …“ zeigen.
  DB.erwartet = function () {
    try {
      if (sessionStorage.getItem('ls.schueler')) return true;
      for (var i = 0; i < sessionStorage.length; i++) if (/^firebase:authUser:/.test(sessionStorage.key(i))) return true;
    } catch (e) { /* egal */ }
    return false;
  };

  // ---------- Start: Lehrkraft oder Schüler aus diesem Tab wiederherstellen ----------
  DB.start = function () {
    DB.status = 'laden';
    var vorher = KP.mode;
    return LS.laden().then(function () { return LS.nutzer; }).then(function (u) {
      DB.status = 'bereit';
      if (LS.istLehrkraft(u)) { lehrerModus(); return; }
      var g = null;
      try { g = JSON.parse(sessionStorage.getItem('ls.schueler') || 'null'); } catch (e) { g = null; }
      if (g && u && u.isAnonymous) return wiederAnmelden(g, u);
      if (g) { merkSchueler(false); DB.meldung = 'Bitte melde dich neu an.'; }
    }).catch(function () { DB.status = 'fehler'; }).then(function () { return KP.mode !== vorher; });
  };

  // ---------- Lehrerkonto (Anmeldung in der Verwaltung) ----------
  function lehrerModus() {
    KP.mode = 'lehrer';
    KP.setTeacher(true);
    KP.tdata = {};
    LS.inaktiv.start({ frage: 'Bist du noch da?', abmelden: function () { DB.lehrerAbmelden('inaktiv'); } });
    LS.auth.onAuthStateChanged(function (u) { if (KP.mode === 'lehrer' && !LS.istLehrkraft(u)) DB.lehrerAbmelden('extern'); });
  }
  DB.lehrerAbmelden = function (grund) {
    if (KP.mode !== 'lehrer' || DB.status === 'abmelden') return Promise.resolve();
    DB.status = 'abmelden';
    LS.inaktiv.stop();
    if (KP.lehrerStop) KP.lehrerStop();
    try { sessionStorage.setItem('ls.meldung', grund === 'inaktiv' ? 'Du wurdest nach 16 Minuten ohne Eingabe abgemeldet.' : 'Du bist abgemeldet.'); } catch (e) { /* egal */ }
    // Danach neu laden: Die Seite arbeitet dann wieder mit der Geräte-Anmeldung für Schüler.
    return LS.abmelden().catch(function () { /* egal */ }).then(function () {
      try { history.replaceState(null, '', location.pathname + location.search + '#start'); } catch (e) { /* egal */ }
      location.reload();
    });
  };

  // ---------- Schüler-Anmeldung ----------
  DB.anmelden = function (eingabe) {
    var bn = String(eingabe || '').trim();
    if (!bn) return Promise.reject(msg('Bitte gib deinen Benutzernamen ein.'));
    if (DB.status === 'fehler') return Promise.reject(msg('Keine Verbindung zur Datenbank. Du kannst im Testmodus üben.'));
    var sid = null;
    return LS.laden().then(function () { return LS.geraet(); }).then(function (u) {
      DB.uid = u.uid;
      return LS.lesen('namen/' + LS.namen.schluessel(bn));
    }).then(function (n) {
      if (!n) throw msg('Diesen Benutzernamen gibt es nicht.');
      if (n.bn !== bn) throw msg('Achte auf Groß- und Kleinschreibung.');
      sid = n.sid;
      return LS.lesen('freigabe/' + PID + '/' + sid);
    }).then(function (f) {
      if (f !== true) throw msg('„' + KP.DATA.meta.name + '“ ist für dich noch nicht freigeschaltet. Frag deine Lehrkraft.');
      return LS.lesen('sperren/' + sid + '/' + DB.uid);
    }).then(function (sp) {
      if (sp && sp > LS.jetzt()) throw msg('Deine Lehrkraft hat dich gerade abgemeldet. In zwei Minuten kannst du dich auf diesem Gerät wieder anmelden.');
      return LS.lesen('sitzungen/' + sid);
    }).then(function (se) {
      if (se && se.uid !== DB.uid && !verwaist(se)) throw msg('Dieser Name ist gerade auf einem anderen Gerät angemeldet.');
      return LS.ref('sitzungen/' + sid).set({ uid: DB.uid, projekt: PID, seit: LS.TS, puls: LS.TS, akt: LS.TS, hg: false, ort: ort() });
    }).then(function () {
      DB.sid = sid;
      DB.bn = bn;
      return datenLaden();
    }).then(aktivieren).catch(function (e) {
      if (DB.sid && KP.mode !== 'schueler') { LS.ref('sitzungen/' + DB.sid).remove().catch(function () {}); }
      if (KP.mode !== 'schueler') { DB.sid = null; DB.bn = null; }
      if (e.lsText) throw e;
      var code = String((e && (e.code || e.message)) || '');
      if (/network|zeit|laden/i.test(code)) throw msg('Keine Verbindung zur Datenbank.');
      if (/operation-not-allowed|admin-restricted-operation|unauthorized-domain|too-many-requests/.test(code)) throw msg(LS.fehlertext(e));
      throw msg('Die Anmeldung hat nicht geklappt' + (e && e.code ? ' (' + e.code + ')' : '') + '. Versuche es noch einmal.');
    });
  };
  function wiederAnmelden(g, u) {
    DB.uid = u.uid;
    return LS.lesen('sitzungen/' + g.sid).then(function (se) {
      if (!se || se.uid !== u.uid) throw msg('Du wurdest abgemeldet. Melde dich neu an.');
      DB.sid = g.sid;
      DB.bn = g.bn;
      return LS.ref('sitzungen/' + g.sid).update({ puls: LS.TS, hg: false, ort: ort(), akt: LS.TS });
    }).then(datenLaden).then(aktivieren).catch(function (e) {
      merkSchueler(false);
      DB.sid = null;
      DB.bn = null;
      DB.meldung = e.lsText || 'Bitte melde dich neu an.';
    });
  }
  function datenLaden() {
    var base = PID + '/' + DB.sid;
    return Promise.all([LS.lesen('daten/' + base), LS.lesen('status/' + base)]).then(function (r) {
      var daten = r[0] || {}, status = r[1] || {};
      var d = { weeks: {} };
      last = { json: {}, st: {} };
      Object.keys(daten).forEach(function (k) {
        var m = /^w(\d+)$/.exec(k);
        if (!m) return;
        try { d.weeks[m[1]] = JSON.parse(daten[k]); last.json[m[1]] = daten[k]; } catch (e) { /* kaputt: neu */ }
      });
      // Fortschritt geht nur nach vorn: was als gelöst gemeldet ist, bleibt gelöst
      Object.keys(status).forEach(function (wk) {
        var n = wk.slice(1), w = d.weeks[n] = d.weeks[n] || {};
        w.solved = w.solved || {}; w.tries = w.tries || {}; w.ans = w.ans || {};
        Object.keys(status[wk] || {}).forEach(function (id) {
          var s = status[wk][id] || {};
          if (s.g && !w.solved[id]) w.solved[id] = 1;
          var t = (s.f || 0) + (s.g ? 1 : 0);
          if ((w.tries[id] || 0) < t) w.tries[id] = t;
          last.st[n + '/' + id] = { g: !!s.g, f: s.f || 0 };
        });
        if (JSON.stringify(w) !== last.json[n]) last.json[n] = null;
      });
      if (daten.seed) d.seed = daten.seed;
      KP.data = d;
      // Anmeldung zählt als Aktivität („Zuletzt aktiv“ in der Übersicht)
      LS.ref('zuletzt/' + base).set(LS.TS).catch(function () { /* nicht schlimm */ });
      if (!d.seed) {
        d.seed = Math.floor(Math.random() * 1e9).toString(36) + Date.now().toString(36);
        return LS.ref('daten/' + base + '/seed').set(d.seed);
      }
    });
  }
  function aktivieren() {
    KP.mode = 'schueler';
    KP.setTeacher(false);
    DB.meldung = '';
    DB.fehler = false;
    selbst = false;
    merkSchueler(true);
    abo('sitzungen/' + DB.sid, function (v) {
      if (KP.mode !== 'schueler' || selbst) return;
      if (!v || v.uid !== DB.uid) weg(v ? 'anderes' : 'lehrkraft');
    });
    abo('beobachtet/' + DB.sid, function (v) { beobachtetBis = v || 0; if (beobachtetBis > LS.jetzt()) puls(); });
    timers.push(setInterval(takt, 1000));
    LS.inaktiv.start({ frage: 'Bist du noch ' + DB.bn + '?', abmelden: function () { DB.abmelden('inaktiv'); }, weiter: function () { puls(); } });
    document.addEventListener('visibilitychange', sichtbar);
    anzeige();
  }

  // ---------- Lebenszeichen ----------
  function takt() {
    if (KP.mode !== 'schueler') return;
    if (beobachtetBis > LS.jetzt() || Date.now() - letzterPuls >= 30000) puls();
  }
  function puls() {
    if (KP.mode !== 'schueler' || !DB.sid || beendet) return Promise.resolve();
    letzterPuls = Date.now();
    hgGemeldet = !!document.hidden && !beendet;
    return LS.ref('sitzungen/' + DB.sid).update({ puls: LS.TS, hg: hgGemeldet, ort: ort(), akt: Math.round(LS.inaktiv.letzte() + LS.offset) })
      .catch(function () { /* Sitzung weg: das Abo meldet ab */ });
  }
  // Tab geschlossen oder Seite verlassen: nicht als „Hintergrund“ melden. Der Name wird dann nach 2 Minuten frei.
  var beendet = false, hgGemeldet = false;
  window.addEventListener('pagehide', function (e) {
    if (KP.mode !== 'schueler' || e.persisted) return;
    beendet = true;
    if (hgGemeldet && DB.sid) LS.ref('sitzungen/' + DB.sid).update({ puls: LS.TS, hg: false }).catch(function () {});
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted && KP.mode === 'schueler') { beendet = false; puls(); } });
  function sichtbar() {
    if (KP.mode !== 'schueler' || beendet) return;
    if (!document.hidden && (Date.now() - LS.inaktiv.letzte()) * LS.zeit >= LS.IDLE + LS.GRACE) { DB.abmelden('inaktiv'); return; }
    puls();
  }
  DB.ortGeaendert = function () { if (KP.mode === 'schueler') puls(); };

  // ---------- Speichern ----------
  function statusVon(n, w) {
    var def = KP.WEEKS[n];
    if (!def || !w) return {};
    var ids = def.order.concat(Object.keys(def.optional || {})), out = {};
    ids.forEach(function (id) {
      var g = !!(w.solved && w.solved[id]), t = (w.tries && w.tries[id]) || 0;
      if (!g && !t) return;
      out[id] = { g: g, f: Math.max(0, t - (g ? 1 : 0)) };
    });
    return out;
  }
  DB.statusVon = statusVon;
  DB.speichern = function () {
    if (KP.mode !== 'schueler' || !DB.sid) return flush;
    var upd = {}, any = false, weeks = (KP.data && KP.data.weeks) || {}, base = PID + '/' + DB.sid;
    Object.keys(weeks).forEach(function (n) {
      var w = weeks[n], j = JSON.stringify(w);
      if (j !== last.json[n]) { upd['daten/' + base + '/w' + n] = j; last.json[n] = j; any = true; }
      var st = statusVon(+n, w);
      Object.keys(st).forEach(function (id) {
        var v = st[id], k = n + '/' + id, o = last.st[k];
        if (o) {
          if (o.g && !v.g) v.g = true;
          if (v.f < o.f) v.f = o.f;
          if (o.g === v.g && o.f === v.f) return;
        }
        upd['status/' + base + '/w' + n + '/' + id] = v;
        last.st[k] = v;
        any = true;
      });
    });
    if (!any) return flush;
    upd['zuletzt/' + base] = LS.TS;
    DB.offen++;
    anzeige();
    var p = LS.ref('').update(upd).then(function () { DB.fehler = false; }).catch(function () {
      DB.fehler = KP.mode === 'schueler';
      Object.keys(upd).forEach(function (k) {
        var m = /^daten\/[^/]+\/[^/]+\/w(\d+)$/.exec(k);
        if (m) last.json[m[1]] = null;
        var m2 = /^status\/[^/]+\/[^/]+\/w(\d+)\/([^/]+)$/.exec(k);
        if (m2) delete last.st[m2[1] + '/' + m2[2]];
      });
    }).then(function () { DB.offen--; anzeige(); });
    flush = flush.then(function () { return p; });
    return p;
  };

  // ---------- Abmelden ----------
  function aufraeumen() {
    timers.forEach(clearInterval);
    timers = [];
    abos.forEach(function (f) { f(); });
    abos = [];
    LS.inaktiv.stop();
    document.removeEventListener('visibilitychange', sichtbar);
    merkSchueler(false);
    KP.mode = 'test';
    DB.sid = null;
    DB.bn = null;
    DB.offen = 0;
    DB.fehler = false;
    beobachtetBis = 0;
    last = { json: {}, st: {} };
    KP.data = KP.ladeLokal();
  }
  function zurStart() {
    if (location.hash !== '#start') location.hash = '#start'; else KP.route();
  }
  function weg(grund) {
    aufraeumen();
    DB.meldung = grund === 'anderes' ? 'Du wurdest abgemeldet: Dein Name wurde auf einem anderen Gerät angemeldet.' : 'Deine Lehrkraft hat dich abgemeldet.';
    zurStart();
  }
  DB.abmelden = function (grund) {
    if (KP.mode !== 'schueler') return Promise.resolve();
    selbst = true;
    var sid = DB.sid;
    return DB.speichern().catch(function () {}).then(function () {
      return LS.ref('sitzungen/' + sid).remove().catch(function () {});
    }).then(function () {
      aufraeumen();
      DB.meldung = grund === 'inaktiv' ? 'Du wurdest nach 16 Minuten ohne Eingabe abgemeldet.' : 'Du bist abgemeldet.';
      zurStart();
    });
  };

  // ---------- Anzeige: gespeichert? ----------
  DB.speicherAnzeige = function () {
    var el = h('span', { class: 'save-state', id: 'save-state', role: 'status' });
    anzeigen.push(el);
    anzeige();
    return el;
  };
  function anzeige() {
    anzeigen = anzeigen.filter(function (el) {
      if (document.body.contains(el)) { el.lsDrin = true; return true; }
      return !el.lsDrin;
    });
    anzeigen.forEach(function (el) {
      var cls = 'ok', t = 'Gespeichert';
      if (LS.verbunden === false) { cls = 'bad'; t = 'Keine Verbindung – wird später gespeichert'; }
      else if (DB.offen > 0) { cls = 'wait'; t = 'Speichert …'; }
      else if (DB.fehler) { cls = 'bad'; t = 'Nicht gespeichert'; }
      el.className = 'save-state ' + cls;
      el.textContent = t;
    });
  }
  LS.onVerbindung(function () { anzeige(); });
})();

<script>
// Lehreransicht: Wochenübersicht je Lerngruppe, Schüleransicht über alle Wochen, Live-Ansicht, Export, Abmelden, Zurücksetzen
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, D = KP.DATA;
  var PID = KP.DATA.meta.pid;
  var S = leer(), abos = [], tick = null, ansicht = null, live = null;
  var wahl = { gruppe: null, woche: 1 };
  try { var w0 = JSON.parse(sessionStorage.getItem('ls.ueb') || 'null'); if (w0) wahl = w0; } catch (e) { /* egal */ }
  function leer() { return { gruppen: {}, schueler: {}, status: {}, zuletzt: {}, sitzungen: {}, da: {} }; }
  function merk() { try { sessionStorage.setItem('ls.ueb', JSON.stringify(wahl)); } catch (e) { /* egal */ } }
  function sortDe(a, b) { return String(a).localeCompare(String(b), 'de', { sensitivity: 'base' }); }
  function weekByN(n) { for (var i = 0; i < D.weeks.length; i++) if (D.weeks[i].n === n) return D.weeks[i]; return null; }

  // ---------- Daten ----------
  function abonnieren() {
    if (abos.length) return;
    [['gruppen', 'gruppen'], ['schueler', 'schueler'], ['status', 'status/' + PID], ['zuletzt', 'zuletzt/' + PID], ['sitzungen', 'sitzungen']].forEach(function (a) {
      var ref = LS.ref(a[1]);
      var f = ref.on('value', function (s) { S[a[0]] = s.val() || {}; S.da[a[0]] = true; neu(); }, function () { /* keine Berechtigung */ });
      abos.push(function () { ref.off('value', f); });
    });
    tick = setInterval(function () { if (ansicht) ansicht.status(); }, 5000);
  }
  KP.lehrerStop = function () {
    abos.forEach(function (f) { f(); });
    abos = [];
    clearInterval(tick);
    liveZu();
    S = leer();
    ansicht = null;
  };
  var nt = null;
  function neu() { clearTimeout(nt); nt = setTimeout(function () { if (ansicht) ansicht.inhalt(); if (live) live.status(); }, 60); }
  function bereit() { return S.da.gruppen && S.da.schueler && S.da.status && S.da.zuletzt && S.da.sitzungen; }

  var ZEICHEN = 'Zeichen: ✓ gelöst (Zahl: Fehlversuche vor der Lösung) · ● aktuelle Aufgabe (Zahl: Fehlversuche) · ✗ noch nicht gelöst';
  function excelWoche(g, n) {

    list.forEach(function (s) {

        .concat(z.z.map(function (c) { return { v: zelleText(c), s: ART[c.art] }; }),

    LS.speichern(blob, LS.dateiname(D.meta.datei + '_' + g.name + '_Woche_' + (n < 10 ? '0' : '') + n) + '.xlsx');
  }
  function excelSchueler(sid) {

    var gn = Object.keys(s.gr || {}).filter(function (g) { return S.gruppen[g]; }).map(function (g) { return S.gruppen[g].name; }).join(', ');
    var rows = [[{ v: D.meta.longTitle + ' · ' + s.vn + ' ' + s.nn + ' (' + s.bn + ')' + (gn ? ' · ' + gn : ''), s: X.titel }],
      [{ v: stand() + ' · zuletzt aktiv: ' + wann((S.zuletzt || {})[sid], 'abs'), s: X.klein }], []];
    var head = [{ v: 'Woche', s: X.kopf }, { v: 'Thema', s: X.kopf }];
    for (var i = 0; i < max; i++) head.push({ v: String(i + 1), s: X.kopf });

  }
  var FARBE = { ok: [200, 230, 201], akt: [255, 236, 179], offen: [255, 205, 210], nix: [214, 217, 222] };
  var STIFT = { ok: [27, 94, 32], akt: [176, 110, 0], offen: [183, 28, 28] };
  function pdfZelle(d, x, y, w, hh, c) {
    if (!c) { d.rect(x, y, w, hh, { fill: FARBE.nix, stroke: [170, 176, 184], lw: 0.4 }); return; }
    d.rect(x, y, w, hh, { fill: FARBE[c.art], stroke: [170, 176, 184], lw: 0.4 });
    var s = symbol(c), cx = x + (s.zahl ? w * 0.38 : w / 2), cy = y + hh / 2, sz = Math.min(hh, w) * 0.62;
    if (c.art === 'ok') d.haken(cx, cy, sz, STIFT.ok);

    var x2 = x + 13 + d.breite('gelöst (Zahl: Fehlversuche vor der Lösung)', 8) + 14;

  function pdfTabelle(d, o) {

    }
    seite();
    o.zeilen.forEach(function (r) {

      r.links.forEach(function (t) {
        var w = o.breiten[i++];
        d.rect(x, y, w, rowH, { stroke: [170, 176, 184], lw: 0.4 });
        d.text(x + 4, y + rowH / 2 + 3.3, d.kuerzen(t, w - 7, 9, i === 1), { size: 9, bold: i === 1 });

      kopf: kopfT, links: 1, breiten: breiten, rowH: 22,
      zeilen: D.weeks.map(function (wk) {

<script>
// Startseite, Wochenseiten und Navigation
(function () {
  'use strict';
  var KP = window.KP, h = KP.h, S = KP.svg, D = KP.DATA;
  var app = document.getElementById('app');
  var cleanup = null;

  function weekByN(n) { for (var i = 0; i < D.weeks.length; i++) if (D.weeks[i].n === n) return D.weeks[i]; return null; }

  // ---------- gemeinsame Bausteine ----------
  KP.modeChip = function () {
    if (KP.mode === 'lehrer') return h('span', { class: 'chip teacher', id: 'mode-chip' }, 'Lehrerkonto');
    if (KP.mode === 'schueler') return h('span', { class: 'chip student', id: 'mode-chip', title: 'Angemeldet' }, KP.db.bn);
    return h('span', { class: 'chip test', id: 'mode-chip', title: 'Gespeichert wird nur in diesem Browser.' }, 'Testmodus');
  };

  KP.weekBar = function (wk, prog) {
    var right = h('div', { class: 'tb-right' }, prog, KP.modeChip());
    if (KP.mode === 'schueler') right.appendChild(KP.db.speicherAnzeige());
    if (KP.mode === 'lehrer') right.appendChild(h('a', { class: 'btn small ghost', href: '#uebersicht', id: 'zur-uebersicht' }, 'Übersicht'));
    if (KP.mode === 'test' || KP.teacher) {
      var reset = h('button', { type: 'button', class: 'btn small ghost', id: 'week-reset' }, 'Von vorne beginnen');
      reset.addEventListener('click', function () {
        KP.confirm('Woche ' + wk.n + ' von vorne beginnen?',
          'Alle Eingaben und gelösten Aufgaben dieser Woche werden gelöscht.', 'Von vorne beginnen')
          .then(function (yes) { if (yes) { KP.resetWeek(wk.n); route(); } });
      });
      right.appendChild(reset);
    }
    return h('header', { class: 'topbar wkbar' },
      h('a', { class: 'back', href: '#start' }, '← Alle Wochen'),
      h('div', { class: 'tb-title' }, h('span', { class: 'tb-n' }, 'Woche ' + wk.n), h('span', { class: 'tb-t' }, wk.title)),
      right);
  };

  KP.weekProgress = function (n) {
    var d = KP.teacher ? KP.tdata : KP.data;
    var wd = d.weeks && d.weeks[n];
    var sol = (wd && wd.solved) || {};
    var def = KP.WEEKS[n], order = def ? def.order : [];
    var done = 0;
    order.forEach(function (id) { if (sol[id]) done++; });
    return { done: done, total: Math.max(1, order.length) };
  };

  // ---------- Bild: Graph einer ganzrationalen Funktion mit ihren Nullstellen ----------
  function heroArt() {
    var f = KP.polyFn(KP.A.fromRoots(0.16, [-3, 1, 4]));
    var svg = KP.graph({
      x: [-5, 6], y: [-3, 4], w: 470, step: [1, 1], cls: 'hero-art', noTicks: true,
      curves: [{ f: f, label: 'f', at: 4.75, ldx: 10, ldy: 0 }],
      points: [{ x: -3, y: 0, label: 'N_1', dx: -30, dy: -10 }, { x: 1, y: 0, label: 'N_2', dx: -26, dy: 22 }, { x: 4, y: 0, label: 'N_3', dx: -32, dy: 22 }],
      aria: 'Zeichnung: Graph einer ganzrationalen Funktion mit drei Nullstellen'
    });
    return svg;
  }
  function brandIcon() {
    var svg = S('svg', { class: 'brand-icon', viewBox: '0 0 40 40', 'aria-hidden': 'true' });
    svg.appendChild(S('rect', { x: 1, y: 1, width: 38, height: 38, rx: 9, class: 'bi-bg' }));
    svg.appendChild(S('path', { d: 'M 6 20 L 34 20 M 20 6 L 20 34', class: 'bi-ax' }));
    svg.appendChild(S('path', { d: 'M 6 32 C 11 8, 17 10, 20 20 S 29 32, 34 8', class: 'bi-curve' }));
    return svg;
  }

  // ---------- Startseite ----------
  function loginArea() {
    var DB = KP.db;
    var note = h('p', { class: 'login-note', id: 'login-note', role: 'status', 'aria-live': 'polite' }, DB.meldung || '');
    if (DB.meldung) note.className = 'login-note info-note';
    if (KP.mode === 'lehrer') {
      var ab = h('button', { type: 'button', class: 'btn small', id: 'lehrer-abmelden' }, 'Abmelden');
      ab.addEventListener('click', function () { DB.lehrerAbmelden('selbst'); });
      return h('div', { class: 'login' }, KP.modeChip(),
        h('a', { class: 'btn small primary', href: '#uebersicht', id: 'zur-uebersicht' }, 'Übersicht'),
        h('a', { class: 'btn small ghost', href: '../verwaltung/#start', id: 'zur-verwaltung' }, 'Verwaltung'), ab);
    }
    if (KP.mode === 'schueler') {
      var out = h('button', { type: 'button', class: 'btn small', id: 'logout-btn' }, 'Abmelden');
      out.addEventListener('click', function () { out.disabled = true; DB.abmelden('selbst'); });
      return h('div', { class: 'login' }, h('span', { class: 'login-as' }, 'Angemeldet als'), KP.modeChip(), DB.speicherAnzeige(), out);
    }
    var nameIn = h('input', {
      type: 'text', id: 'login-name', class: 'login-in', placeholder: 'Benutzername',
      autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Benutzername'
    });
    var loginBtn = h('button', { type: 'button', class: 'btn primary', id: 'login-btn' }, 'Anmelden');
    function login() {
      DB.meldung = '';
      note.className = 'login-note';
      note.textContent = 'Melde an …';
      loginBtn.disabled = true;
      DB.anmelden(nameIn.value).then(function () {
        if (location.hash !== '#start') location.hash = '#start'; else route();
      }).catch(function (e) {
        loginBtn.disabled = false;
        note.className = 'login-note bad';
        note.textContent = e.lsText || 'Die Anmeldung hat nicht geklappt.';
      });
    }
    loginBtn.addEventListener('click', login);
    nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    KP.startStatus = function () {
      if (!document.body.contains(note)) return;
      if (DB.status === 'fehler') { note.className = 'login-note bad'; note.textContent = 'Keine Verbindung zur Datenbank. Du kannst im Testmodus üben.'; }
      else if (DB.meldung && !note.textContent) { note.className = 'login-note info-note'; note.textContent = DB.meldung; }
    };
    setTimeout(KP.startStatus, 0);
    return h('div', { class: 'login' }, h('div', { class: 'login-field' }, nameIn), loginBtn, KP.modeChip(), note);
  }
  function renderStart() {
    var top = h('header', { class: 'topbar start-bar' },
      h('a', { class: 'brand', href: '#start' }, brandIcon(), h('span', null, D.meta.title)),

      h('div', { class: 'hero-text' },
        h('h1', { class: 'hero-title' }, 'Ganzrationale Funktionen'),
        h('p', { class: 'hero-sub' }, 'Mathematik · Einführungsphase'),
        h('p', { class: 'hero-lead' }, 'Lesen, rechnen, entdecken, üben – eine Woche nach der anderen.')),
      heroArt()));

    var info = h('div', { class: 'info', id: 'start-info' },
      KP.mode === 'lehrer'
        ? [h('p', null, h('strong', null, 'Lehrerkonto: '), 'Alle Aufgaben sind freigeschaltet, Lösungen lassen sich anzeigen und einsetzen. Es wird nichts gespeichert.'),
          h('p', null, h('a', { class: 'btn small primary', href: '#uebersicht' }, 'Zur Übersicht der Lerngruppen'))]
        : KP.mode === 'schueler'
          ? [h('p', null, h('strong', null, 'Angemeldet als ' + KP.db.bn + ': '), 'Dein Fortschritt wird gespeichert. Du kannst auf jedem Gerät weiterarbeiten.'),
            h('p', null, 'Deine Lehrkraft sieht deinen Fortschritt und deine Eingaben, auch live. Wenn du fertig bist, tippe oben auf „Abmelden“.')]
          : [h('p', null, h('strong', null, 'Testmodus: '), 'Dein Fortschritt wird nur in diesem Browser auf diesem Gerät gespeichert. Melde dich oben mit deinem Benutzernamen an, dann wird er gespeichert.'),
            h('p', null, 'Nach der Anmeldung sieht deine Lehrkraft deinen Fortschritt und deine Eingaben, auch live.'),
            !KP.storageOk ? h('p', { class: 'warn' }, 'Dieser Browser erlaubt kein Speichern. Dein Fortschritt geht beim Schließen der Seite verloren.') : null]);

    var grid = h('div', { class: 'wgrid' }, D.weeks.map(function (wk) {
      var p = KP.weekProgress(wk.n);
      var state = p.done === 0 ? 'new' : p.done >= p.total ? 'done' : 'part';
      var status = state === 'new' ? 'Noch nicht begonnen' : state === 'done' ? 'Erledigt' : p.done + ' von ' + p.total + ' Aufgaben';
      return h('a', { class: 'wcard ' + state, href: '#woche-' + wk.n, id: 'wcard-' + wk.n },
        h('span', { class: 'wc-top' }, h('span', { class: 'wc-n' }, 'Woche ' + wk.n), wk.tag ? h('span', { class: 'wc-tag' }, wk.tag) : null),
        h('span', { class: 'wc-t' }, wk.title),
        h('span', { class: 'wc-bar' }, h('span', { style: 'width:' + (100 * p.done / p.total).toFixed(1) + '%' })),
        h('span', { class: 'wc-s' }, status));
    }));

    app.appendChild(top);
    app.appendChild(hero);
    app.appendChild(h('main', { class: 'start' }, info, h('h2', { class: 'start-h' }, 'Wochen'), grid,
      h('p', { class: 'start-foot' }, 'Texte, Aufgaben und Grafiken: eigene Erstellung')));
    return null;
  }

  // ---------- Live-Ansicht im eingebetteten Rahmen (nur Anzeige, nichts speichern) ----------
  function ansichtModus() {
    KP.mode = 'ansicht';
    KP.teacher = false;
    document.body.classList.add('ansicht');
    app.textContent = '';
    app.appendChild(h('p', { class: 'live-wait' }, 'Warte auf Daten …'));
    var lastN = null;
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || e.source !== window.parent) return;
      var m = e.data;
      if (!m || m.typ !== 'zeige') return;
      var wk = weekByN(+m.n);
      if (!wk) return;
      var y = lastN === m.n ? window.scrollY : 0;
      lastN = m.n;
      KP.data = { seed: m.seed || 'ohne', weeks: {} };
      KP.data.weeks[m.n] = m.week || {};
      if (cleanup) { try { cleanup(); } catch (x) { /* egal */ } cleanup = null; }
      app.textContent = '';
      cleanup = KP.renderWeek(app, wk);
      window.scrollTo(0, y);
    });
    window.parent.postMessage({ typ: 'bereit' }, location.origin);
  }

  // ---------- Navigation ----------
  function route() {
    if (KP.mode === 'ansicht') return;
    if (cleanup) { try { cleanup(); } catch (e) { /* egal */ } cleanup = null; }
    if (KP.liveZu) KP.liveZu();
    var name = '';
    try { name = decodeURIComponent(location.hash.slice(1)); } catch (e) { name = location.hash.slice(1); }
    var m = /^woche-(\d{1,2})$/.exec(name);
    var wk = m ? weekByN(+m[1]) : null;
    var ov = /^uebersicht(?:-s-(.+))?$/.exec(name);
    if (KP.ED) KP.ED.hide();
    app.textContent = '';
    document.body.classList.toggle('is-teacher', KP.teacher);
    if (ov && KP.mode === 'lehrer') {
      cleanup = KP.renderUebersicht(app, ov[1] || null);
      document.title = 'Übersicht · ' + D.meta.title;
    } else if (wk) {
      cleanup = KP.renderWeek(app, wk);
      document.title = 'Woche ' + wk.n + ': ' + wk.title + ' · ' + D.meta.title;
    } else {
      cleanup = renderStart();
      document.title = D.meta.longTitle;
    }
    window.scrollTo(0, 0);
    if (KP.db && KP.db.ortGeaendert) KP.db.ortGeaendert();
  }
  KP.route = route;
  function renderLaden() {
    app.textContent = '';
    app.appendChild(h('header', { class: 'topbar start-bar' }, h('a', { class: 'brand', href: '#start' }, brandIcon(), h('span', null, D.meta.title))));
    app.appendChild(h('main', { class: 'start' }, h('p', { class: 'loading', id: 'verbinde' }, 'Verbinde mit der Datenbank …')));
  }
  if (window.self !== window.top && location.hash === '#live') { ansichtModus(); return; }
  window.addEventListener('hashchange', route);
  if (KP.db.erwartet()) {
    renderLaden();
    KP.db.start().then(route);
  } else {
    route();
    KP.db.start().then(function (geaendert) { if (geaendert) route(); else if (KP.startStatus) KP.startStatus(); });
  }
})();

</script>
</body>
</html>
